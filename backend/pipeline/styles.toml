# Art-style presets for Stage 2's prompt suffix. Each generation appends
# whichever preset is selected in the widget's Style dropdown to Stage 2's
# imagery, the same way the old fixed style.toml suffix always did — only
# now there's more than one to pick from.
#
# "symbolist" was the one that stuck from Phase 3's original style review
# and stayed the default. Curated down to 5 on 2026-09-07 (cut artdeco,
# dystopianwwii, surreal — see CHANGELOG.md for the review method and
# reasoning) after a batch of test renders across all 8 originals made
# clear which ones were redundant or too generic to keep, then grew back
# to 7 the same day with ukiyoe/illuminated (sourced from a user-supplied
# reference guide, see CHANGELOG.md). Add more presets here freely — each
# needs a "label" (shown in the dropdown), a "suffix"
# (appended verbatim to every Stage 2 prompt),
# and a "guidance" (below) — a one-line description of what kind of
# imagery this style can actually depict, fed to Stage 2 itself so it
# doesn't invent imagery the style has no vocabulary for (e.g. a
# grounded/representational style being asked to render "a body made of
# pure sound-wave energy" — added 2026-09-07, see CHANGELOG.md; every
# preset needs one, not just the representational ones, since it's what
# tells Stage 2 abstraction is *allowed* for the visionary styles too).

[symbolist]
label = "Symbolist / Visionary"
suffix = "painterly, visionary symbolist painting in the tradition of Odilon Redon, Remedios Varo, Leonora Carrington, and Hilma af Klint's illuminated visions — strange, hand-painted, not digital or photographic"
guidance = "A visionary/allegorical tradition — abstract, symbolic, or dreamlike forms (bodies dissolving into pattern, pure allegorical shapes) are natural here, alongside concrete objects and figures."

[engraving]
label = "Antique Engraving"
suffix = "antique astronomical engraving, fine linework, star atlas illustration, sepia and ink tones, detailed etching"
guidance = "An illustrative, diagrammatic tradition — depicts discrete objects, figures, and symbolic diagrams in fine engraved linework. Avoid glowing/immaterial energy forms that can't be rendered as etched line art."

[cosmic]
label = "Cosmic / Nebula"
suffix = "ethereal cosmic art, nebula and starfield, dreamlike aurora colors, soft glowing light, painterly, otherworldly"
guidance = "A visionary, abstract-friendly tradition — energy, light, nebulae, and dreamlike or symbolic forms are all welcome here, alongside concrete subjects."

# Rewritten 2026-09-07 from actual research (see CHANGELOG.md), not general
# impression — the original suffix wrongly called for "watercolor" character
# rendering. Ghibli characters are flat cel-shaded (solid base color, one
# hard-edged darker shadow tone, crisp clean outlines) — backgrounds are the
# painted half, in opaque poster paint/gouache (not watercolor), wet-into-wet
# for soft skies/clouds then sharp detail added as it dries. Keep that
# character/background technique split if this is revised again.
#
# Revised again same day: the first version described character rendering
# unconditionally, which the image model read as an instruction to include
# a person — confirmed via a 3-sample test, it invented an unrequested
# figure in a purely architectural Stage 2 prompt 2 of 3 times. The
# character clause is now explicitly gated behind "only if a person is
# already part of the scene" and leads with the background description
# instead (which applies to every image, figure or not). Re-tested 0 of 3
# on the same architectural prompt, and confirmed it still renders figures
# correctly when a base prompt actually calls for them.
#
# guidance rewritten 2026-09-08 (external review of a user-requested
# quality dossier — see CHANGELOG.md/CONTEXT.md): everything above fixed
# *rendering* (suffix wording), but the real failure mode observed on
# no-figure registers (e.g. a bare "architectural" prompt that read as
# Magritte-style surrealism, not Ghibli) was a *content* problem — "Ghibli"
# is not just a rendering technique like an engraving or a color-grade you
# can apply to any subject, it's an authored world (nature reclaiming
# structures, weather as presence, humble objects treated with reverence,
# rural vernacular architecture, wide low horizons). Stage 2 was never
# told any of that — the old guidance only said what to avoid. Widened
# guidance from a pure prohibition into a vocabulary Stage 2 can actually
# draw content from, on top of the retained prohibition.
#
# suffix split into suffix_base/suffix_figures 2026-09-08 (same review):
# hasPeople is already computed by Stage 2 and already used for the
# image-quality tier — this preset now also uses it for suffix assembly
# (see load_style_suffix()/build() in llm_pipeline.py). suffix_figures is
# appended only when a figure is actually in the prompt, so the character-
# rendering clause below is no longer dead text on the ~88% of real ghibli
# generations that have no person in them. This also retires the negative-
# instruction hack ("do not add a person... unless one is already
# described above") from 2026-09-07 above: a suffix that never mentions
# character rendering on a figure-free generation cannot itself induce an
# uninvited figure, so the sentence is now structurally unnecessary — kept
# it in this comment, not in suffix_base, so the historical lesson (an
# unconditional character-rendering description reads as an instruction to
# include one) isn't lost. Re-tested against the same kind of real
# figure-free architectural prompt that originally triggered the bug: 0/3
# figure-injections with the negative sentence removed, confirming the
# structural fix alone (not the negative sentence) is what's actually
# doing the work now.
#
# suffix_base/suffix_figures rewritten 2026-09-08 (same review, immediate
# follow-up): the 2026-09-07 research above was correct about the actual
# technique (flat cel-shaded characters vs. gouache/wet-into-wet
# backgrounds) but was written in process vocabulary — "opaque gouache/
# poster color," "wet-into-wet," "tonal layering," naming background
# painter Kazuo Oga by name — which describes *how a human made it*, not
# what the finished frame looks like. An image model has weak associations
# for process/medium/artist-name terminology (a background painter is far
# more thinly represented in training data than the films themselves) and
# much stronger ones for described visual outcomes. Rewritten to keep the
# same research-grounded technique distinction but state it as what's
# actually visible in frame: saturated layered greenery, hard-edged sunlit
# cumulus clouds, visible brushwork, clear foreground/middle/horizon
# depth, heightened-not-muted color for the background half; flat color/
# single hard shadow/crisp outlines stated plainly (already outcome-
# language, barely changed) for the figure half. Net effect on suffix
# length: unchanged (~52 words) on the ~88% of generations with no figure
# — the word-count win from the split above was already banked by cutting
# suffix_figures entirely on those, not by this rewrite — and down from
# ~120 to ~83 words combined on a generation that does have one.
#
# guidance revised again 2026-09-08 (register-collapse fix, found during
# the 12-register verification sweep the widened-guidance rewrite above
# was itself supposed to validate): fixed Ghibli-recognizability
# comprehensively (12/12 real renders read as genuinely Ghibli, including
# the exact "architectural" failure case that motivated the rewrite), but
# 5 of the 10 non-figure/crowd registers (geological, bodily and
# anatomical, mechanical, atmospheric, ritual object) collapsed into the
# same cozy domestic-kitchen scene regardless of assigned register — the
# guidance's own "recurring subjects" list was strong and specific enough
# to out-compete "material register to draw from" for content invention.
# Reframed guidance from "recurring subjects" (read as a substitute
# content menu) to "qualities for rendering whatever your register calls
# for" (a texture/mood layer applied to the register's own subject, never
# a replacement for it), with an explicit instruction not to default to a
# domestic interior. Paired with a matching addition to STAGE2_SYSTEM
# itself (register names the subject; the style's world textures it) so
# the same fix applies to every world-style, not just this one. Re-tested
# the 5 failed registers plus 2 controls (domestic interior, crowd / the
# collective) against the same fixed reading/signature as the original
# sweep — see CHANGELOG.md for the result.
# guidance extended again 2026-09-09 (symbolic-depth work — see
# CHANGELOG.md and TASK-symbolic-depth.md): the pipeline now requires every
# image to carry an "intrusion", an object belonging to a different world
# from the rest of the scene, present and unexplained. The concern was that
# ghibli is the worst-case style for that — its world is pastoral warmth
# and reverence for humble detail, which sands a strange object down into
# charm — and that the fix would be to switch styles.
#
# That concern turns out to be wrong about Ghibli specifically, and the
# correction belongs in guidance rather than in a style change: this world
# is *full* of the genuinely strange treated as utterly ordinary. A castle
# walking on chicken legs, a bathhouse staffed by gods, a cat that is also
# a bus, an abandoned sky-city, a rusting biplane in a flower field. What
# makes those read as Ghibli rather than as generic fantasy is that they
# are heavy, weathered, physically solid and mundanely lit, and that the
# characters are not astonished by them. That is exactly the register an
# intrusion needs, so the guidance now names it — without it, Stage 2 reads
# the rest of this world description as "keep everything homely" and quietly
# drops the intrusion or turns it into something twee.
# CHARTER, 2026-09-20. Replaces this preset's `guidance`, which is deleted
# below. Every prohibition that field carried is preserved here, because each
# one was a measured fix and not an opinion: no abstract energy-beings (the
# style cannot render them), do not default to a cottage kitchen (the
# 2026-09-08 register-collapse bug, where 5 of 10 non-figure registers turned
# into the same domestic scene), and scenes are not obliged to be warm.
#
# The old field had to be a world, a prohibition and a plea in one paragraph.
# The charter separates those, and `forbids` is the part that must survive
# verbatim in substance -- if a register collapses again, look there first.
[ghibli.world]
era = "Early-industrial in feeling, but its engineering is impossible and nobody minds. Machines walk, fly, breathe steam and have faces; a building may have legs; a vehicle may be an animal. They are hand-built, far oversized for their job, patched, and kept running by someone who loves them. Technology here is a character, not a backdrop."
materials = "Timber, riveted iron, canvas, rope, poured concrete going green, glazed tile, enamelled metal, thatch, cut stone softened by moss. These ordinary materials are what the impossible things are built from: the flying machine is canvas and bicycle parts, the walking house is scavenged roofing and iron legs."
physics = "Impossible things obey ordinary physics. They have weight, they cast shadows, they rust, they are lit like everything else, and the ground takes their load. Nothing glows of its own accord, nothing is translucent, and nothing floats without a visible reason — a thing that could be rendered as a light effect does not belong here. The wonder is that something enormous and impossible is also heavy and worn."
society = "Small settlements where work is done by hand and people are known by name. Institutions are distant; the weather and the land are close. Spirits, gods and creatures share the place and hold jobs in it, and no one finds this worth remarking on."
weather = "Weather is a presence and often a threat, and it runs the whole range: hard-edged cumulus over a deep blue sky, flat grey overcast, fog that hides the far side of a field, rain that means it, snow, dusk, full night. Wind moves through everything. Pick the weather the day calls for rather than defaulting to fine — this world is at least as itself in bad weather as in good."
inhabitants = "Children and the old; working people known by name; creatures the size of houses with their own purposes and no interest in being watched; spirits that have taken a shape and a trade; machines that someone tends and that may be awake."
strangeness = "The genuinely strange is completely unremarkable. Enormous unexplained machinery rusting in a meadow, a creature the size of a house asleep among ordinary trees, a derelict flying city, a shrine crowded with objects nobody living remembers the use of. Such things are heavy, weathered, physically solid and lit exactly like everything around them, and nobody in the frame is astonished by them."
numinous = "Spirits are ordinary residents. They take a body, a size and a job — a bathhouse worker, a river that is also somebody, a soot-coloured swarm that carries coal, a boar the length of a field, a forest thing that turns its head. They are solid, they displace air, they leave prints, and they are lit like everything else. People greet them, avoid them, or work alongside them without comment. Never a glow, a mist or a translucency — if it could be painted as a light effect it is not one of these."
dread = "This world at its darkest is not a different world, it is this one with the other face turned out. Gods and creatures are maimed, sickened, or boiling with something under the skin; a thing the length of a hillside can be in agony and destroying everything it crosses. Industry eats the forest and the people doing the eating have good reasons. Violence is sudden, physical and costly — an arm taken off, a wound that will not close, a curse spreading up a limb — and it is never relished by the frame. Nobody here is simply good or simply bad, and the image should not tell you whom to side with."
favoured_actors = "This world is richest in creatures with their own purposes, part-human figures, spirits holding a trade, swarms, and machines that may be awake. A lone ordinary person is the least interesting inhabitant available and should not be the default — reach for the others first where the constellation allows one."
# `forbids` removed 2026-09-20 at Garrett's direction: a poorly introduced
# control from too far back in the iteration process. A charter says what
# a world IS; it should not need a list of what it is not.
#
# What went with it, so the history is not lost: the no-energy-beings ban
# (now carried by `physics`, which says a thing renderable as a light
# effect does not belong here), the 2026-09-08 cottage-kitchen rule, and a
# clause that was permission rather than prohibition -- that scenes here
# are not obliged to be warm and may hold dread, decay and blight. Some of
# that permission survives in `weather`. If ghibli drifts pleasant, or if a
# register collapses into a kitchen again, this is the change that did it.

# BRIEF, 2026-09-26. Stage 2's style-specific rules, moved here verbatim from
# stage2_image_prompt, where they were hardcoded for every style. They were
# written for this world. Each is phrased as a count and a failure condition
# because the brief is the part Stage 2 obeys, and mood words are not obeyed.
#
# THE IMPOSSIBLE: until it existed wonder was only DESCRIBED in the charter
# and nothing required it, so a world of walking machines reliably produced a
# plausible flour mill. A charter says what MAY exist; only the brief makes
# something appear. {wonder}/{wonderTone} are filled from the dial.
#
# OPENNESS: these are wallpapers; an enclosed room reads as claustrophobic at
# desktop size however good its content. "Open means depth, not daylight" was
# added 2026-09-26: without it, dark cells resolved "half the frame open" as
# a lit sky.
[ghibli.brief]
impossible = "THE IMPOSSIBLE — applies to every image: at least one thing in frame could not exist, and nothing in the scene treats it as remarkable. Not a decorated version of an ordinary thing: a machine that is clearly alive or awake, a creature far too large for its kind, a structure that walks or floats or grew where it stands, a being that is plainly not a person. Build it from this world's own materials, give it real weight and wear, light it like everything else, and let the actor work around it the way they would a wall. An image in which everything could exist is a failed response.\n    How much of the frame it takes: {wonder}\n    What temper it is in: {wonderTone}\n    SCALE MUST READ. Put something of known human size next to it — a figure, a doorway, a cart, a gate — close enough in frame to measure it against. A huge thing photographed alone is just a texture; it only becomes huge beside something that is not."
openness = "OPENNESS — applies to every image, whatever the numbers above say: at least half the frame must be open. Sky, horizon, landscape, sea, or a distance that keeps going. Open means depth, not daylight: a night sky, a drop into dark or lit depths, or fog that keeps going all count, and how bright the open part is comes from the light line below, not from this rule. Pull the viewpoint back far enough that this is true. If the scene is indoors, the room must open onto that distance through a large window, a doorway, a missing wall or a broken roof, and what is seen through it must occupy a substantial part of the frame rather than being a bright rectangle in a corner. A fully enclosed interior is a failed response, and so is a close-up that crops the world out."

[ghibli]
label = "Studio Ghibli"
# suffix_base split 2026-09-20: TECHNIQUE ONLY. It used to also mandate
# "towering cumulus clouds with hard-edged sunlit tops against a deep blue sky"
# and "warm naturalistic low sunlight" on EVERY ghibli image, which made it the
# last fixed instruction overriding a variable one. Measured: on the darkest
# cell available (hard/hi, exposure lo) the dial asked for "most of the frame
# unlit or obscured" and a strangeness that is "dangerous, diseased or
# grieving", and the render came back a sunny meadow with a friendly turtle.
# The suffix was vetoing both the light axis and the wonder tone, and probably
# always had been.
#
# Weather, palette and time of day now come from the dial (light, wonderTone)
# and from the charter's `weather`, which describes a RANGE rather than one
# state. What stays here is what is true of a ghibli frame at any hour: layered
# opaque paint, visible brushwork, heightened colour, and -- added explicitly,
# because this is what stops a dark day going grey and grimdark -- saturation
# that survives shadow. Mononoke's night forest is dark and still richly
# coloured.
#
# RISK, stated plainly: the cumulus-against-blue clause was one of the
# strongest recognisability cues, and the 2026-09-08 sweep put ghibli at 12/12.
# If recognisability drops, this is the change that did it, and the fix is to
# move that clause into the charter's `weather` as a bright-day option rather
# than back into the suffix.
suffix_base = "Studio Ghibli feature-film animation style. Hand-painted backgrounds in layered opaque paint with visible brushwork in foliage, stone, cloth and water; forms built from stacked paint rather than smooth digital gradients; colour heightened rather than muted, and still saturated in shadow, in rain and at night rather than draining to grey; fine detail held even in the darkest parts of the frame."
suffix_figures = " Figures rendered in flat cel-shaded color with a single hard-edged shadow tone, never soft-blended, clean crisp outlines, large expressive almond eyes, simple minimal features, human-like proportions rather than typical anime stylization; only the one or two nearest figures have fully drawn faces, and any figure further back is drawn the way this style draws background crowds — turned away, in profile, or with features reduced to a few simple strokes and no fine detail"
# guidance removed 2026-09-20: superseded by [ghibli.world] above. Its
# world-description became the charter's fields; its prohibitions went to
# `forbids`, which was itself removed later the same day -- see the note
# in the charter block for where each one went. Both are in git history.

# CHARTER, 2026-09-26. Written from scratch in one grilling session with
# Garrett rather than retrofitted, so all ten fields were decided together.
# The old `guidance` and bare `suffix` are both deleted below; nothing in them
# was carried across on purpose.
#
# The decisions, so the reasoning survives the prose:
#   - USED FUTURE, not chrome and not the matrix. Heavy, analog, patched. It is
#     the only cyberpunk that obeys the rule that impossible things are heavy
#     and worn; chrome runs on glow and the matrix puts its wonder somewhere
#     that cannot be painted.
#   - EVERY LIGHT HAS A HOUSING (physics). Ghibli could say "nothing glows";
#     here light is the main material, so the rule is that light is hardware.
#     No holograms. This is what shuts out the glowing AI, and it is why the
#     old "avoid abstract energy-beings" ban no longer needs saying.
#   - NUMINOUS = whatever has grown past its makers (infrastructure or
#     flesh-machine, any scale) AND old gods moved into hardware. Both are
#     tended with offerings. The numinous field also carries the
#     automaton/presence boundary: still doing its designed job = automaton;
#     outgrown it and being fed = presence.
#   - STRANGENESS points elsewhere on purpose -- older or more alive than the
#     city, and never worshipped -- or it collapses into the numinous.
#   - The DIAL RUNS BOTH WAYS. Ghibli's bug was refusing to go dark; this
#     genre's is refusing to go light, so `weather` names daylight explicitly
#     and `dread` must be darker than the rain-and-night baseline.
#   - favoured_actors demotes the lone figure in the rain, this genre's
#     equivalent of Ghibli's lone ordinary person.
# REVISED 2026-09-26, same day, after the first six-cell (a) sweep (cp-a-*):
# the technique held but the world read as dieselpunk harbour, not cyberpunk.
# No neon in 12/12 (physics only described light as a housing rule, never said
# the city is saturated with it); harbour in 12/12 ("port city" + "dock hands"
# collapsed every register into a waterfront -- the cottage-kitchen bug again);
# the lo-exposure cells came back overcast or sunset (weather's "rain at night
# is not the default" argued with the dial); and charter phrases came back as
# lettered slogans. Fixes: physics/materials make lit signage and exposed
# electricity the city's main light; society adds verticality and demotes the
# port to one district; weather gives darkness a home (night, lower levels);
# strangeness and society lose their example lists; suffix_base asks for
# mostly unreadable lettering.
# REVISED again 2026-09-26 after cp-a3-*: neon was absent in 36/36 renders,
# and every sign that did appear was crowded with generated words, which come
# out as nonsense. physics now makes neon the after-dark light and says it is
# mostly SHAPE (pictogram, single character, arrow, border) seen from below,
# edge-on or blurred; society only allows scripts "where lettering shows at
# all"; suffix_base turns unreadable lettering into a depth-of-field
# instruction, which image models obey better than "do not write text".
[cyberpunk.world]
era = "A future that arrived decades ago and has been patched ever since. Nothing is new: machines are retrofitted onto older machines, towers are built over the roofs of earlier towers, and every system runs on parts from three generations of manufacturers. The technology is powerful and it is old, and most of it is kept alive by people who were never meant to maintain it."
materials = "Stained concrete, sheet steel, corrugated plastic, rack steel, ribbed conduit, bent glass tube, enamel, tin, tarpaulin, rust and grease — and electricity everywhere and exposed: cable bundled, taped and hanging in swags between buildings, junction boxes, transformers humming on brackets, neon and lit panels stacked up every facade. Repairs are visible and never match what they repair."
physics = "The city is lit by its own hardware, and after dark and in the lower levels at any hour that light is neon: bent glass tube in every colour, packed so densely that it tints the air, the haze and every wet surface. Most of it is shape rather than words — a pictogram, a single character, an arrow, a border, a bowl or a fish or a cross traced in tube — and it is seen the way you see it in a crowded street: from below, edge-on, from behind, or blurred by rain and distance. Every light has a body: the tube sits on brackets with a transformer behind it, a screen has a bezel and a cable, a sign has a back you could walk behind. Light never floats free, never forms a figure and never stands in for one — there are no holograms. Impossible things here are heavy, bolted down, dripping, and lit like everything around them."
society = "A city built upward because it has nowhere else to go: towers packed so close their walls touch, walkways and cables strung between them, lower levels that have not seen the sky in decades. It belongs to no single culture — migrant districts layered over each other, and where lettering shows at all it is in many scripts and not only East Asian ones. Institutions are distant, sealed behind glass high above the street, and deny that anything below them is alive; the street feeds it anyway. Life is markets, stairwells, workshops, housing blocks, clinics and transit, and most work is done by hand. There is a port, and it is one district among many."
weather = "Weather runs the whole range: flat white overcast, smog-orange dawn, dry heat haze off concrete, drizzle, fog, downpour, full night. Daylight reaches the roofs and the upper streets; below them it is always dusk under the signs. When the day calls for darkness, this city's darkness is night, or the lower levels, lit only by its own signs and screens. When it calls for light, it is the same city by day, and just as much itself."
inhabitants = "Working people whose bodies have been repaired: bolted prosthetics, scar lines where something was fitted, ports taped at the edges, secondhand parts that do not match the rest of the body and need oiling. Hawkers, riggers, cooks, couriers, repair techs, the old and the very young. Old gods walk here too, in hardware bodies, and a figure that is part animal is more often one of those — a mythological hybrid whose other half is beast and salvaged machine at once — than anything grown in a lab."
strangeness = "Things older or more alive than the city, left where they are and unremarked — an animal, a living thing, a relic of some earlier age of the world, lodged among the machinery as if it had always been there. Nobody explains them and nobody worships them; offerings are what mark the numinous, and these have none."
numinous = "The numinous is whatever has grown past its makers, and the old gods who have moved into hardware. The first can be any size: a vending machine that answers back, a server hall that has grown into a cathedral, a transit line running trains nobody scheduled, a mass of flesh and machine fused beyond anyone's ownership that is plainly alive and plainly someone. The second are loa, kami, saints and spirits who have taken a salvaged body — a shrine built around a robot torso, a river god living in a storm drain. Both are physical, heavy and tended: candles, stickers, food, grease-pencil prayers, a technician who is also a priest. A machine still doing the job it was built for is not one of these; one that has outgrown its job and is being fed is. Never a glow, a projection or a voice from nowhere — it has a body you could put your hand on."
dread = "This city at its darkest is not simply this city at night in the rain. It is the body failing — a prosthetic rejected, flesh grown around metal that should have come out; infrastructure giving way — a tower leaning, water rising through the lower levels, a district going dark; a person owned, collateral in someone else's contract; and the numinous fenced off, leased and metered, its shrine behind a turnstile. Violence is sudden, mechanical and costly, never glamorous, and the frame does not admire the corporation or the gun."
favoured_actors = "This world is richest in hands at repair work, crowds at the market, the platform and the stairwell, the numinous in its tended bodies, figures joined by hauling or mending the same thing, the dead and the decommissioned, and swarms — rats, pigeons, physical drones. A lone figure standing in the rain under a sign is this genre's most worn image and should not be the default — reach for the others first where the constellation allows one."

# BRIEF, 2026-09-26. Cyberpunk's own rules in place of ghibli's (see
# [ghibli.brief]); decided in the chartering session.
#   depth  -- replaces OPENNESS. Keeps the wallpaper from being claustrophobic,
#             which was OPENNESS's real job, without demanding sky: this world
#             is enclosed density, and "half the frame open" argued with it.
#   neon   -- the charter's neon was optional and was skipped in 36/36 renders.
#             Shape, not words: generated lettering comes out as nonsense.
#   tended -- care amid decay: street religion and maintained bodies.
#   temper -- NOT one of the three chosen rules; added because dropping THE
#             IMPOSSIBLE also dropped the only place {wonderTone} reached
#             Stage 2, so hard and soft days would lose their temper. Delete it
#             if polarity should not reach this world that way.
# THE IMPOSSIBLE is deliberately absent: strangeness arrives through presence
# and the mandatory anomaly, and the risk observed in the (a) renders ran
# toward fantasy, not toward the plausible.
[cyberpunk.brief]
depth = "DEPTH — applies to every image: the eye must travel a long way into the frame. Down a canyon between towers, along a walkway or a platform, through layer behind layer of cable, tube, stair and facade, each smaller and hazier than the last. It does not need sky. At least three distinct layers of distance must be visible behind the nearest subject. A shallow scene with a wall close behind the subject is a failed response, and so is a close-up that crops the city out."
neon = "NEON AFTER DARK — whenever the light line below puts the scene at night or below where daylight reaches, the main light in the frame is neon: bent glass tube in colour, on its brackets, tinting the haze and every wet surface. Name at least two neon fixtures and say what shape each one traces — a pictogram, a single character, an arrow, a border — never what words it spells. A dark frame lit only by lamps, bulbs or candles is a failed response, and so is a sign made mostly of words. By day the tube may still be there, unlit."
tended = "THE TENDED — applies to every image: something in the frame is being kept going by hand. A repair in progress, an offering being set down, a machine being fed, oiled or patched, a body being fixed. Show the hands or the tools, or the fresh evidence of the work — new tape over old, a candle still burning, a panel left open. If there is an actor this is their business; if there is none, the evidence is enough. A frame in which everything is simply abandoned is a failed response."
temper = "TEMPER — the anomaly, and anything numinous in the frame, is in this temper: {wonderTone}"

# REGISTERS, 2026-09-26. How this world realises each substance register, one
# span-and-principle line per register -- never an inventory (see
# registers.toml's [guidance] header): anything listed marks the range and is
# a starting point to reach past. Drafted family by family with Garrett.
#
# NOT YET READ BY ANY CODE. The pipeline picks the register after Stage 1.5
# has already cast the scene, so a register line would be painted over (a
# 20-register sweep collapsed to one scene: cp-reg20-base, and ghibli the same
# in gh-reg20-dry). The agreed fix is to pick the register first and hand
# Stage 1.5 and Stage 2 the day's line only; that pipeline work comes next.
[cyberpunk.registers]
"botanical" = "What grows here grows in spite of the city, or because someone had nowhere else to grow it: weeds in gutters and stair cracks, roots splitting a ramp, vines riding the cable swags, and the deliberate kind (racks under grow-lamps, balcony pots, a rooftop plot fenced with scrap). The plant is the subject and the city is what it grows through; it is either tended or slowly winning."
"bodily and anatomical" = "The body as a thing that is maintained, bought and failing: the seam where flesh meets steel, sutures and scar lines, a port opened for service, a prosthetic laid out on a back-clinic table, parts kept cold in jars. At the far end, flesh grown around metal until neither can be separated. Clinical and unsentimental, never gore."
"fungal and decaying" = "Rot is the city's other maintenance crew. It spreads along the city's own wet paths (condensation, leaks, drains, flooded basements): mould blooming across ductwork, rust eating through a stair, fungus furring a dead server rack, insulation gone soft. It is slow, specific and patient, and it is winning somewhere nobody looks."
"animal and creaturely" = "The animals that live off the city: rats, pigeons, crows, feral cats, eels in the drains, fish in market tanks, a working animal wherever no machine was cheaper, and cheap engineered pets gone feral. They use the infrastructure as their own terrain (cable runs as paths, vents as dens, neon as warmth), and nobody is sentimental about them."
"geological" = "The city is a geological layer too. Poured concrete stacks in strata, each decade's over the last, spalling to show its aggregate; in the deepest levels the older ground finally shows through (bedrock sweating in a sub-basement, a cliff the towers are bolted to, a sinkhole that swallowed a street, landfill cut open in section). Stone here is either the city pretending to be permanent or the thing underneath that actually is."
"metallic and ore" = "Metal is the city's money. It is stripped from walls, sold by weight, melted in a backroom crucible and poured again: copper wire in coils, sheet steel, rebar pulled from ruins, scrap sorted by hand into heaps by colour and grade, patina and rust worn like a record of every owner. Nothing metal is new; everything has already been something else."
"glass and ceramic" = "Glass divides this city. Above, it is sealed and clean, the windows of the institutions. Below, it is bent, cracked and reused: neon tube being heated and shaped in a workshop, porcelain insulators the size of barrels, crazed screens, bottle glass set into walls, glazed tile in a noodle shop or a bathhouse worn through to the clay. The substance is both what the powerful hide behind and what the street makes its light from."
"architectural" = "Architecture here is accretion, not design. No building is one building: the original frame is a skeleton under decades of unauthorised additions (rooms cantilevered off a balcony, a floor added in sheet metal, a stair bolted to the outside, a bridge two neighbours built between their windows). Look at the joins, where one owner's work meets the next."
"domestic interior" = "A home is one small room doing every job: bunk and kitchen and shrine and workbench at once, a rice cooker beside a soldering iron, laundry hung across a window unit, a family's whole life on one shelf. Neon comes in through the curtain. It is crowded and cared for, never squalid for its own sake."
"mechanical" = "Every machine has been opened, fixed and closed again by someone who is not its maker: a lift's cable drum rebuilt with parts from a motorbike, a generator on its third engine, a vending machine with its guts on the pavement, a repair stall's bench stacked with disassembled things. The machine is legible as a machine, with its casing off."
"industrial and infrastructural" = "The city's nervous system, exposed and overloaded: substations humming in stairwells, cable trays packed past capacity, water mains sweating along a corridor ceiling, ventilation shafts, transit tunnels, the pumps that keep the lower levels dry. It is patched rather than maintained, and one failure takes a district dark."
"agricultural and cultivated" = "Food grown in the city's leftover space by labour, measured by yield: hydroponic trays in a dead parking structure, mushroom beds in a basement, fish farmed in drums, chickens on a balcony, algae vats, a rooftop terraced for rice. Unlike botanical, the subject here is the system and the work: rows, irrigation lines, harvests, someone tending it."
"aquatic" = "Water is inside the city: either too much of it or sold. It floods the lower levels, sheets off awnings into gutters, sweats through ceilings, runs black in drainage channels, stands in cisterns and coolant tanks, and clean water comes in bottles and jerrycans with a price on them. The sea is rarely in frame; this is the water the city could not keep out or had to buy."
"atmospheric" = "The air here is thick enough to hold light. Steam venting from grates, smog, kitchen smoke rolling out of a stall, air-conditioner exhaust, dust, rain in the air. It is where the neon becomes visible as colour, and it always comes from somewhere you could point to."
"glacial and frozen" = "Cold here is always made by a machine, and it is paid for. Freezer lockers at the fish market, frost furring the coolant lines of a server hall, a morgue drawer, ice delivered in blocks on a hand cart, a refrigeration plant's condensers roaring on a roof. It exists to keep something from rotting (food, bodies, data), and a power cut means a thaw."
"fire and ember" = "Fire is the oldest technology still running here. It belongs to the street (woks roaring on a stall, an oil drum burning for warmth, a backroom smelter, candles at a shrine, a welder's arc) and it is also the street's worst danger: a cable tray smouldering, a transformer on fire in a stairwell. Every flame has a fuel and a vessel."
"textile and fiber" = "Cloth is the city's cheapest wall and roof. Half of it is held up by tarpaulin, awning, rope and tape: tarps lashed over a gap in a facade, curtains dividing one room into three, work clothes patched until nothing original is left, rag wrapped around a hot pipe, a sweatshop's rows of machines under strip lights. Fiber here is always doing a structural job."
"ritual object" = "The street religion's hardware, made from the city's waste and worn smooth with use: offering bowls cut from cans, candles in bottle glass, stickers layered on a rack cabinet, circuit boards strung as amulets, incense stuck in a cable tray, a shrine box built into a junction box. The subject is the object and the handling it has had, not the god it is for."
"paper and inscription" = "Paper is where the street keeps what it will not trust to a screen: receipts, tickets, handbills pasted over handbills until the wall is inches thick, ledgers, service manuals swollen with damp, paper prayers, maps corrected in grease pencil. Writing appears as marks and layers (torn, stamped, pasted over, too small or too close to read), never as words anyone could quote."
"instrument and measure" = "Everything here is metered, and the instrument is how the city charges you. Electricity meters spinning in a stairwell bank, water gauges, the scrap dealer's scale, a market's weights and balances, coin slots, turnstiles, a clinic's monitors, a surveyor's rig marking a building for demolition. To measure something here is to put a price on it."

[cyberpunk]
label = "Cyberpunk"
# Technique only, per the ghibli lesson of 2026-09-20: the old suffix mandated
# "neon-lit rain-slicked streets" and "moody blue and magenta lighting" on
# every image, which vetoed the light axis and the wonder tone exactly as the
# cumulus clause did for ghibli. Setting, weather and palette are the
# charter's and the dial's now.
#
# MEDIUM (a): 35mm practical-effects film. Chosen over hand-painted anime
# backgrounds because that is the same technique family as ghibli's (painted
# backgrounds, cel figures) and the two styles would drift together; and
# because physical miniatures with visible light fixtures are the physics
# rule restated as technique. No film is named: a title would pull hard
# toward one city at night in the rain, which is the attractor. If the style
# reads generic, naming one is the first lever to try.
#
# MEDIUM (b), held for the A/B test, not live:
#   "Hand-painted 1980s theatrical anime background art: dense cityscapes
#   painted in opaque colour with every pipe, sign, cable and window drawn,
#   deep saturated shadows, light sources painted as physical fixtures rather
#   than glows."
#   (with suffix_figures: " Figures in flat cel shading with one hard-edged
#   shadow tone and crisp ink outlines; only the nearest one or two have fully
#   drawn faces.")
# Test protocol: one fixed reading/signature, six dial cells (light hi/lo x
# wonder tone, including the darkest cell), each rendered under (a), (b) and
# the ghibli suffix side by side; check (a) stands alone first, faces
# included. (b) fails if it cannot be told from ghibli at thumbnail size or
# drifts pastoral -- then (a) stays the default.
#
# suffix_base ends in a period, so suffix_figures leads with a space (see
# load_style_suffix: concatenation is raw).
suffix_base = "A still frame from a 35mm practical-effects science-fiction film: the world built as physical sets and detailed miniatures, real haze and smoke catching the light, every light source a visible physical fixture — tube, lamp, panel, bulb — with its reflection on whatever surface is near it. Fine film grain, the soft falloff and flare of an anamorphic lens, shadows that are deep but still hold detail. Shallow depth of field: any lettering on signs is out of focus, distant or seen edge-on, never crisp readable words. No digital gloss, no clean computer-generated surfaces, no floating or holographic light."
suffix_figures = " Figures are real people photographed on film: unretouched skin, practical costume and makeup, prosthetics and implants built as physical props with weight and wear. Only the nearest one or two are in sharp focus with readable faces; anyone further back is soft, turned away, or lost in the haze."
# guidance removed 2026-09-26: superseded by [cyberpunk.world] above. Its one
# prohibition (no abstract energy-beings) is carried by `physics`. In git.

# Added 2026-09-07 from a user-supplied reference guide
# (~/Downloads/art-style-guides.md), cross-checked against independent
# research before use (see CHANGELOG.md for sources) — flat color planes
# and confident black key-block outlines are the real technique, not
# painterly shading; bokashi is a specific hand-inked gradient reserved
# for skies/water only, never used as a general softening effect. The
# "do not add a person... unless already described above" sentence was
# added after the same day's illuminated-manuscript figure-injection bug
# (see below) — applied here proactively even though this exact suffix
# hadn't been observed failing.
[ukiyoe]
label = "Ukiyo-e"
suffix = "Ukiyo-e Japanese woodblock print style: flat, unmodulated color fields bordered by confident, uniform-weight black outlines (the hand-carved key-block line), never digitally smooth or painterly-blended within a shape. Skies, water, and distant landscape may use bokashi — a soft hand-inked gradient — but this is the only place gradients belong; everything else stays flat. Compositions favor asymmetrical framing, bold cropping at the frame's edge, and a high oblique viewpoint rather than single-point perspective. Rain, snow, water, and textile patterns render as repeating graphic motifs (parallel diagonal lines for rain, stylized wave crests) rather than naturalistic texture. Palette leans toward deep indigo and Prussian blue alongside warm earth tones and muted reds. Do not add a person or figure unless one is already described above — many ukiyo-e prints are pure landscape, still life, or pattern with no one in them. Only if a person is explicitly part of the scene described above: render them with the same flat color planes and confident outline as everything else, never photorealistic shading."
guidance = "A graphic, representational tradition — landscapes, figures, and everyday scenes rendered as flat stylized color planes, not painterly realism or abstract energy. Comfortable with bold pattern standing in for texture (waves, rain, fabric) but every subject should still read as a concrete, recognizable thing."

# Added 2026-09-07, same source/verification as ukiyoe above. The
# diagram/symbol-friendly guidance is deliberate — historiated initials
# and marginalia are a real historical genre for exactly this kind of
# esoteric/diagrammatic content (illuminated manuscripts include actual
# astrological/zodiac diagrams), so unlike the other representational
# styles this one doesn't need a literal figure to feel authentic.
#
# Revised same day: the first version mentioned gold leaf being "used for
# haloes" as a general technique note (unconditionally) and only gated
# actual figure rendering with a positive "only if a person is already
# part of the scene" clause — same mistake as Ghibli's first pass. A real
# production run with zero people in the Stage 2 prompt still rendered 8
# haloed figures around a table. Fixed the same way Ghibli was: moved the
# halo mention into the conditional clause only, and added an explicit
# "do not add a person, halo, or figure unless one is already described
# above." Retested 0 of 3 on the exact prompt that triggered the bug
# (previously 1 of 1 observed failures).
[illuminated]
label = "Illuminated Manuscript"
suffix = "Illuminated manuscript style: hand-painted in jewel-toned mineral pigments — ultramarine blue, vermilion red, verdigris green — on a warm, slightly imperfect parchment ground, never pure white. Gold leaf is burnished to a mirror shine and reads as a reflective, raised surface, not flat yellow paint. The composition sits inside an ornate decorative border of vegetal scrollwork, small symbolic creatures, and fine linework diagrams, framing the central image without competing with it. Do not add a person, halo, or figure unless one is already described above — plenty of manuscript pages are a decorated object, diagram, or pattern with no one in them. Only if a person is explicitly part of the scene described above: render them flattened and stylized rather than naturalistically proportioned, in the manner of Byzantine icon painting, with a gold halo if the scene calls for it, never modern dress or realistic anatomy."
guidance = "A decorative, symbol-friendly tradition — comfortable with both a flattened, iconic central figure/scene AND purely diagrammatic or symbolic content living in the border (astrological charts, emblems, vegetal patterns) without needing a literal figure at all. Not photorealistic or naturalistic; every image reads as a manuscript page, not a window onto a real scene."
