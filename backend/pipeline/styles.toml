# REGISTERS, 2026-09-26. How this world realises each substance register, one
# span-and-principle line per register -- never an inventory (see
# registers.toml's [guidance] header): anything listed marks the range and is
# a starting point to reach past. Drafted family by family with Garrett.
#
# Read by load_register_line() since the 2026-09-26 Stage 1.5 split: the
# day's line (primary and secondary) goes to the material call, which builds
# the objects and the anomaly from it, and to Stage 2. Before the split the
# register was picked after Stage 1.5 had cast the scene, and a 20-register
# sweep collapsed to one scene (cp-reg20-base; ghibli the same, gh-reg20-dry).
[cyberpunk.registers]
# Each line ends with "Its highlight:" (2026-10-09, drafted family by family
# with Garrett): what the charter's highlight -- something alive in the machine
# -- looks like in that material. Each list spans different kinds (person,
# creature, machine, place) so no single answer becomes the default; a loose
# charter principle alone gave a pigeon in 4 of 6 registers (cp-highlight-rot).
"botanical" = "What grows here grows in spite of the city, or because someone had nowhere else to grow it: weeds in gutters and stair cracks, roots splitting a ramp, vines riding the cable swags, and the deliberate kind (racks under grow-lamps, balcony pots, a rooftop plot fenced with scrap). The plant is the subject and the city is what it grows through; it is either tended or slowly winning. Its highlight: the one plant thriving where nothing should, in fruit or flower or grown so far into the structure that it is holding it up."
"bodily and anatomical" = "The body as a thing that is maintained, bought and failing: the seam where flesh meets steel, sutures and scar lines, a port opened for service, a prosthetic laid out on a back-clinic table, parts kept cold in jars. At the far end, flesh grown around metal until neither can be separated. Clinical and unsentimental, never gore. Its highlight: the modification that makes the body a tool for surviving here — mechanical prosthetics with obvious working attachments: a flamethrower or a gun for an arm, a blade for a limb, surgical tools at the fingertips, laser or augmented-reality goggles."
"fungal and decaying" = "Rot is the city's other maintenance crew. It spreads along the city's own wet paths (condensation, leaks, drains, flooded basements): mould blooming across ductwork, rust eating through a stair, fungus furring a dead server rack, insulation gone soft. It is slow, specific and patient, and it is winning somewhere nobody looks. Its highlight: the city's decay kept alive — an old robot built for one job, barely running after hundreds of years of modifications, or what is left of a person with foreign growths coming out of them."
"animal and creaturely" = "The animals that live off the city: rats, pigeons, crows, feral cats, eels in the drains, fish in market tanks, a working animal wherever no machine was cheaper, and cheap engineered pets gone feral. They use the infrastructure as their own terrain (cable runs as paths, vents as dens, neon as warmth), and nobody is sentimental about them. Its highlight: the animal this particular corner of the city has that no other corner does: what lives in this drain, this roof, this market, and nowhere else."
"geological" = "The city is a geological layer too. Poured concrete stacks in strata, each decade's over the last, spalling to show its aggregate; in the deepest levels the older ground finally shows through (bedrock sweating in a sub-basement, a cliff the towers are bolted to, a sinkhole that swallowed a street, landfill cut open in section). Stone here is either the city pretending to be permanent or the thing underneath that actually is. Its highlight: the place where the city’s foundations lose the argument with the ground: a wall split by pressure, a sub-basement taken over by water or heat, a vent the whole block quietly depends on, and whatever has settled into it, which might be a plant, an animal, a machine, or a person."
"metallic and ore" = "Metal is the city's money. It is stripped from walls, sold by weight, melted in a backroom crucible and poured again: copper wire in coils, sheet steel, rebar pulled from ruins, scrap sorted by hand into heaps by colour and grade, patina and rust worn like a record of every owner. Nothing metal is new; everything has already been something else. Its highlight: something that has made metal its body: a creature welded from scrap that still moves, a worker whose limbs are the same scrap they sort, a machine that outlived its job and grew new purposes, a nest built in the last warm corner of a dead furnace."
"glass and ceramic" = "Glass divides this city. Above, it is sealed and clean, the windows of the institutions. Below, it is bent, cracked and reused: neon tube being heated and shaped in a workshop, porcelain insulators the size of barrels, crazed screens, bottle glass set into walls, glazed tile in a noodle shop or a bathhouse worn through to the clay. The substance is both what the powerful hide behind and what the street makes its light from. Its highlight: something alive behind or inside the glass, never the same thing twice: a face lit by the screen it’s working, growth filling a dead sign, a visor with an eye behind it, a cracked display where something is moving."
"architectural" = "Architecture here is accretion, not design. No building is one building: the original frame is a skeleton under decades of unauthorised additions (rooms cantilevered off a balcony, a floor added in sheet metal, a stair bolted to the outside, a bridge two neighbours built between their windows). Look at the joins, where one owner's work meets the next. Its highlight: the join where someone made the building their own and it took: a room grown off a balcony with people living in it, a stair a creature uses as its road, a sign bracket that has become a home, a facade machine still answering a tenant who left decades ago."
"domestic interior" = "A home is one small room doing every job: bunk and kitchen and shrine and workbench at once, a rice cooker beside a soldering iron, laundry hung across a window unit, a family's whole life on one shelf. Neon comes in through the curtain. It is crowded and cared for, never squalid for its own sake. Its highlight: the thing that makes this one room alive: a pet machine nobody can bear to switch off, a child asleep among the tools, a seedling raised under a grow-lamp in a teacup, a window looking straight into a neighbour's life."
"mechanical" = "Every machine has been opened, fixed and closed again by someone who is not its maker: a lift's cable drum rebuilt with parts from a motorbike, a generator on its third engine, a vending machine with its guts on the pavement, a repair stall's bench stacked with disassembled things. The machine is legible as a machine, with its casing off. Its highlight: a machine that has stopped being only a machine: one that hums a tune its owner taught it, one with an animal living in its heat, one a person has partly become, a lift that will only stop at certain floors."
"industrial and infrastructural" = "The city's nervous system, exposed and overloaded: substations humming in stairwells, cable trays packed past capacity, water mains sweating along a corridor ceiling, ventilation shafts, transit tunnels, the pumps that keep the lower levels dry. It is patched rather than maintained, and one failure takes a district dark. Its highlight: where the city's systems keep something alive, or something alive keeps a system going: a worker strapped into a junction as part of it, eels keeping a pump intake clear, a substation warm enough to sleep against, a valve someone comes to turn by hand every day."
"agricultural and cultivated" = "Food grown in the city's leftover space by labour, measured by yield: hydroponic trays in a dead parking structure, mushroom beds in a basement, fish farmed in drums, chickens on a balcony, algae vats, a rooftop terraced for rice. Unlike botanical, the subject here is the system and the work: rows, irrigation lines, harvests, someone tending it. Its highlight: the crop or its keeper at their most alive: a harvest coming in, an animal being fed, a grower whose augmented hands do the picking, a vat brewing something that glows from inside."
"aquatic" = "Water is inside the city: either too much of it or sold. It floods the lower levels, sheets off awnings into gutters, sweats through ceilings, runs black in drainage channels, stands in cisterns and coolant tanks, and clean water comes in bottles and jerrycans with a price on them. The sea is rarely in frame; this is the water the city could not keep out or had to buy. Its highlight: what lives in the water the city couldn't keep out: fish farmed in a flooded stairwell, a diver in a sealed suit working the drowned levels, a cistern pump that has started breeding things in its tank, a person swimming somewhere no one should."
"atmospheric" = "The air here is thick enough to hold light. Steam venting from grates, smog, kitchen smoke rolling out of a stall, air-conditioner exhaust, dust, rain in the air. It is where the neon becomes visible as colour, and it always comes from somewhere you could point to. Its highlight: something alive the air gives away: the breath and smoke of a crowd at a stall, wings moving through steam, a masked figure filtering the smog, a vent exhaling like a sleeper."
"glacial and frozen" = "Cold here is always made by a machine, and it is paid for. Freezer lockers at the fish market, frost furring the coolant lines of a server hall, a morgue drawer, ice delivered in blocks on a hand cart, a refrigeration plant's condensers roaring on a roof. It exists to keep something from rotting (food, bodies, data), and a power cut means a thaw. Its highlight: what the cold is keeping alive: a sleeper in a cryo drawer, something holy kept in a fish-market freezer, frost growing like a plant across a coolant line, a worker's breath hanging in the freezer light."
"fire and ember" = "Fire is the oldest technology still running here. It belongs to the street (woks roaring on a stall, an oil drum burning for warmth, a backroom smelter, candles at a shrine, a welder's arc) and it is also the street's worst danger: a cable tray smouldering, a transformer on fire in a stairwell. Every flame has a fuel and a vessel. Its highlight: what lives by the fire: a cook whose arm is the burner, an animal warming itself at a transformer fire, a forge robot still running at its one job, a shrine flame someone has kept lit for years."
"textile and fiber" = "Cloth is the city's cheapest wall and roof. Half of it is held up by tarpaulin, awning, rope and tape: tarps lashed over a gap in a facade, curtains dividing one room into three, work clothes patched until nothing original is left, rag wrapped around a hot pipe, a sweatshop's rows of machines under strip lights. Fiber here is always doing a structural job. Its highlight: what lives under or inside the cloth: a family behind a tarp wall, a creature asleep in a hanging rag, a figure in patched armour-cloth, a sewing machine still running with nobody at it."
"ritual object" = "The street religion's hardware, made from the city's waste and worn smooth with use: offering bowls cut from cans, candles in bottle glass, stickers layered on a rack cabinet, circuit boards strung as amulets, incense stuck in a cable tray, a shrine box built into a junction box. The subject is the object and the handling it has had, not the god it is for. Its highlight: the shrine at its most alive: a god's hardware body taking an offering, an animal eating from the altar, a priest-tech's hands at work on a relic, candle wax grown over everything like something living."
"paper and inscription" = "Paper is where the street keeps what it will not trust to a screen: receipts, tickets, handbills pasted over handbills until the wall is inches thick, ledgers, service manuals swollen with damp, paper prayers, maps corrected in grease pencil. Writing appears as marks and layers (torn, stamped, pasted over, too small or too close to read), never as words anyone could quote. Its highlight: what lives in the paper: a reader hunched over a handbill by screen-light, rats nesting in old ledgers, a wall of pasted bills breathing in a vent's draught, a courier with a map inked into their arm."
"instrument and measure" = "Everything here is metered, and the instrument is how the city charges you. Electricity meters spinning in a stairwell bank, water gauges, the scrap dealer's scale, a market's weights and balances, coin slots, turnstiles, a clinic's monitors, a surveyor's rig marking a building for demolition. To measure something here is to put a price on it. Its highlight: what the meter is measuring at its most alive: a heartbeat on a back-clinic monitor, a scale weighing something that moves, a turnstile an animal has learned to work, a gauge needle someone sits up all night watching."

[cyberpunk]
label = "Cyberpunk"
