[symbolist.registers]
"botanical" = "Plants that are half something else: a flower with a face, a tree whose branches are threads. Growth here is slow transformation."
"bodily and anatomical" = "The body as a place things happen: hair that becomes a road, a chest that opens like a cabinet. Calm and exact, never gore."
"fungal and decaying" = "Decay as alchemy's first stage: a still-life going black and soft, mould spreading like a map across a wall."
"animal and creaturely" = "Animals as companions in the rite: an owl reading over a shoulder, a white horse standing indoors. They have their own purposes."
"geological" = "Stone as a dreamed landscape: a desert of smooth rock, a cliff carved into a stair that goes nowhere."
"metallic and ore" = "Metal as the alchemist's work: a lead weight turning gold at one edge, a brass apparatus of rings and cogs."
"glass and ceramic" = "Glass as vessel and lens: a bell jar holding a small weather, a lens through which another room is seen."
"architectural" = "Towers, cloisters and halls that are also instruments: a tower that spins thread from its windows, a corridor of doors that open onto skies."
"domestic interior" = "Kitchens and bedrooms as laboratories of the soul: a kitchen where the stew is a sky, a bed that is a boat. Always opens onto a window or a door."
"mechanical" = "Machines made of wood, cloth and feathers that do impossible jobs: a vehicle pedalled through a forest, a loom that weaves light into cloth."
"industrial and infrastructural" = "Works on a dream's scale: a mill grinding stars into flour, a water channel running uphill."
"agricultural and cultivated" = "Strange husbandry: a garden of glass flowers tended with tweezers, a field ploughed by a hybrid."
"aquatic" = "Water as passage and mirror: a boat crossing a still sea to an island of dark trees, a still lake holding a different sky."
"atmospheric" = "Air with texture: a sky like wood grain, a wind made of threads."
"glacial and frozen" = "Cold as stillness: a figure frozen mid-gesture in a block of clear ice, frost growing like lace across a window."
"fire and ember" = "Fire as transformation: an athanor's slow fire, a candle whose flame is a small figure."
"textile and fiber" = "Thread as the world's substance: the mantle of the world being embroidered, a tapestry whose figures step out."
"ritual object" = "Instruments of a private rite: a cage for a star, a chalice that pours light. Each is concrete, handled and used."
"paper and inscription" = "Books and diagrams that are alive: a book whose pages are birds, a chart unrolling into a road. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Instruments of the inner world: a scale weighing a heart against a feather, a clock with hands of branches."

[symbolist]
label = "Symbolist / Visionary"
suffix = "painterly, visionary symbolist painting in the tradition of Odilon Redon, Remedios Varo, Leonora Carrington, and Hilma af Klint's illuminated visions — strange, hand-painted, not digital or photographic"
# guidance removed 2026-10-10: superseded by the charter above. In git.
