[cosmic.registers]
"botanical" = "Plants grown where there is no ground: a garden under a dome, a tree rooted in the bare stone of an island with its roots hanging into the void. Each plant is either kept alive by someone or has found its own way into the light."
"bodily and anatomical" = "The body under light gravity and hard light: a suited body where gear and limb are one, or a star-being's anatomy at the scale of terrain, a rib you could walk along. Clinical, never gore."
"fungal and decaying" = "Slow rot in sealed places, because decay needs air and air is kept: bloom spreading round a sealed hatch, a derelict's bedding gone to spore."
"animal and creaturely" = "Creatures shaped by low gravity and open sky: long serpents riding the updrafts between islands, slow grazers on island meadows. They keep their own routes and take no interest in being watched."
"geological" = "Rock as Roger Dean paints it: eroded into smooth, flowing contours, arches, natural bridges and stacked mesas, and islands floating free with their undersides bare. Stone is what people stand on and also what they fall from."
"metallic and ore" = "Metal as hull and as ore: banded plate in hazard colours, a seam glittering in an asteroid's face. Most metal here was mined out of the sky and hauled a long way."
"glass and ceramic" = "Glass keeps the air in: a visor's curve holding a planet's reflection, round windows in grown dwellings. Fired clay belongs to the few who live where clay can be dug."
"architectural" = "Dwellings grown rather than built, rounded and clustered on ledges and joined by rock bridges; and the shells of other people's structures, lived in from the inside."
"domestic interior" = "Home is a rounded room with a round window onto open sky, lit from one side by the star: a bunk, a stove, a suit hung by the hatch."
"mechanical" = "Machines with their casings off, heavy, hand-worked and painted in stripes: an airlock's wheel, a skiff's engine. Legible as machines."
"industrial and infrastructural" = "Hauling and mining at the scale of worlds: tether lines strung between islands, docks hanging under a station. Everything is longer than it looks."
"agricultural and cultivated" = "Food grown off-world: terraced plots on an island's crown, a herd grazing a meadow that ends at the void. The subject is the work and the yield."
"aquatic" = "Water that falls off the edge: falls pouring from islands into nothing, a lake held in the hollow of floating rock. Water here is precious and visibly going somewhere."
"atmospheric" = "The sky as a body of colour: airbrushed bands from orange to violet, an atmosphere's thin limb seen from above."
"glacial and frozen" = "Ice at celestial scale: a ring of ice arcing across the sky, a comet's frozen head close enough to land on."
"fire and ember" = "Fire is rare and precious where air is: a stove in a grown house, an engine burn seen from close beside it."
"textile and fiber" = "Cloth here is suit, sail and shelter: heavy suit fabric, solar sails, canopies stretched between rock spires."
"ritual object" = "Offerings at the feet of star-beings and in derelicts used as shrines: beacons, salvaged parts set out with care. The subject is the object and the hands it has passed through."
"paper and inscription" = "Charts and logs kept by people who navigate by stars that are also beings: a hand-drawn star chart, names cut into a cockpit frame. Writing appears as marks and diagrams, never readable words."
"instrument and measure" = "Navigation and survey: an orrery, a gauge reading the air left. To measure here is to find the way or to know how long there is."

[cosmic]
label = "Cosmic / Nebula"
# guidance removed 2026-10-10: superseded by [cosmic.world]. It asked for
# "energy, light, nebulae and dreamlike or symbolic forms", which is the
# glowing-being territory the charter now rules out. In git.
space = [
  "from one floating island across the void to the next",
  "up a waterfall pouring off an island's edge into the sky below",
  "along a ring arcing away to its planet's limb",
  "down the length of a vast hull",
  "from a ledge under a ringed planet low on the horizon",
  "through a natural rock arch onto open sky",
  "along a skiff route threading between island stacks",
  "from a station window down to the planet below",
]
# REWRITTEN twice 2026-10-10. Prompt 3 made it a 1970s paperback cover
# (airbrushed gas, hard-edged acrylic solids, one hard star); Prompt 4 added
# Roger Dean's rendering (flowing rounded rock, airbrushed orange-to-violet
# skies, earth tones under a luminous sky). The original, for the record:
# "ethereal cosmic art, nebula and starfield, dreamlike aurora colors, soft
# glowing light, painterly, otherworldly".
suffix = "A 1970s science-fiction paperback cover painting in the tradition of Roger Dean, Chris Foss and Chesley Bonestell. Rock and land are eroded into smooth, flowing, rounded contours, with organic curves rather than jagged edges; skies are smooth airbrushed bands of colour, warm orange through violet, or deep black spattered with fine white stars. Solid bodies — rock, ice, hull, hide — are hard-edged opaque acrylic with a crisp line between lit and shadowed sides, in earth tones of sage green, ochre and stone grey beneath a luminous sky. A single hard star is the key light and reflected planet-glow is the only fill. The slight grain and gentle colour banding of a printed cover. No text or title."

# LIGHT, 2026-10-10 (STYLE-OVERHAUL Prompt 2). The global light lines are
# Earth-bound ("full day", "night"), which cosmic cannot satisfy. Each line is
# a count or a failure condition, like the globals, and overrides the line for
# that exposure band. The rest of cosmic's charter waits for Prompt 4.
[cosmic.light]
lo = "The scene is on a body's night side, in eclipse, or deep inside a dust cloud. At least two thirds of the frame is black, and the only light is starlight, a distant star's rim or a body's own heat. A frame that is mostly lit is a failed response."
mid = "A single hard star lights the scene from one side. A crisp line divides lit faces from dark ones, and both are substantial. A frame lit evenly from everywhere is a failed response."
hi = "The scene faces a near star full on: every surface is lit and no face is hidden. A frame that is mostly dark, or lit mainly by glows of its own, is a failed response."

# Rewritten 2026-09-07 from actual research (see CHANGELOG.md), not general
# impression — the original suffix wrongly called for "watercolor" character
# rendering. Ghibli characters are flat cel-shaded (solid base color, one
# hard-edged darker shadow tone, crisp clean outlines) — backgrounds are the
# painted half, in opaque poster paint/gouache (not watercolor), wet-into-wet
# for soft skies/clouds then sharp detail added as it dries. Keep that
# character/background technique split if this is revised again.
#
# Revised again same day: the first version described character rendering
# unconditionally, which the image model read as an instruction to include
# a person — confirmed via a 3-sample test, it invented an unrequested
# figure in a purely architectural Stage 2 prompt 2 of 3 times. The
# character clause is now explicitly gated behind "only if a person is
# already part of the scene" and leads with the background description
# instead (which applies to every image, figure or not). Re-tested 0 of 3
# on the same architectural prompt, and confirmed it still renders figures
# correctly when a base prompt actually calls for them.
#
# guidance rewritten 2026-09-08 (external review of a user-requested
# quality dossier — see CHANGELOG.md/CONTEXT.md): everything above fixed
# *rendering* (suffix wording), but the real failure mode observed on
# no-figure registers (e.g. a bare "architectural" prompt that read as
# Magritte-style surrealism, not Ghibli) was a *content* problem — "Ghibli"
# is not just a rendering technique like an engraving or a color-grade you
# can apply to any subject, it's an authored world (nature reclaiming
# structures, weather as presence, humble objects treated with reverence,
# rural vernacular architecture, wide low horizons). Stage 2 was never
# told any of that — the old guidance only said what to avoid. Widened
# guidance from a pure prohibition into a vocabulary Stage 2 can actually
# draw content from, on top of the retained prohibition.
#
# suffix split into suffix_base/suffix_figures 2026-09-08 (same review):
# hasPeople is already computed by Stage 2 and already used for the
# image-quality tier — this preset now also uses it for suffix assembly
# (see load_style_suffix()/build() in llm_pipeline.py). suffix_figures is
# appended only when a figure is actually in the prompt, so the character-
# rendering clause below is no longer dead text on the ~88% of real ghibli
# generations that have no person in them. This also retires the negative-
# instruction hack ("do not add a person... unless one is already
# described above") from 2026-09-07 above: a suffix that never mentions
# character rendering on a figure-free generation cannot itself induce an
# uninvited figure, so the sentence is now structurally unnecessary — kept
# it in this comment, not in suffix_base, so the historical lesson (an
# unconditional character-rendering description reads as an instruction to
# include one) isn't lost. Re-tested against the same kind of real
# figure-free architectural prompt that originally triggered the bug: 0/3
# figure-injections with the negative sentence removed, confirming the
# structural fix alone (not the negative sentence) is what's actually
# doing the work now.
#
# suffix_base/suffix_figures rewritten 2026-09-08 (same review, immediate
# follow-up): the 2026-09-07 research above was correct about the actual
# technique (flat cel-shaded characters vs. gouache/wet-into-wet
# backgrounds) but was written in process vocabulary — "opaque gouache/
# poster color," "wet-into-wet," "tonal layering," naming background
# painter Kazuo Oga by name — which describes *how a human made it*, not
# what the finished frame looks like. An image model has weak associations
# for process/medium/artist-name terminology (a background painter is far
# more thinly represented in training data than the films themselves) and
# much stronger ones for described visual outcomes. Rewritten to keep the
# same research-grounded technique distinction but state it as what's
# actually visible in frame: saturated layered greenery, hard-edged sunlit
# cumulus clouds, visible brushwork, clear foreground/middle/horizon
# depth, heightened-not-muted color for the background half; flat color/
# single hard shadow/crisp outlines stated plainly (already outcome-
# language, barely changed) for the figure half. Net effect on suffix
# length: unchanged (~52 words) on the ~88% of generations with no figure
# — the word-count win from the split above was already banked by cutting
# suffix_figures entirely on those, not by this rewrite — and down from
# ~120 to ~83 words combined on a generation that does have one.
#
# guidance revised again 2026-09-08 (register-collapse fix, found during
# the 12-register verification sweep the widened-guidance rewrite above
# was itself supposed to validate): fixed Ghibli-recognizability
# comprehensively (12/12 real renders read as genuinely Ghibli, including
# the exact "architectural" failure case that motivated the rewrite), but
# 5 of the 10 non-figure/crowd registers (geological, bodily and
# anatomical, mechanical, atmospheric, ritual object) collapsed into the
# same cozy domestic-kitchen scene regardless of assigned register — the
# guidance's own "recurring subjects" list was strong and specific enough
# to out-compete "material register to draw from" for content invention.
# Reframed guidance from "recurring subjects" (read as a substitute
# content menu) to "qualities for rendering whatever your register calls
# for" (a texture/mood layer applied to the register's own subject, never
# a replacement for it), with an explicit instruction not to default to a
# domestic interior. Paired with a matching addition to STAGE2_SYSTEM
# itself (register names the subject; the style's world textures it) so
# the same fix applies to every world-style, not just this one. Re-tested
# the 5 failed registers plus 2 controls (domestic interior, crowd / the
# collective) against the same fixed reading/signature as the original
# sweep — see CHANGELOG.md for the result.
# guidance extended again 2026-09-09 (symbolic-depth work — see
# CHANGELOG.md and TASK-symbolic-depth.md): the pipeline now requires every
# image to carry an "intrusion", an object belonging to a different world
# from the rest of the scene, present and unexplained. The concern was that
# ghibli is the worst-case style for that — its world is pastoral warmth
# and reverence for humble detail, which sands a strange object down into
# charm — and that the fix would be to switch styles.
#
# That concern turns out to be wrong about Ghibli specifically, and the
# correction belongs in guidance rather than in a style change: this world
# is *full* of the genuinely strange treated as utterly ordinary. A castle
# walking on chicken legs, a bathhouse staffed by gods, a cat that is also
# a bus, an abandoned sky-city, a rusting biplane in a flower field. What
# makes those read as Ghibli rather than as generic fantasy is that they
# are heavy, weathered, physically solid and mundanely lit, and that the
# characters are not astonished by them. That is exactly the register an
# intrusion needs, so the guidance now names it — without it, Stage 2 reads
# the rest of this world description as "keep everything homely" and quietly
# drops the intrusion or turns it into something twee.
# CHARTER, 2026-09-20. Replaces this preset's `guidance`, which is deleted
# below. Every prohibition that field carried is preserved here, because each
# one was a measured fix and not an opinion: no abstract energy-beings (the
# style cannot render them), do not default to a cottage kitchen (the
# 2026-09-08 register-collapse bug, where 5 of 10 non-figure registers turned
# into the same domestic scene), and scenes are not obliged to be warm.
#
# The old field had to be a world, a prohibition and a plea in one paragraph.
# The charter separates those, and `forbids` is the part that must survive
# verbatim in substance -- if a register collapses again, look there first.
# WEAR, 2026-10-10 (STYLE-OVERHAUL Prompt 1): "heavy and worn" (physics) and
# "heavy, weathered" (strangeness) went, with the same words in the highlight,
# THE IMPOSSIBLE and the global relation and highlight text. Wear was required
# in five places at once, so every image came back gritty and the image model
# painted the same grainy stone in every style. How worn things are is now the
# dial's `condition`, drawn per run (llm_pipeline.draw_style_choices); a
# [ghibli] `conditions` array would override its range. Later the same day
# era's "patched" and materials' "softened by moss" went too: the after-sweep
# traced patched and moss in the objects to those two words.
# RE-CHARTERED 2026-10-10 (STYLE-OVERHAUL Prompt 4, grilled with Garrett):
# materials lead with wood, paper, tile, cloth and stone (iron and enamel only
# where a machine needs them -- the sweeps put riveted iron on everything);
# society and inhabitants gain the days that are not work; favoured_actors
# demotes the lone soot-marked mechanic, this project's own attractor; every
# field cut to at most two examples. Sources: Miyazaki 1984-2023 plus Pom Poko;
# keep out Ghibli's near-realist films. Research:
# verification/charter-ghibli/research.md.
[ghibli.world]
era = "Early-industrial in feeling, with engineering that is impossible and that nobody minds: machines walk, fly and have faces, and a building may have legs. Everything is hand-built, far oversized for its job, and kept running by someone who loves it. Technology here is a character, not a backdrop."
materials = "Wood, paper, tile, cloth, thatch and cut stone carry most of this world, with iron and enamel only where a machine needs them. These ordinary materials are what the impossible things are made of: a flying machine of canvas and bicycle parts, a walking house of scavenged roofing."
physics = "Impossible things obey ordinary physics. They have weight, they cast shadows, they rust, they are lit like everything else, and the ground takes their load. Nothing glows of its own accord, nothing is translucent, and nothing floats without a visible reason; a thing that could be rendered as a light effect does not belong here. The wonder is that something enormous and impossible is also solid."
society = "Small settlements where people are known by name, the weather and the land are close, and institutions are distant. Spirits, gods and creatures share the place and hold jobs in it, and no one finds this worth remarking on. Days here are not all work: people wait for a bus in the rain, bathe, eat together at a long table, and fly for the joy of it."
weather = "Weather is a presence and often a threat, and it runs the whole range, from hard-edged cumulus over deep blue to rain that means it, fog, snow, dusk and full night. Wind moves through everything. Pick the weather the day calls for rather than defaulting to fine; this world is at least as itself in bad weather as in good."
inhabitants = "Children on the edge of growing up, the old, and working people known by name; creatures the size of houses with their own purposes; spirits that have taken a shape and a trade; machines someone looks after that may be awake. They are as often at a meal, a bath or a journey as at work."
strangeness = "The genuinely strange is completely unremarkable: unexplained machinery left standing in a meadow, a creature the size of a house asleep among ordinary trees. Such things are physically solid and lit exactly like everything around them, and nobody in the frame is astonished by them."
numinous = "Spirits are ordinary residents. They take a body, a size and a job, like a river that is also somebody or a soot-coloured swarm that carries coal. They are solid, they leave prints, and they are lit like everything else; people greet them, avoid them or work alongside them without comment. Never a glow, a mist or a translucency: if it could be painted as a light effect it is not one of these."
dread = "This world at its darkest is this one with the other face turned out: a god maimed or boiling with something under the skin, industry eating the forest for good reasons. Violence is sudden, physical and costly and never relished by the frame. Nobody here is simply good or simply bad, and the image should not tell you whom to side with."
favoured_actors = "This world is richest in creatures with their own purposes, part-human figures, spirits holding a trade, swarms, and machines that may be awake. A lone ordinary person, and above all a lone soot-marked mechanic at a machine, is the least interesting inhabitant available and should not be the default."
# myth, 2026-10-10 (STYLE-OVERHAUL Prompt 2): where this world's stories come
# from. Stage 1.5's meaning keeps Jung and Neumann as the lens for what kind of
# situation a day is, and looks for its form here. Placeholder wording from the
# overhaul plan; Prompt 4 re-grills it.
myth = "Shinto kami, the spirits of particular places and the gods of rivers, hills and forests; Japanese folklore of tricksters, shapeshifters and the child spirited away into a world of spirits; and the European fairy tale these films also draw on, of witches' apprentices, cursed shapes and castles that move."
# highlight added 2026-10-09: the thing the eye goes to first. This is the
# "anomaly" wording every style used to share (wrong in one way, larger or
# older, solid, unexplained, cropped if enormous), moved here because it is
# this world's logic and not a universal one. Tested under the old name across
# the 2026-09 sweeps; reworded only to stand alone.
# REWRITTEN 2026-10-10 (STYLE-OVERHAUL Prompt 1). It named "the size of a barn
# or a hillside" and offered only two wrongnesses (far larger, far older and
# more worn), and the review found barn in 21 of 33 days and ancient/older in
# 37 of 52 highlights across six styles. The kind of wrongness is now drawn per
# run from highlight_modes, the scale comparison is left to the scene, and wear
# is the dial's condition. "Never modern, manufactured or electronic" stays:
# that is this world's, whatever the mode.
highlight = "One thing, native to this world and made of its own materials, that is wrong in exactly one way; today's kind of wrongness is given with this definition. Whatever the wrongness, it is never modern, manufactured or electronic. It is solid and lit like everything else; it does not glow, float, shimmer or look magical. Nothing in the scene explains why it is there. Where its wrongness is size, choose a scale comparison native to this scene, never the same one twice, and put part of it in shot, close (the foot of it, one edge, the shadow it throws) rather than shrinking it or pushing it to the back of the frame."
# One drawn per run, never one of ghibli's last 2.
highlight_modes = [
  "far too large for its kind",
  "far older than everything around it",
  "awake when it should be inert",
  "in the wrong element (a boat in a tree, a house on a river)",
  "one of a crowd where there should be only one",
  "being used for a job it was never built for",
]
# `forbids` removed 2026-09-20 at Garrett's direction: a poorly introduced
# control from too far back in the iteration process. A charter says what
# a world IS; it should not need a list of what it is not.
#
# What went with it, so the history is not lost: the no-energy-beings ban
# (now carried by `physics`, which says a thing renderable as a light
# effect does not belong here), the 2026-09-08 cottage-kitchen rule, and a
# clause that was permission rather than prohibition -- that scenes here
# are not obliged to be warm and may hold dread, decay and blight. Some of
# that permission survives in `weather`. If ghibli drifts pleasant, or if a
# register collapses into a kitchen again, this is the change that did it.

# BRIEF, 2026-09-26. Stage 2's style-specific rules, moved here verbatim from
# stage2_image_prompt, where they were hardcoded for every style. They were
# written for this world. Each is phrased as a count and a failure condition
# because the brief is the part Stage 2 obeys, and mood words are not obeyed.
#
# THE IMPOSSIBLE: until it existed wonder was only DESCRIBED in the charter
# and nothing required it, so a world of walking machines reliably produced a
# plausible flour mill. A charter says what MAY exist; only the brief makes
# something appear. {wonderTone} is filled from the dial. (A {wonder}
# scale line went on 2026-10-09: prominence is now a style-neutral brief line
# about the highlight, sent to every style.)
#
# OPENNESS: these are wallpapers; an enclosed room reads as claustrophobic at
# desktop size however good its content. "Open means depth, not daylight" was
# added 2026-09-26: without it, dark cells resolved "half the frame open" as
# a lit sky.
[ghibli.brief]
impossible = "THE IMPOSSIBLE — applies to every image: at least one thing in frame could not exist, and nothing in the scene treats it as remarkable; it may be the highlight. Give it this world's own form: a machine that is plainly alive or awake, a spirit holding a job, a creature far too large for its kind, or a building that walks or flies. Build it from this world's own materials, give it real weight, light it like everything else, and let the actor treat it the way they would a wall. An image in which everything could exist is a failed response.\n    What temper it is in: {wonderTone}\n    SCALE MUST READ. Put something of known human size next to it — a figure, a doorway, a cart, a gate — close enough in frame to measure it against. A huge thing photographed alone is just a texture; it only becomes huge beside something that is not."
openness ="OPENNESS — applies to every image, whatever the numbers above say: at least half the frame must be open. Sky, horizon, landscape, sea, or a distance that keeps going. Open means depth, not daylight: a night sky, a drop into dark or lit depths, or fog that keeps going all count, and how bright the open part is comes from the light line below, not from this rule. Pull the viewpoint back far enough that this is true. If the scene is indoors, the room must open onto that distance through a large window, a doorway, a missing wall or a broken roof, and what is seen through it must occupy a substantial part of the frame rather than being a bright rectangle in a corner. A fully enclosed interior is a failed response, and so is a close-up that crops the world out."

# LIGHT, 2026-10-16 (charter-required): the global light lines, copied word
# for word when they were removed from the pipeline (decision 4). Rewrite
# them only for a reason this world has.
[ghibli.light]
lo = "It is night, or the scene is somewhere daylight does not reach. At least two thirds of the frame is dark, and what is happening is only partly visible — lost in shadow, fog or depth rather than described. The only light is what the scene itself provides. A frame in which most of the image is well lit is a failed response."
mid = "The light comes from one clear direction, and lit and unlit areas are both substantial. A frame lit evenly from everywhere is a failed response."
hi = "It is full day — flat overcast, open daylight or hard noon sun — and the light is even across the frame. Everything is visible: nothing is hidden and nothing is dramatised by shadow. A frame that is mostly dark, lit by a low or setting sun, or lit mainly by the scene's own lamps and signs is a failed response."

# VERBS, 2026-10-10 (STYLE-OVERHAUL Prompt 1). Each run draws 3 process verbs
# and 3 actor verbs from the day's polarity, never one this style drew in its
# last 2 runs (llm_pipeline.draw_style_choices). They replace the global
# _VERBS_* and _ACTOR_VERBS_* lists, which every style shared and which put
# spill, feed and bear down into a third to a half of all prompts.
#   process_*: things happening to things, with no one doing them.
#   actor_*:   what the actor does, as tables keyed by activity (work, rest,
#              play, ritual, travel; play or ritual may be absent). A run draws
#              one activity, then 3 verbs from it, because a chore in every
#              frame was part of the shared scene skeleton: with one mixed
#              array Stage 2 still picked the chore (83-92% working).
# 20-30 entries per array, validated on load. No verb is shared with
# cyberpunk's same array unless it is native to both (flooding, steaming,
# cooking).
[ghibli.verbs]
process_hard = ["flooding", "silting up", "rusting through", "buckling", "sagging under", "splitting", "scorching", "smothering", "choking", "tearing loose", "swallowing", "toppling", "gnawing at", "rotting through", "washing out", "burying", "souring", "cracking open", "overgrowing", "scouring", "flattening", "boiling over"]
process_soft = ["drying", "steaming", "sprouting through", "ripening", "swaying", "trickling", "warming", "settling", "drifting", "bobbing", "filling", "draining clear", "shading", "sheltering", "rustling", "cooling", "rising", "flowering", "nesting in", "gathering dew", "rippling", "unfurling"]
actor_hard.work = ["hauling", "bailing", "shoring up", "chopping free", "dragging", "wrestling with", "cranking", "hammering", "beating back", "holding down", "cutting loose", "pumping", "shovelling", "shouldering", "roping", "digging out", "damming", "carrying off"]
actor_hard.rest = ["sheltering under", "huddling in", "waiting out"]
actor_hard.play = ["racing", "flying kites into", "sledging down"]
actor_hard.ritual = ["ringing", "scattering salt over"]
actor_hard.travel = ["fording", "scrambling up", "pushing through", "poling across"]
actor_soft.work = ["cooking", "hanging out washing", "polishing", "sweeping", "oiling", "picking", "tying", "kneading", "airing out", "stacking"]
actor_soft.rest = ["napping beside", "sharing food with", "dozing against", "eating lunch on", "sitting out"]
actor_soft.play = ["sketching", "fishing", "whittling", "splashing in", "playing tag around", "flying a kite from"]
actor_soft.ritual = ["leaving an offering at", "hanging a paper charm on", "lighting a lantern for"]
actor_soft.travel = ["riding", "leading by the hand", "cycling past", "wading across", "walking home past"]

# REGISTERS, 2026-10-10 (STYLE-OVERHAUL Prompt 4): ghibli had none of its own.
# One span-and-principle line per register, at most two examples, no example
# noun repeated across lines. "glass and ceramic" avoids the word ceramic,
# which Prompt 3's check showed paints jars blue-and-white.
[ghibli.registers]
"botanical" = "Plants as a force that reclaims: a camphor tree wider than a house, a vine swallowing a stone wall. Green is never decoration here; it is winning slowly, or being cut back by hand."
"bodily and anatomical" = "The bodies of the large and the strange as terrain: the flank of a boar god, the ribs of a creature that has lain down for good. Bodies are warm, heavy and breathing, and when hurt they are plainly hurt, never gory."
"fungal and decaying" = "Rot as the forest's other life: a spore-forest grown over a ruin, a fallen trunk going soft under shelf fungus. Decay here is alive and has its own spirits; it is neither clean nor evil."
"animal and creaturely" = "Animals with their own business: a cat that might be more than a cat, a heron that watches too long. The large ones are gods or nearly; the small ones go about their day and perform for no one."
"geological" = "Stone that holds the land up and the old powers in: a cliff a village is built into, a stone gate half-sunk on a hillside. Rock is solid, lit by the weather, and often carved by people long gone."
"metallic and ore" = "Metal as the stuff of mines and machines: a mining town's tracks and ore carts, a cast-iron stove in a witch's kitchen. It rusts, it is fixed by hand, and it is never chrome."
"glass and ceramic" = "Glass in a household's hands: a greenhouse in an overgrown garden, the bottle-glass windows of a hill town. It catches daylight; nothing made of glass glows of its own accord."
"architectural" = "Buildings that look grown into their places: a bathhouse stacked up a hillside, a moving castle of scavenged roofs and chimneys. Every building is lived in and shows it."
"domestic interior" = "A home is a kitchen, a stair and a window: a farmhouse hearth, an attic bedroom. It always opens onto the world through a window or a door, and is never the setting for a register that is not this one."
"mechanical" = "Machines built by hand and oversized for their jobs: an ornithopter's beating wings, a lift worked by a spirit at the wheel. Legible as machines, and possibly awake."
"industrial and infrastructural" = "Works that feed a town and eat a forest: an ironworks on a lake, a railway laid across flooded water. Industry has people in it, good reasons, and a cost."
"agricultural and cultivated" = "Land worked by hand: paddies stepped down a valley, a kitchen garden behind a farmhouse. The subject is the season's work and its yield."
"aquatic" = "Water as weather and as somebody: a river god choked with refuse, a sea that has risen over a town. Water moves, floods and carries the sky in it."
"atmospheric" = "Sky as the biggest presence in frame: cumulus building over deep blue, a storm wall advancing across a field. Wind is visible in grass, cloth and hair."
"glacial and frozen" = "Cold as hardship and as quiet: a mountain pass in snow, frost on a carriage window. Ice belongs to weather and to high places."
"fire and ember" = "Fire as a household creature and as a disaster: a hearth fire that talks, a town burning under bombers. Every flame has fuel and a place."
"textile and fiber" = "Cloth on the move: laundry on a line, an airship's canvas skin. It catches wind and light and is always in use."
"ritual object" = "The small shrines that sit everywhere: a roadside stone figure in a red bib, a shrine rope round a great tree. Offerings are modest and well kept."
"paper and inscription" = "Paper as charm, letter and contract: a talisman stuck to a doorway, a name signed away in a spirit's ledger. Writing shows as marks, never readable words."
"instrument and measure" = "Instruments of flight and trade: an altimeter's dial in a cockpit, a market scale. To measure here is to fly safely or to trade fairly."

[ghibli]
label = "Studio Ghibli"
# SPACE, 2026-10-10 (STYLE-OVERHAUL Prompt 1). One recipe is drawn per run,
# never one of this style's last 2, and replaces OPENNESS in the brief together
# with the WALLPAPER rule every [space] style shares (see
# llm_pipeline.WALLPAPER_RULE). OPENNESS stays in [ghibli.brief] for the
# record and is skipped while this array exists. One fixed recipe, "half the
# frame open distance", put far off / distance / beyond into 29 of 33 days.
space = [
  "a wide low horizon under an enormous sky, the near ground filling the bottom third",
  "looking up a steep slope or terraced hillside toward its crest",
  "from a ridge or rooftop down into a valley or town",
  "under a forest canopy with one break opening onto light beyond",
  "across water — a lake, a flooded field, the sea — to a far shore",
  "from the air, out of a flying machine or a high tower, the land laid out below",
  "one close place — a streambed, a doorway, the foot of a tree — with a single gap showing what lies past it",
  "along a road, rail line or river running away into the land",
]

# suffix_base split 2026-09-20: TECHNIQUE ONLY. It used to also mandate
# "towering cumulus clouds with hard-edged sunlit tops against a deep blue sky"
# and "warm naturalistic low sunlight" on EVERY ghibli image, which made it the
# last fixed instruction overriding a variable one. Measured: on the darkest
# cell available (hard/hi, exposure lo) the dial asked for "most of the frame
# unlit or obscured" and a strangeness that is "dangerous, diseased or
# grieving", and the render came back a sunny meadow with a friendly turtle.
# The suffix was vetoing both the light axis and the wonder tone, and probably
# always had been.
#
# Weather, palette and time of day now come from the dial (light, wonderTone)
# and from the charter's `weather`, which describes a RANGE rather than one
# state. What stays here is what is true of a ghibli frame at any hour: layered
# opaque paint, visible brushwork, heightened colour, and -- added explicitly,
# because this is what stops a dark day going grey and grimdark -- saturation
# that survives shadow. Mononoke's night forest is dark and still richly
# coloured.
#
# RISK, stated plainly: the cumulus-against-blue clause was one of the
# strongest recognisability cues, and the 2026-09-08 sweep put ghibli at 12/12.
# If recognisability drops, this is the change that did it, and the fix is to
# move that clause into the charter's `weather` as a bright-day option rather
# than back into the suffix.
# REWRITTEN 2026-10-10 (STYLE-OVERHAUL Prompt 3). The ghibli, cyberpunk and
# cosmic suffixes all asked for saturated, painterly, hazy digital
# illustration, close to the image model's default look, while the four
# styles that render distinctly each name a medium far from it. The three new
# suffixes differ from each other in line, shadow and light source: ghibli is
# 35mm hand-painted film, daylight-true colour, coloured shadows, light only
# from sun, sky or fire. The previous suffix_base, for the record:
# "Studio Ghibli feature-film animation style. Hand-painted backgrounds in
# layered opaque paint with visible brushwork in foliage, stone, cloth and
# water; forms built from stacked paint rather than smooth digital gradients;
# colour heightened rather than muted, and still saturated in shadow, in rain
# and at night rather than draining to grey; fine detail held even in the
# darkest parts of the frame." suffix_figures is unchanged.
# REVISED again 2026-10-10 (Prompt 4): the Prompt 3 renders showed the model
# ignoring "shot on 35mm film", "slight film grain" and "softness toward the
# edges"; the last sentence now states the visible result instead.
suffix_base = "A frame from a hand-drawn Studio Ghibli feature film of the 1980s and 90s. Backgrounds are hand-painted in opaque poster colour with visible brushwork; colour is natural and daylight-true — leaf greens, sky blues, warm earth, soft greys under overcast — never neon and never chrome. Shadows are coloured and transparent, never black. Light comes from the sun, the sky or a fire, never from glowing objects. Visible grain over flat areas of sky and wall; the whole frame slightly soft, warm and faded, like an old cinema print; no digital crispness, bloom, lens flare or glossy sheen."
suffix_figures = " Figures rendered in flat cel-shaded color with a single hard-edged shadow tone, never soft-blended, clean crisp outlines, large expressive almond eyes, simple minimal features, human-like proportions rather than typical anime stylization; only the one or two nearest figures have fully drawn faces, and any figure further back is drawn the way this style draws background crowds — turned away, in profile, or with features reduced to a few simple strokes and no fine detail"
# guidance removed 2026-09-20: superseded by [ghibli.world] above. Its
# world-description became the charter's fields; its prohibitions went to
# `forbids`, which was itself removed later the same day -- see the note
# in the charter block for where each one went. Both are in git history.

# CHARTER, 2026-09-26. Written from scratch in one grilling session with
# Garrett rather than retrofitted, so all ten fields were decided together.
# The old `guidance` and bare `suffix` are both deleted below; nothing in them
# was carried across on purpose.
#
# The decisions, so the reasoning survives the prose:
#   - USED FUTURE, not chrome and not the matrix. Heavy, analog, patched. It is
#     the only cyberpunk that obeys the rule that impossible things are heavy
#     and worn; chrome runs on glow and the matrix puts its wonder somewhere
#     that cannot be painted.
#   - EVERY LIGHT HAS A HOUSING (physics). Ghibli could say "nothing glows";
#     here light is the main material, so the rule is that light is hardware.
#     No holograms. This is what shuts out the glowing AI, and it is why the
#     old "avoid abstract energy-beings" ban no longer needs saying.
#   - NUMINOUS = whatever has grown past its makers (infrastructure or
#     flesh-machine, any scale) AND old gods moved into hardware. Both are
#     tended with offerings. The numinous field also carries the
#     automaton/presence boundary: still doing its designed job = automaton;
#     outgrown it and being fed = presence.
#   - STRANGENESS points elsewhere on purpose -- older or more alive than the
#     city, and never worshipped -- or it collapses into the numinous.
#   - The DIAL RUNS BOTH WAYS. Ghibli's bug was refusing to go dark; this
#     genre's is refusing to go light, so `weather` names daylight explicitly
#     and `dread` must be darker than the rain-and-night baseline.
#   - favoured_actors demotes the lone figure in the rain, this genre's
#     equivalent of Ghibli's lone ordinary person.
# REVISED 2026-09-26, same day, after the first six-cell (a) sweep (cp-a-*):
# the technique held but the world read as dieselpunk harbour, not cyberpunk.
# No neon in 12/12 (physics only described light as a housing rule, never said
# the city is saturated with it); harbour in 12/12 ("port city" + "dock hands"
# collapsed every register into a waterfront -- the cottage-kitchen bug again);
# the lo-exposure cells came back overcast or sunset (weather's "rain at night
# is not the default" argued with the dial); and charter phrases came back as
# lettered slogans. Fixes: physics/materials make lit signage and exposed
# electricity the city's main light; society adds verticality and demotes the
# port to one district; weather gives darkness a home (night, lower levels);
# strangeness and society lose their example lists; suffix_base asks for
# mostly unreadable lettering.
# REVISED again 2026-09-26 after cp-a3-*: neon was absent in 36/36 renders,
# and every sign that did appear was crowded with generated words, which come
# out as nonsense. physics now makes neon the after-dark light and says it is
# mostly SHAPE (pictogram, single character, arrow, border) seen from below,
# edge-on or blurred; society only allows scripts "where lettering shows at
# all"; suffix_base turns unreadable lettering into a depth-of-field
# instruction, which image models obey better than "do not write text".
# WEAR, 2026-10-10: "Surfaces are worn and patched" (materials) went for the
# same reason as ghibli's -- see the note above [ghibli.world]. Later the same
# day "patched ever since" (era) became "kept running ever since", and the
# industrial line's "patched" and the aquatic line's cisterns went too: an
# after-sweep traced patched (5/12) and cisterns to exactly those words.
# "old" left era, inhabitants, numinous and the fungal register line later
# the same day: it was in 8 of 8 cyberpunk prompts in Prompt 5's sweep.
# RE-CHARTERED 2026-10-10 (STYLE-OVERHAUL Prompt 4, grilled with Garrett):
# sources 80s-90s anime, Blade Runner, Gibson, Kowloon Walled City (out:
# 2077 chrome, Matrix code, glass utopias); society gains the days that are
# not work; myth adds tsukumogami; the highlight is its principle plus five
# drawn modes; the named neon shapes (fish, bowl, cross, arrow) are gone from
# physics and NEON, because the sweeps copied them; the clinic worker is
# demoted; every field and register line cut to at most two examples.
# Research: verification/charter-cyberpunk/research.md.
[cyberpunk.world]
era = "A future that arrived decades ago and has been kept running ever since. Nothing is new: machines are bolted onto older machines and towers built over the roofs of earlier towers. The technology is powerful and long past its prime, and most of it is kept alive by people who were never meant to maintain it."
materials = "Concrete, sheet steel, corrugated plastic and tarpaulin, with electricity everywhere and exposed: cable taped and hung in swags between buildings, signs and screens stacked up every facade. Under the city's light, surfaces read as colour in every reflection, never as brown grime. Repairs are visible and never match what they repair."
physics = "The city is lit by its own signs. After dark, and in the lower levels at any hour, neon and screen light is everywhere, blooming into the haze and streaking across every wet surface. Most of it is shape rather than words, seen from below, edge-on, or blurred by rain and distance; invent the shapes for the scene rather than reaching for the usual ones. Holograms are signage and nothing more. The numinous is never a hologram or a glow; it always has a body you could put your hand on. Impossible things here are heavy, bolted down, dripping, and lit by the colour around them."
society = "A city built upward because it has nowhere else to go: towers packed so close their walls touch, walkways and cables strung between them, lower levels that have not seen the sky in decades. It belongs to no single culture, and where lettering shows at all it is in many scripts. Institutions are sealed behind glass high above the street and deny that anything below them is alive. Life is not all work: a noodle stall at three in the morning, a bike gang racing an overpass, mahjong in a stairwell, a rooftop festival, a train packed to the doors."
weather = "Weather runs the whole range, from flat white overcast and smog-orange dawn to downpour and full night. Daylight reaches the roofs and the upper streets; below them it is always dusk under the signs. When the day calls for darkness, this city's darkness is night or the lower levels, lit only by its signs; when it calls for light, it is the same city by day, and just as much itself."
inhabitants = "People whose trade is whatever the day's material calls for, and as often off work as on it: a cook over a wok, a courier between jobs, grandparents and toddlers. Most bodies here have been repaired at some point, and that is a fact about the body, not the person's job. Gods walk here too, in hardware bodies, and a figure that is part animal is more often one of those than anything grown in a lab."
strangeness = "Things older or more alive than the city, left where they are and unremarked: an animal, or a relic of some earlier age of the world, lodged among the machinery as if it had always been there. Nobody explains them and nobody worships them; offerings are what mark the numinous, and these have none."
numinous = "The numinous is whatever has grown past its makers, and the gods who have moved into hardware. The first can be any size, from a vending machine that answers back to a server hall grown into a cathedral; the second have taken salvaged bodies, like a river god living in a storm drain. Both are physical, heavy and fed: candles, stickers, food, a technician who is also a priest. A machine still doing the job it was built for is not one of these; one that has outgrown its job and is being fed is. Never a glow, a projection or a voice from nowhere."
dread = "This city at its darkest is not simply this city at night in the rain. It is the body failing, flesh grown around metal that should have come out; infrastructure giving way, water rising through the lower levels; a person owned, collateral in someone else's contract; the numinous fenced off and metered. Violence is sudden, mechanical and costly, never glamorous, and the frame does not admire the corporation or the gun."
favoured_actors = "This world is richest in crowds at the market, the platform and the stairwell, the numinous in its fed bodies, figures joined by one shared thing, the decommissioned, animals living off the infrastructure, and swarms. Three figures are this genre's most worn images and should not be the default: a lone figure in the rain under a sign, a lone repair tech bent over a machine, and a clinic worker at a counter."
# myth, 2026-10-10 (STYLE-OVERHAUL Prompt 2) -- see [ghibli.world]'s note.
myth = "Loa, orisha, saints and kami living in hardware: the spirits of Vodou and Santería riding machines instead of people, saints whose days are kept at junction-box shrines, and tsukumogami, the objects that come alive after a hundred years of use and are fed so they stay kind."
# highlight, 2026-10-09 (Q68 d, Garrett): something alive in the machine.
# Kept loose on purpose -- the principle, not the form; the register and the
# day decide what the living thing is. REWORDED same day by Garrett: the first
# version ("a plant, an animal, a body...") gave animals 10-15 of 20 highlights
# whatever the actor (cp-highlight-actor-*); this one leads with cyberpunk's core
# -- body into machine, machines that outlive their purpose, systems that watch
# or answer back, growth feeding on hardware -- and names no animal. Replaces the fallback "wrong in one way,
# larger or older" logic, whose cyberpunk results Garrett judged not working.
highlight = "The living point of the frame, which the eye finds first, and it belongs to the machine world. Today's kind of life is given with this definition. It does not have to be strange or out of place; it is the thing in the frame that is alive, and the frame is built so the eye goes to it."
# One drawn per run, never one of cyberpunk's last 2 (Prompt 4, 2026-10-10):
# the four kinds the highlight used to list, plus the fed sacred machine.
highlight_modes = [
  "a body worn into its hardware",
  "a machine that has outlived its purpose and kept itself running",
  "a system that watches or answers back",
  "growth or rot feeding on the hardware",
  "something sacred living in a machine and being fed",
]

# BRIEF, 2026-09-26. Cyberpunk's own rules in place of ghibli's (see
# [ghibli.brief]); decided in the chartering session.
#   depth  -- replaces OPENNESS. Reworded 2026-10-08: it named the canyon first,
#             and the canyon then appeared in 15 of 20 frames (2 of 10 without
#             the rule). The canyon is now one depth source among several.
#             Original note: Keeps the wallpaper from being claustrophobic,
#             which was OPENNESS's real job, without demanding sky: this world
#             is enclosed density, and "half the frame open" argued with it.
#   neon   -- the charter's neon was optional and was skipped in 36/36 renders.
#             Shape, not words: generated lettering comes out as nonsense.
#   tended -- REMOVED 2026-10-08. Prompt-only arm sweeps (verification/
#             cp-composition-arms, -hard) showed no measurable effect in a soft
#             or a hard cell: the soft dial cells already ask for tending, and
#             on hard days it argued with the cell. It was also one of three
#             places naming repair, which together turned 55 of 56 human
#             actors into a repair tech -- see inhabitants/favoured_actors.
#   temper -- NOT one of the three chosen rules; added because dropping THE
#             IMPOSSIBLE also dropped the only place {wonderTone} reached
#             Stage 2, so hard and soft days would lose their temper. Delete it
#             if polarity should not reach this world that way.
# THE IMPOSSIBLE is deliberately absent: strangeness arrives through presence
# and the mandatory anomaly, and the risk observed in the (a) renders ran
# toward fantasy, not toward the plausible.
[cyberpunk.brief]
depth = "DEPTH — applies to every image: the eye must travel a long way into the frame, along whatever this place offers — a market aisle running back under awnings, a flooded underpass, a run of rooftops and water tanks, a platform and its tracks, a corridor of doors, a stair falling away, or a canyon between towers. The canyon is one source of depth among many, not the default. Layer behind layer, each smaller and hazier than the last. It does not need sky. At least three distinct layers of distance must be visible behind the nearest subject. A shallow scene with a wall close behind the subject is a failed response, and so is a close-up that crops the city out."
neon = "NEON AFTER DARK — whenever the light line below puts the scene at night or below where daylight reaches, the main light in the frame is neon: bent glass tube in colour, on its brackets, tinting the haze and every wet surface. Name at least two neon fixtures and the shape each one traces, invented for this scene, never what words it spells. A dark frame lit only by lamps, bulbs or candles is a failed response, and so is a sign made mostly of words. By day the tube may still be there, unlit."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"
# signature, 2026-10-10 (Prompt 4): replaces the default signature rule.
signature = "SIGNATURE — at least one thing marks this as the used future, named explicitly: a body with visible hardware, a machine bolted onto an older one, or signage traced in neon tube. It may be the highlight or the actor. A frame that could be any modern city is a failed response."

# LIGHT, 2026-10-10 (Prompt 4): the global "full day" cannot hold below the
# roofs, where the charter says it is always dusk under the signs.
[cyberpunk.light]
lo = "It is night, or the lower levels where daylight never reaches. At least two thirds of the frame is dark, and the only light is the city's own signs and screens. A frame that is mostly well lit is a failed response."
mid = "Grey daylight at street level, thinned by the towers, mixing with sodium and neon from the signs; lit and unlit areas both substantial. A frame in full sun or full night is a failed response."
hi = "Flat white smog-light on the roofs and upper streets, even across the frame, with no dramatic shadow; the signs are there but outshone. A frame that is mostly dark, or lit mainly by its own signs, is a failed response."

# VERBS, 2026-10-10 (STYLE-OVERHAUL Prompt 1) -- see [ghibli.verbs] for the
# rule. "buckling" went to "peeling away" and "cooling" to "condensing", so the
# only verbs shared with ghibli's same arrays are the ones native to both
# (flooding, steaming, cooking).
[cyberpunk.verbs]
process_hard = ["shorting out", "sparking", "flooding", "leaking", "overloading", "corroding", "blacking out", "jamming", "venting", "peeling away", "melting", "collapsing into", "seizing up", "gridlocking", "tripping out", "crushing", "sinking", "rotting", "overheating", "bursting", "grinding to a halt", "shattering"]
process_soft = ["humming", "flickering", "steaming", "cycling", "dripping", "reflecting", "idling", "charging", "simmering", "ticking over", "dimming", "streaming", "glowing", "condensing", "rattling", "scrolling", "purring", "buzzing", "blinking", "fogging up", "whirring"]
actor_hard.work = ["prying open", "hot-wiring", "splicing", "hauling", "welding", "cutting free", "forcing", "holding shut", "dragging", "wrestling with", "bracing against", "jacking into", "rerouting", "bolting down"]
actor_hard.rest = ["holing up in", "sleeping rough under", "sitting out"]
actor_hard.play = ["gambling over", "betting on", "drag-racing"]
actor_hard.ritual = ["burning offerings at", "chanting over", "feeding coins into"]
actor_hard.travel = ["shoving through", "squeezing through", "clinging to the outside of", "scaling", "ducking under"]
actor_soft.work = ["cooking", "soldering", "sorting scrap", "tuning", "feeding", "hanging laundry", "washing", "selling", "delivering"]
actor_soft.rest = ["slurping noodles", "napping under", "reading by screen-light", "sharing a smoke"]
actor_soft.play = ["playing mahjong at", "singing along to", "dancing under", "gaming on"]
actor_soft.ritual = ["lighting incense at", "leaving food at", "pasting a prayer sticker on", "ringing a shrine bell at"]
actor_soft.travel = ["riding pillion through", "strolling through", "waiting on a platform for", "ferrying"]

# REGISTERS, 2026-09-26. How this world realises each substance register, one
# span-and-principle line per register -- never an inventory (see
# registers.toml's [guidance] header): anything listed marks the range and is
# a starting point to reach past. Drafted family by family with Garrett.
#
# Read by load_register_line() since the 2026-09-26 Stage 1.5 split: the
# day's line (primary and secondary) goes to the material call, which builds
# the objects and the anomaly from it, and to Stage 2. Before the split the
# register was picked after Stage 1.5 had cast the scene, and a 20-register
# sweep collapsed to one scene (cp-reg20-base; ghibli the same, gh-reg20-dry).
[cyberpunk.registers]
# Each line ends with "Its highlight:" (2026-10-09, drafted family by family
# with Garrett): what the charter's highlight -- something alive in the machine
# -- looks like in that material. Each list spans different kinds (person,
# creature, machine, place) so no single answer becomes the default; a loose
# charter principle alone gave a pigeon in 4 of 6 registers (cp-highlight-rot).
"botanical" = "What grows here grows in spite of the city or because someone had nowhere else to grow it: roots splitting a ramp, racks under grow-lamps. Its highlight: the one plant thriving where nothing should, grown so far into the structure that it holds it up."
"bodily and anatomical" = "The body as a thing maintained, bought and failing: the seam where flesh meets steel, a prosthetic laid out on a street surgeon's table. Clinical, never gore. Its highlight: the modification that makes the body a tool for surviving here, like a blade for a limb or tools at the fingertips."
"fungal and decaying" = "Rot is the city's other maintenance crew, spreading along its wet paths: mould across ductwork, fungus furring a dead server rack. Its highlight: the city's decay kept alive, like a robot barely running after generations of modifications."
"animal and creaturely" = "The animals that live off the city and use its infrastructure as terrain: rats on the cable runs, a working animal wherever no machine was cheaper. Nobody is sentimental about them. Its highlight: the animal this one corner of the city has and no other does."
"geological" = "The city is a geological layer too: concrete stacked in strata, and in the deepest levels the older ground showing through, like bedrock sweating in a sub-basement. Its highlight: the place where the foundations lose the argument with the ground, and whatever has settled into it."
"metallic and ore" = "Metal is the city's money, stripped from walls, sold by weight and poured again: copper wire in coils, scrap sorted by hand into heaps. Its highlight: something that has made metal its body, like a creature welded from scrap that still moves."
"glass and ceramic" = "Glass divides this city: sealed and clean in the windows of the institutions, bent and reused below, like neon tube being heated in a workshop. Its highlight: something alive behind or inside the glass, like a visor with an eye behind it."
"architectural" = "Architecture here is accretion, not design: an original frame under decades of unauthorised additions, a bridge two neighbours built between their windows. Look at the joins. Its highlight: the join where someone made the building their own and it took."
"domestic interior" = "A home is one small room doing every job, bunk and kitchen and shrine at once, with neon coming in through the curtain. Crowded and cared for, never squalid for its own sake. Its highlight: what makes this one room alive, like a pet machine nobody can bear to switch off."
"mechanical" = "Every machine has been opened, fixed and closed again by someone who is not its maker: a lift's cable drum rebuilt from motorbike parts, a vending machine with its guts on the pavement. Its highlight: a machine that has stopped being only a machine."
"industrial and infrastructural" = "The city's nervous system, exposed and overloaded: substations humming in stairwells, the pumps that keep the lower levels dry. One failure takes a district dark. Its highlight: where the city's systems keep something alive, or something alive keeps a system going."
"agricultural and cultivated" = "Food grown in the city's leftover space and measured by yield: mushroom beds in a basement, a rooftop terraced for rice. Its highlight: the crop or its keeper at their most alive, like a harvest coming in."
"aquatic" = "Water is inside the city, either too much of it or sold: floods through the lower levels, clean water in jerrycans with a price on them. Its highlight: what lives in the water the city could not keep out."
"atmospheric" = "The air is thick enough to hold light: steam from grates, kitchen smoke rolling out of a stall. It is where the neon becomes visible as colour, and it always comes from somewhere you could point to. Its highlight: something alive the air gives away, like breath and smoke rising off a crowd."
"glacial and frozen" = "Cold here is always made by a machine and paid for: freezer lockers at a market, frost furring a coolant line. A power cut means a thaw. Its highlight: what the cold is keeping alive."
"fire and ember" = "Fire is the oldest technology still running here and the street's worst danger: woks roaring on a stall, a transformer burning in a stairwell. Every flame has a fuel and a vessel. Its highlight: what lives by the fire."
"textile and fiber" = "Cloth is the city's cheapest wall and roof and always does a structural job: tarps lashed over a gap in a facade, curtains dividing one room into three. Its highlight: what lives under or inside the cloth."
"ritual object" = "The street religion's hardware, made from the city's waste and handled smooth: offering bowls cut from cans, a shrine box built into a junction box. Its highlight: the shrine at its most alive, like a god's hardware body taking an offering."
"paper and inscription" = "Paper is where the street keeps what it will not trust to a screen: handbills pasted over handbills, ledgers swollen with damp. Writing appears as marks and layers, never as words anyone could quote. Its highlight: what lives in the paper."
"instrument and measure" = "Everything is metered, and the instrument is how the city charges you: meters spinning in a stairwell bank, the scrap dealer's scale. Its highlight: what the meter is measuring at its most alive."

[cyberpunk]
label = "Cyberpunk"
# SPACE, 2026-10-10 (STYLE-OVERHAUL Prompt 1) -- see [ghibli] space. Replaces
# DEPTH, which is kept in [cyberpunk.brief] for the record and skipped while
# this array exists. DEPTH's 2026-10-08 rewording already found that naming one
# depth source first made it the default; a draw makes every source the
# default in turn.
space = [
  "down a market aisle under layered awnings",
  "straight up a canyon between towers to a slot of sky",
  "along a flooded underpass to a lit far end",
  "across a rooftop run of tanks and antennas to the skyline",
  "along a platform and its tracks into a tunnel",
  "down a stairwell falling away floor after floor",
  "along a corridor of doors",
  "from an overpass down onto stacked levels of traffic",
]

# REWRITTEN 2026-10-08 against Garrett's reference images
# (~/Pictures/astro-arc-tests/Reference Cyberpunk: painterly anime city scenes,
# flat graphic anime portraits, glowing concept painting). The 35mm
# practical-effects suffix (Q7 (a), 2026-09-26) produced the same dark brown wet
# industrial town every time: it, the rust-and-grease materials, the no-glow
# physics and the series visual signature ("muted earth tones... diffuse
# daylight... moderate contrast") all pulled to brown at once.
#
# The palette now lives HERE, in the technique. The 2026-09-20 rule that kept
# palette out of suffixes was about time of day vetoing the dial; a palette is
# not a time of day, and in the references the palette is the style. Light
# level still comes from the dial -- "by day or night" is deliberate.
#
# Medium is Q54 (a): painterly anime illustration with concept painting's
# colour and glow. The old film/anime A/B is moot. Figures take the colour, line
# and gear detail of the portrait references (Q59), but frames stay scenes:
# DEPTH still requires distance.
#
# The `signature = false` switch set here on 2026-10-08 (Q57) is gone: the
# natal visual signature was removed from the pipeline for every style the
# same day, after a with/without test showed it changed nothing measurable.
# REWRITTEN 2026-10-10 (STYLE-OVERHAUL Prompt 3) -- see the ghibli note. Now
# 1980s cel animation: ink outlines on everything, two-tone cel shading, solid
# near-black shadows, airbrush only on light sources. The palette stays in the
# technique, as the 2026-10-08 rewrite below decided. The previous
# suffix_base, for the record: "Digital illustration in the tradition of
# contemporary anime background art and cyberpunk concept painting: painterly
# brushwork, crisp detail where the eye lands, soft atmospheric haze between
# the layers of distance. A saturated neon palette carries every frame, by day
# or night: electric cyan and teal against hot magenta and pink, with accents
# of sodium orange and acid yellow; shadows fall into deep blue and violet,
# never black, brown or grey. Light glows: signs and screens bloom into the
# haze, wet surfaces mirror the colour in long streaks, rain and steam catch
# it. Any lettering is soft, distant or abstract, never crisp readable words."
# suffix_figures is unchanged.
suffix_base = "A frame from a 1980s Japanese cel-animated science-fiction feature. Hard-edged two-tone cel shading with clean black ink outlines on everything, buildings and machines included; dense hand-drawn mechanical detail. Deep shadows are solid near-black blue. Only light sources are airbrushed — signs, screens and lamps carry soft halos and streaks — while every surface stays flat painted colour: electric cyan, hot magenta and sodium orange against the dark, or flat hazy white smog-light by day. Visible flatness of painted cels and slight film grain. Lettering appears only as glyphs and pictograms, never as readable words."
suffix_figures = " Figures are drawn as anime illustration: cel-shaded with clean ink linework, saturated colour on clothing and gear, dense mechanical detail on prosthetics, helmets and rigs. Only the nearest one or two have fully drawn faces; figures further back are silhouettes or simple shapes lit by the neon."
