# CHARTER, 2026-10-10 (STYLE-OVERHAUL Prompt 4), from one grilling session
# with Garrett. The decisions, so the reasoning survives the prose:
#   - A BLEND (Q1 c): the mythic sky built the space-art way. Constellations
#     are physical beings at planetary scale, lit by a real star, which keeps
#     the rule every charter shares that the strange has a body.
#   - 1970s SPACE ART, leaning on ROGER DEAN: floating islands with water
#     falling off their edges, rock eroded into flowing contours, grown pod
#     dwellings, serpent creatures; Foss hulls for hardware; Bonestell and
#     McCall around them. Out: franchise designs, modern CGI gloss, NASA
#     photo-realism. Dean's look is described, not just named, because the
#     image model follows described outcomes better than artist names.
#   - Dean's CONTENT (islands, dwellings, serpents) lives in the charter and
#     his RENDERING in the suffix, so the suffix cannot force islands into
#     every register (the cottage-kitchen collapse).
#   - SIGNATURE: the land visibly hangs in space, plus one thing at celestial
#     scale. TEMPER carries the dial's wonderTone, as in cyberpunk. THE
#     IMPOSSIBLE and OPENNESS are not used; space recipes replace OPENNESS.
#   - No motifs ruled out yet (Q2): too little testing to be tired of any.
#     favoured_actors still demotes the lone suited figure facing the stars.
# Research notes: verification/charter-cosmic/research.md.
[cosmic.world]
era = "The space age as 1970s paperback covers painted it: people living on rock that hangs in open sky and working among hulls someone else built. Technology is heavy, hand-flown and painted in hazard stripes, never sleek and never a touchscreen."
materials = "Rock eroded into smooth, flowing, rounded contours; hull plate in banded colours; dwellings grown rather than built, shaped like gourds or seed pods with round windows. Everything is opaque and solid, and even ice and gas have a surface the light can find."
physics = "Space with weather. Islands of rock float in open sky, water falls off their edges into nothing, and gravity is light enough for long leaps and slow falls. One star lights everything from one side and the far side is black. Nothing glows of its own accord except stars, fire and a craft's working lights, and nothing is translucent."
society = "Scattered settlements on islands and stations, joined by small craft. People are known by the craft they fly and the island they come from. Authority is far away aboard something larger; the void and the star are close. Derelicts nobody now living built are salvaged, lived in, and visited as shrines."
weather = "The sky is the weather, and it runs the whole range: an airbrushed band from warm orange to violet, a dust tide rolling in, an eclipse, a planet rising. Choose what the day calls for; black and starry is one choice among many, never the default."
inhabitants = "People who fly, mine, farm, herd and keep watch on the islands and stations, in heavy suits worn like work clothes; and creatures shaped by low gravity and open sky, from flocks roosting under island overhangs to beasts of burden in harness."
strangeness = "What would be impossible on a planet is ordinary here: land with no ground under it, two shadows from two suns. Nobody looks up at it, and it is lit like everything else."
numinous = "The constellations are beings with bodies at the scale of worlds, and the stars' stories still happen to them. A star-being is physical — hull, rock, ice or hide — lit by a real star on one side and black on the other: the Hunter a derelict the size of a moon, the Silver River an actual ring of ice and dust. People leave offerings at their feet, mine their edges and steer by them. Never a glow, an outline of light or a translucent figure."
dread = "This world at its darkest is the void being indifferent. Anything that keeps people alive out here can fail, and the large things do not notice: a tether parting with someone on the wrong end, a star swelling until it strips the world it lights. Shown by scale and distance, never by a face asking the viewer to grieve."
favoured_actors = "This world is richest in crews working one craft together, the creatures of the islands and the updrafts, and constellation-beings in their bodies. A lone suited figure seen from behind, facing the stars, is this genre's most worn image and should not be the default."
myth = "The sky myths of many peoples, in which the stars are beings and their stories are still happening: heroes and animals set among the stars, and the sky as a goddess's body with the sun's boat crossing it each night."
highlight = "The thing the eye finds first, and it belongs to the sky: a constellation-being's body or a piece of one, or something made at celestial scale. It is solid, lit from one side by the star and black on the other; it does not glow or turn translucent. Today's kind of wrongness is given with this definition. Where its wrongness is size, choose a scale comparison native to this scene, never the same one twice, and put part of it in shot rather than shrinking it."
highlight_modes = [
  "a body the size of a world",
  "a piece of a constellation fallen to the ground",
  "awake when it should be inert",
  "in the wrong orbit or the wrong sky",
  "being used for a job it was never built for",
]

[cosmic.brief]
signature = "SIGNATURE — the land visibly hangs in space: a horizon or an island edge drops away into black void or a gradient sky, and at least one thing at celestial scale (a planet, a ring, a star-being) is in frame and named. A scene that could be taking place on Earth is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[cosmic.verbs]
process_hard = ["drifting loose", "tearing free", "cracking apart", "venting into the void", "tumbling", "crumbling off the edge", "freezing solid", "boiling off", "searing", "shearing", "decompressing", "spinning out", "colliding with", "splintering", "sublimating", "burying under dust", "flaring", "sinking into the gulf", "engulfing", "splitting along its seam", "slipping its orbit", "eclipsing"]
process_soft = ["orbiting", "turning slowly", "pouring off the edge", "trailing spray", "lifting", "sinking slowly", "frosting over", "glinting", "coasting", "unfolding", "thawing", "budding", "tilting toward the star", "casting long shadows", "wheeling", "cresting the horizon", "shedding frost", "rocking at anchor", "circling", "gathering dust", "breathing out vapour", "falling into step"]
actor_hard.work = ["winching in", "clamping onto", "cranking shut", "towing", "boarding", "jacking open", "lashing down", "propping", "salvaging", "drilling into", "hooking a tether onto", "fending off"]
actor_hard.rest = ["sleeping strapped into", "holding still behind", "sheltering in the lee of"]
