# CHARTER, 2026-10-10 (STYLE-OVERHAUL Prompt 4, approved by Garrett): the manuscript page: labours of the months, bestiary, marginal hybrids reaching in from the border; the lone haloed figure demoted.
# Brief is SIGNATURE + TEMPER (THE IMPOSSIBLE and OPENNESS no longer apply;
# space recipes replace OPENNESS). The suffix is untouched, as Prompt 4 asks
# for the four technique styles. Research: verification/charter-illuminated/research.md.
[illuminated.world]
era = "The high and late Middle Ages as the manuscript painters saw them: walled towns, castles, monasteries and fields worked through the turning year, under a sky of gold. Technology is the plough, the mill, the loom and the sword."
materials = "Gold leaf, ultramarine and vermilion on parchment; things are flat, bright and outlined, and stone, wood, wool and iron are known by pattern rather than shading."
physics = "The page is the world's edge: a border of vines, creatures and initials frames every scene, and things in the border are as alive as things in the picture and may reach into it. Space is stacked rather than deep: the far fields sit above the near ones. Gold is the sky's light; nothing else glows."
society = "Lords, monks, peasants and townsfolk, each with their month's labour. The year turns from ploughing to harvest to the feast, and not all of it is work: hunting, dancing, tournaments and warming at the fire."
weather = "The weather is the month: snow in January, rain in April, harvest heat in August, the winter fire. Pick the month the day calls for."
inhabitants = "Peasants, monks, knights, pilgrims and townspeople; bestiary animals with their meanings; and the hybrids of the margins, half person and half snail or bird."
strangeness = "The margin is full of the impossible and it is unremarkable: a rabbit jousting, a knight fighting a snail. Monsters from the edge of the known world are painted with the same care as a cow."
numinous = "Saints, angels and the zodiac have bodies: a saint standing among the harvesters, the Twins in a roundel above the field. They are flat, gold-lit and outlined like everyone else; the halo's gold is the only glow."
dread = "This world at its darkest is the Apocalypse and the Dance of Death: the beast rising from the sea, death leading the dancers. Flat, bright and orderly, which is what makes it terrible."
favoured_actors = "Groups at the month's labour, processions, animals of the bestiary, and marginal hybrids. A lone haloed figure facing the viewer is this tradition's most worn image and should not be the default."
myth = "Saints' legends, the bestiary (the pelican feeding its young with its blood, the whale mistaken for an island), Arthurian romance, and the zodiac and the children of the planets."
highlight = "The thing the eye finds first, and it belongs to the page: a bestiary creature, a marginal hybrid stepped into the scene, a saint at work, or a zodiac figure come down. Today's kind of wrongness is given with this definition. Flat, outlined and lit by gold like everything else."
highlight_modes = [
  "a marginal hybrid stepped into the main picture",
  "a bestiary creature doing what its legend says",
  "a zodiac figure come down into its month",
  "far too large for the page's scale",
  "an animal doing a person's labour",
]

[illuminated.brief]
signature = "SIGNATURE — the page is in the world: a labour or feast of the month, a zodiac roundel, or a creature from the border reaching into the scene, named explicitly. A picture that could be any medieval-looking painting is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

