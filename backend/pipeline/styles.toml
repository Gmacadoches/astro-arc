# Art-style presets for Stage 2's prompt suffix. Each generation appends
# whichever preset is selected in the widget's Style dropdown to Stage 2's
# imagery, the same way the old fixed style.toml suffix always did — only
# now there's more than one to pick from.
#
# These five are the directions explored during Phase 3's style review
# (see the review log); "symbolist" is the one that stuck and stayed the
# default. Add more presets here freely — each needs a "label" (shown in
# the dropdown) and a "suffix" (appended verbatim to every Stage 2 prompt).

[symbolist]
label = "Symbolist / Visionary"
suffix = "painterly, visionary symbolist painting in the tradition of Odilon Redon, Remedios Varo, Leonora Carrington, and Hilma af Klint's illuminated visions — strange, hand-painted, not digital or photographic"

[engraving]
label = "Antique Engraving"
suffix = "antique astronomical engraving, fine linework, star atlas illustration, sepia and ink tones, detailed etching"

[artdeco]
label = "Art Deco"
suffix = "art deco poster design, bold geometric shapes, metallic gold and emerald, symmetrical, elegant linework"

[cosmic]
label = "Cosmic / Nebula"
suffix = "ethereal cosmic art, nebula and starfield, dreamlike aurora colors, soft glowing light, painterly, otherworldly"

[surreal]
label = "Surreal Painting"
suffix = "surreal dreamlike oil painting, soft brushwork, twilight color palette, fine art illustration"

# Rewritten 2026-09-07 from actual research (see CHANGELOG.md), not general
# impression — the original suffix wrongly called for "watercolor" character
# rendering. Ghibli characters are flat cel-shaded (solid base color, one
# hard-edged darker shadow tone, crisp clean outlines) — backgrounds are the
# painted half, in opaque poster paint/gouache (not watercolor), wet-into-wet
# for soft skies/clouds then sharp detail added as it dries. Keep that
# character/background technique split if this is revised again.
[ghibli]
label = "Studio Ghibli"
suffix = "Studio Ghibli feature-film animation style: characters rendered in flat cel-shaded color with a single hard-edged shadow tone, never soft-blended or watercolor-textured, with clean crisp outlines, large expressive almond eyes, simple minimal features, and human-like proportions rather than typical anime stylization. Backgrounds are hand-painted in opaque gouache/poster color, soft wet-into-wet skies and clouds with sharp painted detail on foreground elements, tonal layering for depth. Warm naturalistic light, in the tradition of Miyazaki's films and background painter Kazuo Oga"

[cyberpunk]
label = "Cyberpunk"
suffix = "cyberpunk digital art, neon-lit rain-slicked streets, holographic signage, chrome and glass megastructures, moody blue and magenta lighting, high-tech-low-life atmosphere in the tradition of Blade Runner and Ghost in the Shell"

# "Dystopian Future WWII Fusion" — interpreted as dieselpunk/retrofuturism:
# WWII-era military iconography and machinery fused with a bleak sci-fi
# future, not a literal WWII battle scene. Revisit the suffix if that's
# not the intended reading.
[dystopianwwii]
label = "Dystopian Future WWII Fusion"
suffix = "dystopian retrofuturism, WWII-era military iconography and machinery fused with a bleak futuristic wasteland, rusted war machines, gas masks, brutalist concrete architecture, muted propaganda-poster palette, ashen overcast light, gritty dieselpunk atmosphere"
