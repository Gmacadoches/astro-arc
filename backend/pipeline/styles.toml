# Art-style presets for Stage 2's prompt suffix. Each generation appends
# whichever preset is selected in the widget's Style dropdown to Stage 2's
# imagery, the same way the old fixed style.toml suffix always did — only
# now there's more than one to pick from.
#
# "symbolist" was the one that stuck from Phase 3's original style review
# and stayed the default. Curated down to 5 on 2026-09-07 (cut artdeco,
# dystopianwwii, surreal — see CHANGELOG.md for the review method and
# reasoning) after a batch of test renders across all 8 originals made
# clear which ones were redundant or too generic to keep, then grew back
# to 7 the same day with ukiyoe/illuminated (sourced from a user-supplied
# reference guide, see CHANGELOG.md). Add more presets here freely — each
# needs a "label" (shown in the dropdown), a "suffix"
# (appended verbatim to every Stage 2 prompt),
# and a "guidance" (below) — a one-line description of what kind of
# imagery this style can actually depict, fed to Stage 2 itself so it
# doesn't invent imagery the style has no vocabulary for (e.g. a
# grounded/representational style being asked to render "a body made of
# pure sound-wave energy" — added 2026-09-07, see CHANGELOG.md; every
# preset needs one, not just the representational ones, since it's what
# tells Stage 2 abstraction is *allowed* for the visionary styles too).


# CHARTER, 2026-10-10 (STYLE-OVERHAUL Prompt 4, approved by Garrett): Varo and Carrington's concrete dream-world: inner things built as outer ones; glowing orbs and abstraction ruled out by physics.
# Brief is SIGNATURE + TEMPER (THE IMPOSSIBLE and OPENNESS no longer apply;
# space recipes replace OPENNESS). The suffix is untouched, as Prompt 4 asks
# for the four technique styles. Research: verification/charter-symbolist/research.md.
[symbolist.world]
era = "No single era: the dream-world of the Symbolist and Surrealist painters, where towers, vehicles and kitchens from old Europe and old Mexico house rites nobody explains. Its technology is handmade and impossible, like a bicycle that weaves as it rides or a tower that spins thread."
materials = "Wood grain, threadwork, feathers, stone, glass and cloth, painted finely with visible texture; bodies merge with these materials at their edges. Everything is solid enough to touch."
physics = "Inner things are built as outer ones: a feeling is a tower, a memory is a room. Things change into each other at their edges, slowly and in plain sight. Light comes from a window, a candle or a lamp, and nothing glows of its own accord."
society = "Small closed communities, like a household of women or a tower of scholars, keeping rites and crafts that are never explained. Days here are rites, meals, journeys and games as much as work."
weather = "Weather is a mood made physical: a sky with the grain of wood, a still yellow dusk. Pick what the day calls for."
inhabitants = "Elongated cloaked people with heart-shaped faces, hybrid animal-women, scholars, weavers and travellers; owls and white horses; and beings who are partly furniture or partly plant."
strangeness = "Strangeness is the medium: nothing here is ordinary and nobody is surprised. The rule is that every strange thing is a concrete thing doing something, never a symbol floating free."
numinous = "The numinous is a craft practised in plain sight: the world's mantle being woven in a tower, a star caught in a cage and fed. It has a body and a workplace, never a glow, an aura or pure abstraction."
dread = "This world at its darkest is enclosure: a room with no door, a figure slowly turning into furniture, an island of the dead approached by boat. Calm and exact, never gory."
favoured_actors = "Pairs and households sharing one rite or craft, hybrid figures, animals with purposes, and the numinous at work. A lone figure gazing into the distance is this tradition's most worn image and should not be the default."
myth = "Alchemy and Hermeticism, Celtic and Mexican folklore, Theosophy, and Greek myth as the Symbolists painted it: the work of transformation, the descent to the underworld, the weaving of fate."
highlight = "The thing the eye finds first: an inner state built as a concrete apparatus, room or body. Today's kind of wrongness is given with this definition. It is solid, finely painted and lit like everything else."
highlight_modes = [
  "a person partly become an object",
  "an apparatus that does an impossible job",
  "a room that is also a body",
  "an animal performing a rite",
  "a small thing at the scale of a building",
]

[symbolist.brief]
signature = "SIGNATURE — at least one impossible apparatus, or a body partly turned into something else, is named explicitly and doing something. It may be the highlight. A scene that could be an ordinary painting of an ordinary room is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT, 2026-10-16 (charter-required): the global light lines, copied word
# for word when they were removed from the pipeline (decision 4). Rewrite
# them only for a reason this world has.
[symbolist.light]
lo = "It is night, or the scene is somewhere daylight does not reach. At least two thirds of the frame is dark, and what is happening is only partly visible — lost in shadow, fog or depth rather than described. The only light is what the scene itself provides. A frame in which most of the image is well lit is a failed response."
mid = "The light comes from one clear direction, and lit and unlit areas are both substantial. A frame lit evenly from everywhere is a failed response."
hi = "It is full day — flat overcast, open daylight or hard noon sun — and the light is even across the frame. Everything is visible: nothing is hidden and nothing is dramatised by shadow. A frame that is mostly dark, lit by a low or setting sun, or lit mainly by the scene's own lamps and signs is a failed response."

[symbolist.verbs]
process_hard = ["dissolving", "petrifying", "unspooling", "hardening", "devouring", "fracturing", "entangling", "sealing over", "wilting", "consuming", "strangling", "liquefying", "ossifying", "crumbling", "tightening", "closing in", "bleeding into", "caging", "spreading like a stain", "tarnishing"]
