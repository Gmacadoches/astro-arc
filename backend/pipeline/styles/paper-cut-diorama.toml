label = "Layered Paper-Cut Diorama"
suffix = "layered paper-cut art photographed as a shadow box, many stacked layers of coloured card with crisp cut edges, soft drop shadows between layers creating depth, gentle backlight glowing through the gaps, matte paper texture, limited harmonious palette, figures as flat cut silhouettes, main subject placed below the top edge"
space = [
  "layer after layer of hills receding into a glowing backlit sky",
  "through a frame of cut leaves into a forest clearing",
  "down a cut-paper street of houses to a tower",
  "across layered waves of the sea to an island",
  "into a cave whose layered walls open on a lake",
  "up a valley of layered mountains toward a moon",
  "through tiers of clouds to a floating city",
]

[world]
era = "A fairy-tale world folded from paper, with castles, villages and forests, and technology of windmills, lanterns and sailboats."
materials = "Card, tissue and cut paper lead; thread, vellum, foil, tracing paper and folded origami are the common stuff."
physics = "Everything is flat but layered; depth is distance between sheets. Light shines through gaps and thin paper. Lanterns glow; nothing else does. Things can unfold and refold."
society = "Villages, castles, mills and harbours. People bake, sail, dance, travel and celebrate festivals with lanterns."
weather = "Weather in paper: cut snowflakes, tissue clouds, a storm of torn grey layers, rain as fine threads, a clear glowing sky. Pick what the day calls for."
inhabitants = "Villagers, travellers, foxes, deer, whales, birds, folded creatures and fairy-tale beings."
strangeness = "Paper behaving like paper: a bird unfolding from a letter, a bridge made of a folded map. Nobody is surprised."
numinous = "The sacred is the light behind the layers: a glowing moon or sun shining through everything, a great folded creature, a lantern that never goes out."
dread = "On hard days the paper fails: torn layers, water soaking through, fire curling the edges, a forest crumpled flat."
favoured_actors = "Animals, travellers in relation, crowds and folded presences. A child silhouette under a moon is the most worn image here and should not be the default."
myth = "European fairy tales, Japanese origami folklore and the shadow-puppet tradition."
highlight = "The thing the eye finds first is a cut or folded form that stands out from the layers. Today's kind of wrongness is given with this definition."
highlight_modes = [
  "a creature unfolding from a flat object",
  "a cut silhouette casting a shadow of something else",
  "a hole cut right through all the layers",
  "a structure folded impossibly",
  "one layer lit far brighter than all the rest",
]

[brief]
signature = "SIGNATURE — at least four distinct paper layers are named, from foreground to background. A flat single-layer image is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[light]
lo = "It is night: at least two thirds of the frame is dark layers, with light only glowing from behind through gaps or lanterns. A frame that is mostly bright is a failed response."
mid = "Light comes from behind and one side, so layers cast clear shadows on each other. A frame with no shadows between layers is a failed response."
hi = "Bright even light across all layers, colours fully visible. A frame that is mostly dark is a failed response."

