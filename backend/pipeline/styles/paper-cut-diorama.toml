process_hard = ["tearing", "crumpling", "soaking through", "curling in flame", "ripping", "folding in on itself", "collapsing flat", "scattering", "fraying", "creasing", "blackening at the edges", "blowing away", "falling apart", "sagging wet", "splitting", "shredding", "dissolving", "smouldering", "tumbling", "flattening", "darkening"]
process_soft = ["unfolding", "glowing through", "layering", "fluttering", "folding into a bird", "drifting", "rising", "opening", "casting shadows", "lighting up", "tessellating", "spinning", "floating", "budding", "rustling", "spreading", "unrolling", "framing", "stacking", "peeking through", "blooming"]
