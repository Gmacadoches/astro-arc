[registers]
"botanical" = "Plants as cut leaves and flowers in layers: a forest of cut trees, a garland."
"bodily and anatomical" = "Bodies as silhouettes, graceful, never gore."
"fungal and decaying" = "Decay as torn edges and toadstools of red card."
"animal and creaturely" = "Animals as cut or folded shapes: foxes, cranes, whales."
"geological" = "Rock as layered card mountains and caves."
"metallic and ore" = "Metal as foil: a crown, a weathervane."
"glass and ceramic" = "Glass as vellum and tracing paper: a window, a lantern."
"architectural" = "Buildings as cut-out houses and castles with lit windows."
"domestic interior" = "A cut-paper room with a window open onto layers outside."
"mechanical" = "Machines as paper windmills, waterwheels and clocks."
"industrial and infrastructural" = "Works as bridges, lighthouses and harbours in card."
"agricultural and cultivated" = "Fields as stripes of coloured card, orchards of round trees."
"aquatic" = "Water as layered waves of blue card."
"atmospheric" = "Sky as tissue layers, glowing from behind."
"glacial and frozen" = "Snow as cut snowflakes and white layers."
"fire and ember" = "Fire as orange and red cut flames, glowing."
"textile and fiber" = "Fabric as thread and paper cloth: a tent, a sail."
"ritual object" = "Ritual objects are paper lanterns, charms and folded cranes."
"paper and inscription" = "Paper is everything; letters and maps fold into things, never a sentence."
"instrument and measure" = "Measure as a paper compass, a sundial, a star chart in layers."
