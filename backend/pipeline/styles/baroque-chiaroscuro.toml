[registers]
"botanical" = "Plants as still-life fruit and flowers on a dark table."
"bodily and anatomical" = "Bodies as weighty, naturalistic flesh lit dramatically, never gore."
"fungal and decaying" = "Decay as vanitas: rotting fruit, a skull, a snuffed candle."
"animal and creaturely" = "Animals as dogs, horses, game birds hanging in a kitchen."
"geological" = "Rock as cave and grotto, rough stone in shadow."
"metallic and ore" = "Metal as silver, brass and armour catching the light."
"glass and ceramic" = "Glass as wine glasses and jugs with bright reflections."
"architectural" = "Buildings as churches, palaces and taverns in dramatic interiors."
"domestic interior" = "A kitchen or tavern with a window or door to the outside."
"mechanical" = "Machines as clocks, cannons and ship rigging."
"industrial and infrastructural" = "Works as ports, forges and bridges in smoke."
"agricultural and cultivated" = "Harvest as heaped produce and game."
"aquatic" = "Water as stormy sea and dark harbour."
"atmospheric" = "Sky as storm clouds parted by a beam."
"glacial and frozen" = "Ice as a frozen canal with skaters at dusk."
"fire and ember" = "Fire as candle, hearth and torch, the main light."
"textile and fiber" = "Fabric as velvet, silk and linen in heavy folds."
"ritual object" = "Ritual objects as chalices, crucifixes and reliquaries."
"paper and inscription" = "Paper as letters, ledgers and maps, never a sentence."
"instrument and measure" = "Measure as hourglass, globe and scales."
