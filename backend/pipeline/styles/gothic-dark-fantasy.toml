[registers]
"botanical" = "Plants as thorns, ivy and black roses grown over stone."
"bodily and anatomical" = "Bodies as cloaked figures, gaunt and dignified, never gore."
"fungal and decaying" = "Decay as moss, rot and fungus in old stone."
"animal and creaturely" = "Animals as ravens, wolves, black horses and gargoyles."
"geological" = "Rock as crags, cliffs and caverns."
"metallic and ore" = "Metal as iron gates, armour and bells."
"glass and ceramic" = "Glass as stained windows, broken and lit."
"architectural" = "Buildings as cathedrals, crypts and keeps."
"domestic interior" = "A hall or cell with a hearth and a narrow window."
"mechanical" = "Machines as winches, portcullises and clocks."
"industrial and infrastructural" = "Works as bridges, walls and mills."
"agricultural and cultivated" = "Farming as grim fields and vineyards on slopes."
"aquatic" = "Water as black lakes and storm seas."
"atmospheric" = "Sky as storm and fog with a pale moon."
"glacial and frozen" = "Ice as frozen lakes, snowbound abbeys."
"fire and ember" = "Fire as candles, braziers and pyres."
"textile and fiber" = "Fabric as cloaks, banners and shrouds."
"ritual object" = "Ritual objects as reliquaries, censers and bells."
"paper and inscription" = "Paper as grimoires and scrolls, never a sentence."
"instrument and measure" = "Measure as hourglasses and astrolabes."
