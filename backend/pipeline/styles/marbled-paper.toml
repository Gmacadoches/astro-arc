process_hard = ["muddying", "churning", "tearing", "swallowing", "spiralling in", "bleeding", "clouding", "dissolving", "storming", "smearing", "sinking", "tangling", "breaking apart", "darkening", "flooding", "colliding", "drowning", "splitting", "scattering", "crumbling", "seething"]
