[registers]
"botanical" = "Plants as feathered patterns forming leaves and flowers."
"bodily and anatomical" = "Bodies as flowing silhouettes in the veins, never gore."
"fungal and decaying" = "Decay as muddied colour and broken patterns."
"animal and creaturely" = "Animals as horses, fish and birds formed by currents."
"geological" = "Rock as dense combed bands forming cliffs."
"metallic and ore" = "Metal as gold and bronze veins in the ink."
"glass and ceramic" = "Glass and clay as glazed bowls echoing the marbling."
"architectural" = "Buildings as domes and towers emerging from swirls."
"domestic interior" = "A workshop with a marbling tray and a window to the river."
"mechanical" = "Machines as waterwheels and boats in flow."
"industrial and infrastructural" = "Works as bridges and canals."
"agricultural and cultivated" = "Farming as terraces formed by combed lines."
"aquatic" = "Water is the medium: rivers, seas and currents."
"atmospheric" = "Sky as feathered clouds and swirling winds."
"glacial and frozen" = "Ice as pale crystalline marbling."
"fire and ember" = "Fire as red and gold swirls."
"textile and fiber" = "Fabric as silk flowing with marbled pattern."
"ritual object" = "Ritual objects as lanterns and floating offerings."
"paper and inscription" = "Paper is the world; calligraphy flourishes without legible words."
"instrument and measure" = "Measure as a comb, a stylus and a compass of swirls."
