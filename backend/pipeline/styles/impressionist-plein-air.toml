[registers]
"botanical" = "Plants as masses of dabs: poppies, lilies, willows."
"bodily and anatomical" = "Bodies as loose strokes, at ease, never gore."
"fungal and decaying" = "Decay as autumn leaves and old boats, rich colour."
"animal and creaturely" = "Animals as horses, swans, dogs, quick and alive."
"geological" = "Rock as sea cliffs and quarries in sunlight."
"metallic and ore" = "Metal as iron bridges and station roofs."
"glass and ceramic" = "Glass as station roofs and café windows catching light."
"architectural" = "Buildings as cathedrals, stations and farmhouses in light."
"domestic interior" = "A sunlit room with a window open onto a garden."
"mechanical" = "Machines as steam trains and paddle boats."
"industrial and infrastructural" = "Works as stations, bridges, factory smoke along the river."
"agricultural and cultivated" = "Fields, haystacks and orchards through the seasons."
"aquatic" = "Water as reflective broken colour, the main stage."
"atmospheric" = "Sky as clouds of dabbed colour, fog and haze."
"glacial and frozen" = "Snow as blue and pink shadows on a village."
"fire and ember" = "Fire as gas lamps and a sunset blaze."
"textile and fiber" = "Fabric as white dresses, parasols and laundry in wind."
"ritual object" = "Ritual objects as a village cross, a wreath, a church bell."
"paper and inscription" = "Paper as posters on a kiosk, newspapers, never a sentence."
"instrument and measure" = "Measure as a station clock and a church bell's hours."
