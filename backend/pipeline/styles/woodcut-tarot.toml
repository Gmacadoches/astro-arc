[registers]
"botanical" = "Plants as roses, lilies and wheat in bold cut shapes."
"bodily and anatomical" = "Bodies as stiff symbolic figures, never gore."
"fungal and decaying" = "Decay as a withered tree and a ruined wall."
"animal and creaturely" = "Animals as lions, dogs, wolves, crayfish and horses."
"geological" = "Rock as mountains and crags in carved lines."
"metallic and ore" = "Metal as swords, coins and crowns."
"glass and ceramic" = "Glass and clay as cups and vessels."
"architectural" = "Buildings as towers, castles and pillars."
"domestic interior" = "A throne room with a window onto the land."
"mechanical" = "Machines as wheels and chariots."
"industrial and infrastructural" = "Works as walls, bridges and gates."
"agricultural and cultivated" = "Farming as sowing, reaping and gardens."
"aquatic" = "Water as rivers, pools and seas with ships."
"atmospheric" = "Sky as sun, moon and stars with faces."
"glacial and frozen" = "Snow on a hermit's mountain path."
"fire and ember" = "Fire as lightning, torches and salamanders."
"textile and fiber" = "Fabric as robes, banners and veils."
"ritual object" = "Ritual objects as cups, staves and wands."
"paper and inscription" = "Paper as scrolls and banners, never a sentence."
"instrument and measure" = "Measure as scales, a wheel and an hourglass."
