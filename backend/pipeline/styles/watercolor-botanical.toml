label = "Watercolor Botanical"
suffix = "loose transparent watercolour on cold-press paper, soft wet-in-wet blooms and hard dried edges, visible paper grain and white paper left for highlights, delicate graphite underdrawing showing in places, gentle granulating pigments, figures painted in a few confident washes, main subject kept clear of the top edge"
space = [
  "across a kitchen garden of raised beds to a hedge and an open gate",
  "down a glasshouse aisle toward a misted far wall",
  "along a riverbank meadow to a line of willows",
  "from a potting bench through an open window onto rolling allotments",
  "up a terraced hillside garden to a ridge of wild scrub",
  "through an arch of climbing plants into a walled orchard",
  "over a pond of lily pads to a far boathouse",
]

[world]
era = "A gentle, timeless countryside of gardeners, herbalists and botanical illustrators, where plants are studied, grown and loved, and the most advanced tools are a magnifying glass, a hand pump and a seed drill."
materials = "Leaf, petal, stem and root lead; terracotta, wicker, linen, weathered wood, garden wire, rainwater and seed paper are the common stuff."
physics = "Plants grow faster when watched with care and slower when neglected; seasons can sit side by side in one garden. Nothing glows; light is the white of the paper showing through the washes."
society = "Villages of gardens, seed libraries, market stalls and herbal shops. People garden, swap cuttings, picnic, paint in the field, hold harvest fairs and sit out long evenings."
weather = "The full range: April showers, a heavy summer storm, fog in the hollows, frost on cabbages, a clear morning. Pick what the day calls for."
inhabitants = "Gardeners, children, herbalists, painters with easels, bees, hedgehogs, snails, songbirds and the occasional plant that is a little more aware than it should be."
strangeness = "A plant behaving like a person or a building: a sunflower turning to follow a visitor, a pumpkin grown into a room. Gardeners take it in their stride."
numinous = "The sacred is the old growing thing: a vast ancient tree with offerings tied to it, a seed that holds a whole meadow, the green man's face appearing in foliage."
dread = "On hard days the garden turns: blight blackening the leaves, a hailstorm shredding the beds, a flood carrying off the seedlings, roots cracking a wall. The washes run muddy."
favoured_actors = "Handwork, small groups in relation, animals and insects, and the plants themselves. A lone woman in a sunhat among flowers is the most worn image here and should not be the default."
myth = "European herbal and flower lore, the green man and harvest traditions, and the folk belief that plants listen."
highlight = "The thing the eye finds first is a plant or growing thing shown with a botanist's care that is doing something it should not. Today's kind of wrongness is given with this definition."
highlight_modes = [
  "a plant grown to the size of a building",
  "a plant with a face or a gesture",
  "a specimen shown root, flower and seed at once while still alive",
  "every season present on one branch",
  "a garden structure overtaken and reshaped by growth",
]

[brief]
signature = "SIGNATURE — at least one plant in frame is drawn as a specimen a botanist could identify, with its leaves, flowers or roots described, and it is the highlight or touched by the actor. A scene with only generic greenery is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[light]
lo = "It is evening or night, or a shaded interior. At least two thirds of the frame is in deep blue and violet washes, and the only light is a lamp, a window or moonlight on leaves. A frame that is mostly bright is a failed response."
mid = "The light comes from one side, and lit and shadowed areas are both substantial, shadows painted in cool transparent washes. A frame lit evenly from everywhere is a failed response."
hi = "It is full open daylight and the light is even, with lots of white paper showing. Everything is visible and soft. A frame that is mostly dark or lit by a low sun is a failed response."

