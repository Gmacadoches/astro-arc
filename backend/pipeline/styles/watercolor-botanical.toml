[registers]
"botanical" = "Plants are the heart of this world, drawn as specimens with every vein: a climbing rose with labelled parts, a cut cabbage showing its layers."
"bodily and anatomical" = "The body as gardeners see it: muddy hands, a sunburnt neck. Bodies are tender and at work, never gore."
"fungal and decaying" = "Rot as compost and mushroom: a log furred with brackets, a heap steaming in the cold. Decay feeds the next season."
"animal and creaturely" = "Garden creatures in close-up: a hedgehog under a leaf, a bee half inside a foxglove. Small animals are as carefully drawn as plants."
"geological" = "Stone as garden bones: a dry-stone wall covered in moss, a rockery of alpine flowers. Rock is a place for things to grow."
"metallic and ore" = "Metal as old tools: a rusted watering can, a brass tap on a water butt. Worn, useful and loved."
"glass and ceramic" = "Glass and clay as the glasshouse and the pot: a cloche over a seedling, stacked terracotta. Glass fogs and drips."
"architectural" = "Buildings as garden structures: a greenhouse with flaking paint, a pergola heavy with vines. Built things are half taken over."
"domestic interior" = "A cottage kitchen or herbalist's room: herbs drying from beams, jars on shelves. Always opening onto a garden through a door or window."
"mechanical" = "Simple garden machines: a hand pump, a seed drill. Mechanisms are wood and iron and easy to understand."
"industrial and infrastructural" = "Infrastructure kept gentle: a canal lock in a meadow, a water tower with ivy. Works are rural and slow."
"agricultural and cultivated" = "Cultivation as rows and patterns: an allotment patchwork, an orchard in blossom. The order of planting is as beautiful as the plants."
"aquatic" = "Water as pond, rain and stream: a lily pond with a frog, rain beading on leaves. Water is clear and reflective in washes."
"atmospheric" = "Sky as wet wash: clouds bleeding into blue, a rainbow over a field. Weather is painted in a single breath."
"glacial and frozen" = "Frost as delicate crystal: rimed seed heads, a frozen birdbath. Winter is brittle and white."
"fire and ember" = "Fire as bonfire and stove: a garden bonfire of leaves, a lantern in the shed. Flame is warm and small."
"textile and fiber" = "Fibre as the plant's own and the gardener's: raffia, linen aprons, flax drying. Cloth is undyed and soft."
"ritual object" = "Ritual objects are garden things made sacred: a corn dolly, a carved seed box. Simple and handmade."
"paper and inscription" = "Paper as seed packets, labels and sketchbooks: a plant tag with faded writing, pressed leaves in a book. Writing is a scrawl, never a sentence."
"instrument and measure" = "Measure as the gardener's tools: a rain gauge, a sundial in a bed. Measuring is how you know the season."
