[registers]
"botanical" = "Plants as wheat fields and birch groves in bold shapes."
"bodily and anatomical" = "Bodies as strong stylised workers and cosmonauts, never gore."
"fungal and decaying" = "Decay as rust on old machines, a rotted fence."
"animal and creaturely" = "Animals as space dogs, horses, firebirds."
"geological" = "Rock as steppes, mountains and craters."
"metallic and ore" = "Metal as steel girders and rocket hulls."
"glass and ceramic" = "Glass as helmets and observatory domes."
"architectural" = "Buildings as monuments, towers and factories."
"domestic interior" = "A small flat with a window onto the cosmodrome."
"mechanical" = "Machines as rockets, tractors and satellites."
"industrial and infrastructural" = "Works as dams, factories and launch pads."
"agricultural and cultivated" = "Fields of wheat with tractors in rows."
"aquatic" = "Water as rivers, dams and splashdown seas."
"atmospheric" = "Sky as stars, orbits and rocket trails."
"glacial and frozen" = "Ice as snowy steppes and frozen rivers."
"fire and ember" = "Fire as rocket flame and furnace."
"textile and fiber" = "Fabric as banners, scarves and space suits."
"ritual object" = "Ritual objects as medals, flags and monuments."
"paper and inscription" = "Paper as posters and blueprints, never a sentence."
"instrument and measure" = "Measure as dials, telescopes and orbit diagrams."
