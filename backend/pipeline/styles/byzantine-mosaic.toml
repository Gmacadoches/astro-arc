[registers]
"botanical" = "Plants as vines, palms and trees of life in tesserae."
"bodily and anatomical" = "Bodies as frontal robed figures, never gore."
"fungal and decaying" = "Decay as missing tesserae and cracked plaster."
"animal and creaturely" = "Animals as peacocks, lambs, deer and dolphins."
"geological" = "Rock as stepped mountains in tesserae."
"metallic and ore" = "Metal as gold, bronze doors and crowns."
"glass and ceramic" = "Glass as the tesserae themselves, and lamps."
"architectural" = "Buildings as domes, arches and walled cities."
"domestic interior" = "A villa room with a mosaic floor and a window onto the sea."
"mechanical" = "Machines as water mills, looms and ship oars."
"industrial and infrastructural" = "Works as aqueducts, harbours and walls."
"agricultural and cultivated" = "Farming as vineyards, olive groves and harvests."
"aquatic" = "Water as waves in rows of tesserae with fish."
"atmospheric" = "Sky as gold or starry blue vault."
"glacial and frozen" = "Snow on stepped mountains in white tesserae."
"fire and ember" = "Fire as lamps and a burning city."
"textile and fiber" = "Fabric as silk robes with pearl borders."
"ritual object" = "Ritual objects as chalices, censers and icons."
"paper and inscription" = "Paper as scrolls and codices, never a sentence."
"instrument and measure" = "Measure as the sundial and the zodiac ring."
