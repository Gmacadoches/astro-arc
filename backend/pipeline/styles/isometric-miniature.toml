[registers]
"botanical" = "Plants as round trees and planters on the block."
"bodily and anatomical" = "Bodies as tiny simple figures, never gore."
"fungal and decaying" = "Decay as rusty pipes and mushrooms in the soil layer."
"animal and creaturely" = "Animals as tiny cows, cats and birds."
"geological" = "Rock as the block's base layers seen in section."
"metallic and ore" = "Metal as pipes, rails and machines."
"glass and ceramic" = "Glass as greenhouse roofs and shop windows."
"architectural" = "Buildings as tidy little houses, towers and shops."
"domestic interior" = "Rooms in cut-away with furniture and a window."
"mechanical" = "Machines as cranes, trains and robots."
"industrial and infrastructural" = "Works as pipes, roads and power lines through the block."
"agricultural and cultivated" = "Farms as squares of crops and greenhouses."
"aquatic" = "Water as pools, rivers and harbours cut at the edge."
"atmospheric" = "Sky as a soft gradient behind the block, a small cloud."
"glacial and frozen" = "Ice as a snowy block with a frozen pond."
"fire and ember" = "Fire as a campfire, a forge, a rocket flame."
"textile and fiber" = "Fabric as awnings, tents and flags."
"ritual object" = "Ritual objects as a statue, a bell tower, a shrine."
"paper and inscription" = "Paper as tiny signs and posters, never a sentence."
"instrument and measure" = "Measure as a clock tower, a weather vane, a radar dish."
