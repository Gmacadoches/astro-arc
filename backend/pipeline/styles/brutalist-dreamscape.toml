[registers]
"botanical" = "Plants as moss, ivy and whole trees growing in concrete courts and on terraces high in the air."
"bodily and anatomical" = "Bodies as tiny figures for scale, or vast calm statues built into walls, never gore."
"fungal and decaying" = "Decay as water stains, lichen and spalling on enormous surfaces."
"animal and creaturely" = "Animals as birds in the slots and deer grazing on terraces."
"geological" = "Rock as quarried blocks and concrete laid down like strata."
"metallic and ore" = "Metal as bronze doors and rusted rebar in broken edges."
"glass and ceramic" = "Glass as narrow window slots and skylights in vast roofs."
"architectural" = "Architecture is everything: monoliths, voids, plazas and stairs."
"domestic interior" = "A small warm room in an immense wall, its slot window looking out on the megastructure."
"mechanical" = "Machines as slow lifts and patient maintenance robots."
"industrial and infrastructural" = "Works as dams, reservoirs, sluices and ducts at the scale of valleys."
"agricultural and cultivated" = "Farming as terraced gardens on rooftops and ledges."
"aquatic" = "Water as reflecting pools, flooded atriums and falls from floating blocks."
"atmospheric" = "Sky as pale haze and clouds drifting between towers."
"glacial and frozen" = "Snow on cantilevers and icicles from floating blocks."
"fire and ember" = "Fire as a single lamp or brazier in an immense void."
"textile and fiber" = "Fabric as long banners and awnings moving in a high wind."
"ritual object" = "Ritual objects as a monolith or a single lamp on a vast plaza."
"paper and inscription" = "Paper as library books in a void and kites over a plaza; nothing written is ever legible."
"instrument and measure" = "Measure as level markers, plumb lines and grid lines cast in the concrete."
