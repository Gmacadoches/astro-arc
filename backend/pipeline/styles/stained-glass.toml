[registers]
"botanical" = "Plants as stylised glass leaves and flowers: a vine border, a tree of life."
"bodily and anatomical" = "Bodies as robed figures with painted faces, solemn and calm, never gore."
"fungal and decaying" = "Decay as the darker panes: a withered tree, a ruined wall."
"animal and creaturely" = "Animals from the bestiary: a lion, a pelican, a dove, a dragon."
"geological" = "Rock as mountains of grey and brown panes, a cave, a quarry."
"metallic and ore" = "Metal as gold crowns, swords and chalices."
"glass and ceramic" = "Glass is the world itself: jugs, lamps and windows within the window."
"architectural" = "Buildings as towers, walls and cathedrals in coloured panes."
"domestic interior" = "A hall or room with a hearth and a window, always opening outward."
"mechanical" = "Machines as mills and wheels: a water mill, a cart wheel."
"industrial and infrastructural" = "Works as bridges, walls and harbours, built by guilds."
"agricultural and cultivated" = "Labours of the months: ploughing, sowing, reaping, pressing grapes."
"aquatic" = "Water as wavy blue panes: a river, a sea with fish."
"atmospheric" = "Sky as panes of blue with stars, clouds, sun and moon."
"glacial and frozen" = "Winter as white panes: a frozen river, January by the fire."
"fire and ember" = "Fire as red and gold panes: a forge, a burning bush."
"textile and fiber" = "Fabric as robes in bold folds: a cloak, a banner."
"ritual object" = "Ritual objects are chalices, crosses and relic boxes."
"paper and inscription" = "Paper as scrolls held by figures, lettering as decorative script, never a sentence."
"instrument and measure" = "Measure as the hourglass, the scale and the wheel of the year."
