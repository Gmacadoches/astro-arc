[registers]
"botanical" = "Plants as photograms of ferns and seed heads, pale on blue."
"bodily and anatomical" = "Bodies as pale silhouettes and diagrams, never gore."
"fungal and decaying" = "Decay as rust patterns and lichen photograms."
"animal and creaturely" = "Animals as pale silhouettes: jellyfish, birds, horses."
"geological" = "Rock as strata in section."
"metallic and ore" = "Metal as girders and rivets in fine lines."
"glass and ceramic" = "Glass as lenses and plates, edges glowing white."
"architectural" = "Buildings in plan and elevation."
"domestic interior" = "A drawing office with a window onto a shipyard."
"mechanical" = "Machines in exploded view."
"industrial and infrastructural" = "Works as bridges, dams and lighthouses."
"agricultural and cultivated" = "Farming as plot plans and greenhouses."
"aquatic" = "Water as wave diagrams and harbour charts."
"atmospheric" = "Sky as wind arrows and cloud studies."
"glacial and frozen" = "Ice as crystal diagrams and an icebound ship."
"fire and ember" = "Fire as boiler diagrams and furnace sections."
"textile and fiber" = "Fabric as sails and lace photograms."
"ritual object" = "Ritual objects as foundation stones and medals."
"paper and inscription" = "Paper as the sheet itself, with title blocks, never a sentence."
"instrument and measure" = "Measure as scales, compasses and dimension lines."
