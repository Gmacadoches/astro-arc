[registers]
"botanical" = "Plants as ornament: lilies, irises and poppies curved into borders. Every stem is a line of the design."
"bodily and anatomical" = "The body as long graceful line: flowing hair, a turned shoulder. Serene, never gore."
"fungal and decaying" = "Decay as sinuous rot: a fallen lily browning in curls, lichen on a fountain. Even ruin is decorative."
"animal and creaturely" = "Animals as emblems: a peacock fanning, dragonflies, swans. Each is a pattern as well as a creature."
"geological" = "Stone as carved and polished: a marble fountain, a grotto of shells. Rock is shaped to flow."
"metallic and ore" = "Metal as wrought iron and gilt: a balcony of tendrils, a gilded frame. Metal grows like a plant."
"glass and ceramic" = "Glass and enamel: a stained-glass dragonfly lamp, tiled façades. Colour glows through glass."
"architectural" = "Buildings with curving façades: a metro entrance of iron stems, a theatre front. Architecture breathes."
"domestic interior" = "A salon or studio: curved furniture, a screen of irises. Always opening onto a window or garden."
"mechanical" = "New machines in ornament: a bicycle with floral frame, a gramophone horn like a lily."
"industrial and infrastructural" = "Works dressed beautifully: a railway station of glass and iron, a decorative water tower."
"agricultural and cultivated" = "Harvest as allegory: wheat sheaves around a figure, an orchard in flower. Plenty is a pattern."
"aquatic" = "Water as flowing line: a lake of reflected irises, waves in whiplash curls."
"atmospheric" = "Sky as flat decorative bands: clouds in swirls, a sun as a halo-disc."
"glacial and frozen" = "Winter as allegory: frost patterns as lace, a winter muse in white furs."
"fire and ember" = "Fire as swirling ornament: lamp flames, a hearth of curling tongues."
"textile and fiber" = "Fabric as drapery and silk: a gown flowing into the border, patterned shawls."
"ritual object" = "Ritual objects are emblems: a wreath, a lyre, a chalice wrapped in vines."
"paper and inscription" = "Paper as posters and programmes: a decorative cartouche, flowing lettering, never a sentence."
"instrument and measure" = "Measure as decorative time: an ornate clock, a zodiac wheel in a border."
