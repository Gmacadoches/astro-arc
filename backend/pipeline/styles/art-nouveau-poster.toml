label = "Art Nouveau Poster"
suffix = "Art Nouveau lithograph poster, flowing whiplash curves, bold even outlines, flat areas of muted colour in sage, ochre, rose and cream, ornamental border woven from stems and hair, halo-like circular motif behind the subject, fine decorative patterning, figures drawn with long flowing lines and calm faces, main subject held well below the top edge"
space = [
  "a figure framed by a circular motif with a landscape receding through the arch behind",
  "along a riverside promenade of iron lamps to a bridge",
  "through a glass-roofed arcade opening onto a boulevard",
  "across a garden of curling paths to a pavilion",
  "from a balcony of iron tendrils over rooftops to the sea",
  "down a staircase of curving rails into a lit hall",
  "over a lake rimmed with irises to a far shore of poplars",
]

[world]
era = "The turn of the twentieth century as its poster artists dreamed it: electric light and railways newly arrived, cafés and exhibitions, and every new machine dressed in leaves and flowers."
materials = "Wrought iron in plant shapes, stained glass and enamel lead; carved wood, silk, hair, lily petals, mosaic tile and gilt are the common stuff."
physics = "Lines want to curve: smoke, water, hair and iron all flow into the same whiplash. Electric light and lamps glow; nothing else does. Plants and ornament are the same thing."
society = "Cities of cafés, theatres, world fairs and seaside resorts. People perform, promenade, drink absinthe-free cordials, ride trams, picnic, and attend the openings of new wonders."
weather = "The range given as ornament: rain in long silver strands, wind curling through hair, mist on a lake, snow on iron balconies, a still bright noon. Pick what the day calls for."
inhabitants = "Dancers, actresses, cyclists, bathers, train guards, peacocks, dragonflies, swans, cats and goddesses of the seasons who walk among people."
strangeness = "The decorative made alive: a lamp-post that is also a lily, a woman whose hair becomes the river. Passers-by admire it as design."
numinous = "The sacred is the muse: personified seasons, arts and hours with halo-discs behind their heads, carrying symbols of what they rule."
dread = "On hard days the ornament strangles: vines closing over windows, a glass roof shattered, gaslight failing, a theatre burning, beauty turned to a snare."
favoured_actors = "Figures in relation, crowds at events, animals, and personified presences. A lone woman with flowing hair facing the viewer is the most worn image here and should not be the default."
myth = "Greco-Roman allegory as the Belle Époque used it, Slavic and Celtic folk tales, and the language of flowers."
highlight = "The thing the eye finds first is a figure, creature or object whose outline flows into the ornament around it. Today's kind of wrongness is given with this definition."
highlight_modes = [
  "a person or creature merging into the plant forms around them",
  "a new machine growing like a flower",
  "a personified season or art present in the street",
  "an ornamental motif standing up as a solid structure",
  "a small creature given a halo and a throne",
]

[brief]
signature = "SIGNATURE — at least one element in frame is drawn as ornament as well as thing: hair, smoke, water or iron flowing into a decorative border or circular motif. A plain illustration without ornament is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[light]
lo = "It is night or a dim interior. At least two thirds of the frame is in deep green, indigo and brown flats, lit only by lamps and lit windows. A frame that is mostly bright is a failed response."
mid = "The light comes from one side in warm flats, and light and shade are both substantial areas. A frame lit evenly from everywhere is a failed response."
hi = "It is open day with flat pale colour across the frame; everything is clear and nothing is dramatised by shadow. A frame that is mostly dark is a failed response."

