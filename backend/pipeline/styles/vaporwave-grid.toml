[registers]
"botanical" = "Plants as resort décor: palms in planters, a fern wall in an atrium. Lush, trimmed and slightly too perfect."
"bodily and anatomical" = "The body as a polished statue or a wireframe model: a marble torso, a rotating 3D head. Smooth and clean, never gore."
"fungal and decaying" = "Decay as fading and glitching: sun-bleached posters, tiles lifting from a drained pool. Things rot into pastel."
"animal and creaturely" = "Animals as resort mascots and wild guests: dolphins in a fountain, flamingos on a parking deck. Glossy and tame-looking."
"geological" = "Rock as a theme-park set: polished granite plinths, a faux grotto behind a waterfall. Stone is always finished."
"metallic and ore" = "Metal is chrome: a reflective sphere, polished railings. Every metal surface mirrors the gradient sky."
"glass and ceramic" = "Glass block walls and tiled pools: a translucent wall bending the light, terrazzo floors. Light passes through and wobbles."
"architectural" = "Malls, atriums and resort hotels: stepped terraces, skylights, columns. Architecture as a monument to leisure."
"domestic interior" = "A bedroom or den from the era: a glowing monitor, a waterbed. It always opens to a view through blinds or a window."
"mechanical" = "Consumer machines as relics: a cassette deck, an arcade cabinet. Every machine has a visible button and a glow."
"industrial and infrastructural" = "Infrastructure dressed as leisure: an escalator bank, a parking deck at dusk. Big, clean and quietly empty."
"agricultural and cultivated" = "Cultivation as landscaping: a manicured lawn under sprinklers, a citrus grove on a billboard come true. Grown for looking at."
"aquatic" = "Water as pool, fountain and calm sea: a lit pool at night, a tiled shallows. Water is clear and full of reflected colour."
"atmospheric" = "The sky as gradient: banded clouds, a haze of pink and cyan. Weather is painted on in stripes."
"glacial and frozen" = "Cold as the frozen-dessert counter and the ice rink: a rink under a mirrored dome, frost on a vending window. Ice is pastel and smooth."
"fire and ember" = "Fire as neon heat and sunset glow: a gas fire pit in a lobby, a sun melting into the sea. Flame is pink-orange and clean."
"textile and fiber" = "Fabric as resort and mall fashion: a windbreaker in colour blocks, beach towels with geometric prints. Bright, synthetic and patterned."
"ritual object" = "Ritual objects are consumer goods made sacred: a cassette on an altar, a bust wreathed in plastic leis."
"paper and inscription" = "Paper as signage, receipts and glossy catalogues: a sale banner, a brochure blowing across tile. Lettering is chrome script and never a sentence."
"instrument and measure" = "Measure as the era's displays: a digital clock, a VU meter bouncing. Numbers glow and count."
