label = "Vaporwave Sunset Grid"
suffix = "retro 1980s digital airbrush illustration, glowing magenta and cyan gradients, chrome highlights with hard specular glints, smooth gradient banding, soft bloom around bright edges, faint scanline texture, clean vector-sharp silhouettes, figures drawn as smooth airbrushed shapes with rim light, main subject kept well below the top edge"
space = [
  "across a wireframe plain running in perfect perspective to a banded horizon",
  "down a colonnade of pastel columns opening onto open water",
  "from a mall atrium balcony out over terraced fountains to a skylight",
  "along a coastal highway whose lane markings converge at the horizon",
  "through a doorway of glass bricks into a tiled pool hall and out its far windows",
  "over a checkerboard floor that turns into ocean partway to the horizon",
  "up a stepped pyramid of terraces toward a sky cut into stripes",
]

[world]
era = "A permanent late-1980s that never ended and never got older: shopping malls, home computers, cassette decks and leisure resorts treated as monuments. Technology is glossy, beige or chrome, and loved like classical antiquity."
materials = "Chrome, pastel plastic and polished marble lead; glass block, terrazzo, neon tube, palm trunks, pool tile and sun-faded vinyl are the common stuff. Wireframe grid lines are a material here too, lying on the ground like paving."
physics = "Light comes in bands and gradients; the sun is striped by horizontal gaps. Wireframe can be stood on. Classical statues and computer hardware age the same way, by fading. Nothing is dirty; things decay by losing colour, glitching or tiling."
society = "Malls, resorts, arcades, waterparks and empty office atriums, open day and night. People shop, lounge by pools, play arcade cabinets, drive to the coast with nowhere to be, and hold sunset rites in food courts."
weather = "The whole range in this world's terms: warm haze, a pastel storm with gradient lightning, rain on glass block, a fog of dry ice, a hot clear evening. Pick what the day calls for, not always the sunset."
inhabitants = "Shoppers, lifeguards, mall-walkers, skaters, dolphins and flamingos, marble statues that move when no one looks, screensaver creatures, and helpful mascot robots. People are as often idling as working."
strangeness = "The uncanny of a perfect place: an endless corridor, a statue that has turned its head, an ocean with a floor of tiles. Everyone treats it as ordinary leisure."
numinous = "The sacred is the sun disc and the classical bust: a striped sun that can be approached like a shrine, busts and statues that act as oracles, gods returning as holograms over fountains."
dread = "On hard days the paradise is closing: shutters half down, a power cut leaving one escalator running, a statue cracked through, a flooded food court, the grid tearing open onto black. Bright colour drains toward grey."
favoured_actors = "Crowds at leisure, statues and mascots that have come alive, animals in the pools, small groups in relation. A lone figure staring at the sunset is the most worn image here and should not be the default."
myth = "Greco-Roman myth as gift-shop antiquity, early computing folklore, and the American road-trip and resort dream."
highlight = "The thing the eye finds first is an artefact of the endless 1980s acting out of turn: a statue, a machine, a creature or a structure doing what it should not, lit in gradient. Today's kind of wrongness is given with this definition."
highlight_modes = [
  "a classical statue caught in the middle of an action",
  "a piece of consumer hardware grown to the scale of architecture",
  "a creature rendered half in wireframe",
  "a place that repeats itself one too many times",
  "a sky object brought down to ground level",
]

[brief]
signature = "SIGNATURE — at least one element only this world has is in frame and named: a wireframe grid surface, a striped sun disc, or a classical statue among consumer goods. A scene that could be any retro illustration is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[light]
lo = "It is night or an interior after hours. At least two thirds of the frame is deep violet or black, and the light comes only from neon tube, screens, pool lights or the grid itself. A frame that is mostly bright is a failed response."
mid = "The light is a low warm gradient from one side, magenta into orange, and lit and shadowed areas are both substantial. A frame lit evenly from everywhere is a failed response."
hi = "It is bright pastel daytime with an even haze of light, pale cyan and pink across the frame; everything is visible and shadows are soft. A frame that is mostly dark or lit mainly by neon is a failed response."

