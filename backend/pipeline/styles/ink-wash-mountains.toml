label = "Chinese Ink Wash Mountains"
suffix = "traditional Chinese ink wash landscape painting on silk, expressive black ink brushstrokes from wet and pale to dry and dark, large areas of untouched pale paper as mist, subtle touches of mineral blue-green and ochre, small red seal stamp in a lower corner, figures tiny and suggested with a few strokes, vertical composition feeling, peaks and figures kept below the top edge"
space = [
  "from a riverside pavilion up through layers of mist to towering peaks",
  "along a mountain path winding past waterfalls into cloud",
  "across a wide lake to a far shore of low hills fading out",
  "up a gorge with a boat on the river below and cliffs above",
  "through a bamboo grove onto a terrace overlooking valleys",
  "over a stone bridge toward a temple half hidden in pines",
  "down from a high ridge to a village by a river",
]

[world]
era = "The timeless China of the scholar painters: hermits, scholars, fishermen and monks among mountains, with technology of boats, waterwheels, brushes and bridges."
materials = "Ink, mist and stone lead; pine, bamboo, silk, paper, lacquer, rice straw and water are the common stuff."
physics = "Mist is the world's main substance; mountains appear and vanish in it. Nothing glows except lanterns and the moon. Distance is shown by fading, not by size alone."
society = "Mountain monasteries, riverside villages, scholars' retreats and ferry crossings. People fish, gather herbs, paint, play the zither, drink wine with friends and travel to visit each other."
weather = "Mist, rain on the river, snow on the peaks, wind through pines, a clear autumn moon. Pick what the day calls for."
inhabitants = "Scholars, fishermen, woodcutters, monks, travellers, cranes, monkeys, tigers, dragons in the clouds, and immortals on the peaks."
strangeness = "The immortal and the ordinary share the mountain: a dragon's coil in the clouds, a sage riding a crane. Travellers bow and continue."
numinous = "The sacred is the mountain itself and the Dao in nature: peaks as presences, immortals and dragons as their messengers, a single plum blossom in snow."
dread = "On hard days the mountain is wild: torrents swollen, a landslide across the path, a boat overturned in rapids, a snowstorm closing a pass."
favoured_actors = "Tiny figures in relation, travellers, animals and presences. A lone fisherman in a boat is the most worn image here and should not be the default."
myth = "Daoist immortals and sacred mountains, Chinese dragon lore, and the poetry of recluses."
highlight = "The thing the eye finds first is a presence emerging from the mist, given more ink than anything around it. Today's kind of wrongness is given with this definition."
highlight_modes = [
  "a dragon or immortal half in the clouds",
  "a peak with the shape of a creature or face",
  "a building where no one could build it",
  "a waterfall falling from the sky itself",
  "an animal acting as a messenger",
]

[brief]
signature = "SIGNATURE — at least one third of the frame is empty mist or pale paper, and a mountain or river is in frame. A crowded scene without mist is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[light]
lo = "It is night or a storm: at least two thirds of the frame is dark ink washes, with only a lantern or moon making paper show through. A frame that is mostly pale is a failed response."
mid = "Light comes from one side through mist; one side of each peak is darker ink. A frame with no dark areas is a failed response."
hi = "It is clear day with pale mist everywhere and light ink; nothing is in deep shadow. A frame that is mostly dark is a failed response."

