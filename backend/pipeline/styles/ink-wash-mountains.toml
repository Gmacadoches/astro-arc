[registers]
"botanical" = "Plants as brush exercises: pines, bamboo, plum blossom, lotus, each with its own strokes."
"bodily and anatomical" = "Bodies as tiny robed figures, a few strokes each, calm, never gore."
"fungal and decaying" = "Decay as old trees and lingzhi mushrooms: a gnarled trunk, moss on stone."
"animal and creaturely" = "Animals as symbols and companions: cranes, monkeys, fish, a tiger."
"geological" = "Rock is the heart: peaks, cliffs and boulders built from textured strokes."
"metallic and ore" = "Metal as bronze vessels and bells in temples, quiet and old."
"glass and ceramic" = "Ceramic as tea bowls and celadon jars on a scholar's table."
"architectural" = "Buildings as pavilions, pagodas and bridges set small in nature."
"domestic interior" = "A scholar's studio with brushes and a round window onto the mountain."
"mechanical" = "Machines as waterwheels, mills and boats, simple and wooden."
"industrial and infrastructural" = "Works as plank roads on cliffs, stone bridges, salt pans."
"agricultural and cultivated" = "Terraced fields and tea gardens on slopes, worked by small figures."
"aquatic" = "Water as rivers, falls and lakes, shown by the paper left blank."
"atmospheric" = "Sky as mist and cloud, wet washes and blank paper."
"glacial and frozen" = "Snow on peaks and a frozen river, white paper with dark branches."
"fire and ember" = "Fire as a lantern, a cooking fire, incense smoke, small and warm."
"textile and fiber" = "Fabric as robes and sails, painted in a few flowing lines."
"ritual object" = "Ritual objects are incense burners, scrolls and temple bells."
"paper and inscription" = "Paper as calligraphy and seals: a poem column, a red seal, never a legible sentence."
"instrument and measure" = "Measure as the sundial, the compass and the abacus, old and wooden."
