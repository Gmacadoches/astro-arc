process_soft = ["drifting as mist", "veiling", "flowing", "trickling", "unveiling the peaks", "rising as cloud", "blossoming", "rustling", "settling as snow", "glinting on water", "curling as smoke", "dissolving", "meandering", "echoing", "dripping", "greening", "floating", "parting", "falling softly", "brightening", "fading into distance"]
actor_hard.work = ["poling hard against", "hauling the boat from", "clearing the path of", "shoring up", "chopping through", "bailing"]
