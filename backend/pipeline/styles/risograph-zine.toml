[registers]
"botanical" = "Plants as house plants, park trees and window boxes."
"bodily and anatomical" = "Bodies as chunky friendly figures, never gore."
"fungal and decaying" = "Decay as damp, peeling posters and mushrooms in cracks."
"animal and creaturely" = "Animals as cats, pigeons, frogs and dogs."
"geological" = "Rock as city stone, cliffs at the edge of town."
"metallic and ore" = "Metal as bikes, fire escapes and bins."
"glass and ceramic" = "Glass as shop windows, mugs and bottles."
"architectural" = "Buildings as terraced houses, shops and venues."
"domestic interior" = "A small flat with plants and a window onto the street."
"mechanical" = "Machines as presses, bikes and buses."
"industrial and infrastructural" = "Works as overpasses, bridges and water towers."
"agricultural and cultivated" = "Farming as community gardens and rooftop beds."
"aquatic" = "Water as rain, canals and a public pool."
"atmospheric" = "Sky as flat ink with simple clouds."
"glacial and frozen" = "Snow on rooftops and an icy street."
"fire and ember" = "Fire as a barbecue, a candle, a bin fire."
"textile and fiber" = "Fabric as tote bags, patches and laundry."
"ritual object" = "Ritual objects as candles, shrines of stickers, a mixtape."
"paper and inscription" = "Paper as zines and posters, never a sentence."
"instrument and measure" = "Measure as a bus timetable, a clock, a dial."
