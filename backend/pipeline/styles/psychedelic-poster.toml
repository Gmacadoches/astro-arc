[registers]
"botanical" = "Plants as giant flowers, vines and mushrooms in flowing shapes."
"bodily and anatomical" = "Bodies as flowing figures with streaming hair, never gore."
"fungal and decaying" = "Decay as melting colour and strange mushrooms."
"animal and creaturely" = "Animals as butterflies, peacocks and horses."
