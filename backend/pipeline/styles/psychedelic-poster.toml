label = "1960s Psychedelic Concert Poster"
suffix = "1960s psychedelic concert poster art, vibrating complementary colours of orange against blue and magenta against green, swirling melting organic shapes, bold black outlines, flat screen-printed colour, op-art patterns radiating outward, decorative borders of flowing curves, figures drawn with flowing hair and stylised features, main subject below the top edge, no lettering"
space = [
  "a figure in the centre with swirling patterns radiating to the edges",
  "a sun rising over melting hills",
  "a field of flowers rolling to a rainbow horizon",
  "a cosmic eye opening over a landscape",
  "a road winding to a glowing mountain",
  "waves curling into spirals toward the horizon",
  "a crowd at a festival under a vast sky",
]

[world]
era = "A late-1960s dream of festivals, communes and cosmic consciousness, with technology of guitars, vans, light shows and record players."
materials = "Flowers, paint and flowing fabric lead; beads, guitars, vans, sunlight, mirrors and smoke are the common stuff."
physics = "Shapes melt and flow into each other; colours vibrate; patterns radiate. Suns, eyes and lights glow. Nothing stays still."
society = "Festivals, communes, beaches and concert halls. People dance, play music, garden, paint, travel in vans and gather in circles."
weather = "Rainbows, a storm with spiralling clouds, a blazing sun, a starry night, a warm haze. Pick what the day calls for."
inhabitants = "Musicians, dancers, wanderers, children, butterflies, peacocks, horses, cosmic beings and giant flowers with faces."
strangeness = "Consciousness made visible: a figure whose hair becomes a river, a face in the sun. Everyone grooves along."
numinous = "The sacred is the cosmic eye and the sun: radiating mandalas, a third eye, the universe as a single flower."
dread = "On hard days the trip turns: colours curdling into mud, a storm over the festival, faces melting, patterns closing in."
favoured_actors = "Crowds, figures in relation, animals and presences. A single guitarist on stage is the most worn image here and should not be the default."
myth = "Eastern mysticism as the sixties saw it, Art Nouveau revival, and the counterculture's cosmic tales."
highlight = "The thing the eye finds first is a form that melts or radiates into the patterns around it. Today's kind of wrongness is given with this definition."
highlight_modes = [
  "a figure dissolving into a pattern",
  "a celestial body with a face and eyes",
  "a flower or creature at cosmic scale",
  "a landscape bending like liquid",
  "a mandala opening in the sky",
]

[brief]
signature = "SIGNATURE — at least one pair of vibrating complementary colours is named, and swirling or radiating pattern is in frame. A calm realistic scene is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[light]
lo = "It is night: two thirds of the frame is deep purple and black, lit by light show colours and stars. A frame that is mostly bright is a failed response."
mid = "Colour radiates from one point, bright near it and darker toward the edges. A frame with no centre of light is a failed response."
hi = "Full blazing colour across the whole poster. A frame that is mostly dark is a failed response."

