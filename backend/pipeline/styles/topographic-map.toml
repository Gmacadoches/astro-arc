[registers]
"botanical" = "Plants as stippled forest and grassland symbols."
"bodily and anatomical" = "Bodies as tiny traveller symbols, or a giant figure formed by terrain, never gore."
"fungal and decaying" = "Decay as marsh symbols and eroded slopes."
"animal and creaturely" = "Animals as migration paths and whales in the deep."
"geological" = "Rock is the heart: peaks, ridges and faults."
"metallic and ore" = "Metal as mine symbols and ore veins."
"glass and ceramic" = "Glass as lakes drawn like lenses."
"architectural" = "Buildings as town blocks and summit huts."
"domestic interior" = "A map room with a window onto the terrain."
"mechanical" = "Machines as railway lines and dams."
"industrial and infrastructural" = "Works as roads, tunnels and bridges."
"agricultural and cultivated" = "Farming as field patterns in valleys."
"aquatic" = "Water as rivers, lakes and bathymetric lines."
"atmospheric" = "Sky as weather overlays and isobars."
"glacial and frozen" = "Ice as glaciers and white peaks."
"fire and ember" = "Fire as volcano symbols and lava flows."
"textile and fiber" = "Fibre as trails like threads across the map."
"ritual object" = "Ritual objects as cairns and summit markers."
"paper and inscription" = "Paper as the map itself, cartouches without legible words."
"instrument and measure" = "Measure as grid lines, compass roses and scale bars."
