[registers]
"botanical" = "Plants as stitched flowers, vines and the tree of life."
"bodily and anatomical" = "Bodies as simple folk figures, never gore."
"fungal and decaying" = "Decay as mushrooms in the forest and frayed threads."
"animal and creaturely" = "Animals as roosters, storks, horses, bears and wolves."
"geological" = "Rock as hills and mountains in stitched rows."
"metallic and ore" = "Metal as horseshoes, bells and iron stoves."
"glass and ceramic" = "Clay as painted pottery and jugs."
"architectural" = "Buildings as wooden houses, churches and mills."
"domestic interior" = "A cottage room with a stove and a window onto the village."
"mechanical" = "Machines as spinning wheels, mills and looms."
"industrial and infrastructural" = "Works as bridges, wells and mills."
"agricultural and cultivated" = "Farming as fields, sheaves and orchards."
"aquatic" = "Water as rivers and lakes of blue stitches."
"atmospheric" = "Sky as stitched sun, moon, stars and clouds."
"glacial and frozen" = "Snow as white knots on roofs."
"fire and ember" = "Fire as a stove, a bonfire, a firebird."
"textile and fiber" = "Fabric is everything: shawls, aprons and banners."
"ritual object" = "Ritual objects as painted eggs, wreaths and candles."
"paper and inscription" = "Paper as stitched borders and samplers, never a sentence."
"instrument and measure" = "Measure as a spinning wheel's count and a church clock."
