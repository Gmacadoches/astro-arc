label = "Embroidered Folk Tapestry"
suffix = "hand embroidery on natural linen photographed flat, visible satin stitch, chain stitch and French knots in wool and cotton threads, raised textured stitching catching soft light, folk palette of madder red, indigo, mustard and leaf green on unbleached linen, figures stitched as simple flat folk shapes, main subject below the top edge"
space = [
  "a village of stitched houses on a hill with fields below",
  "a river of blue stitches winding to a mill",
  "a forest of stitched trees around a clearing",
  "a road of running stitches to a church on a far hill",
  "a lake with boats under a stitched sky",
  "a garden of flowers around a cottage",
  "a mountain pass with a caravan crossing",
]

[world]
era = "A folk countryside from Eastern Europe to Scandinavia: villages, farms, fairs and forests, with technology of spinning wheels, mills and horse carts."
materials = "Linen, wool thread and wood lead; straw, clay, painted eggs, leather, beeswax and iron are the common stuff."
physics = "Everything is made of stitches; patterns repeat. Nothing glows except candles and the stitched sun. Plants and birds are symbols of luck."
society = "Villages of fairs, weddings, harvests and markets. People spin, plant, herd, dance, marry, sing and gather around stoves."
weather = "Stitched weather: rain in blue dashes, snow in white knots, a red sun, wind as curls, a calm day. Pick what the day calls for."
inhabitants = "Villagers, shepherds, brides, musicians, roosters, storks, horses, wolves, bears and forest spirits."
strangeness = "The folk tale come true: a bear dancing at a wedding, a firebird on the roof. Villagers nod."
numinous = "The sacred is the tree of life and the firebird: a great stitched tree with birds, a sun with rays, a bird of fire."
dread = "On hard days the tale turns dark: wolves at the edge of the village, a fire at the mill, a flood across fields, a winter that will not end."
favoured_actors = "Crowds at fairs, figures in relation, animals and presences. A girl in a red headscarf alone is the most worn image here and should not be the default."
myth = "Slavic and Nordic folk tales, the tree of life, and the firebird legends."
highlight = "The thing the eye finds first is a folk creature or symbol living in the village. Today's kind of wrongness is given with this definition."
highlight_modes = [
  "a bird far larger than a house",
  "the tree of life growing through a building",
  "an animal at a human celebration",
  "a forest spirit at the edge of a field",
  "a sun or moon walking the road",
]

[brief]
signature = "SIGNATURE — the stitches are named: at least one element is described with a stitch type and thread. A scene that could be a painting is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[light]
lo = "It is night: two thirds of the linen is stitched in dark indigo and black, lit only by stitched candles or moon. A frame that is mostly bright is a failed response."
mid = "Light from one side, stitched shading on one side of things. A frame lit evenly is a failed response."
hi = "Bright day, the linen pale and every stitch visible. A frame that is mostly dark is a failed response."

