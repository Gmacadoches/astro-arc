[registers]
"botanical" = "Plants as kelp, sea grass and anemone gardens."
"bodily and anatomical" = "Bodies as merfolk and divers in flowing woven shapes, never gore."
"fungal and decaying" = "Decay as bleached coral and rotting wrecks."
"animal and creaturely" = "Creatures as fish, turtles, octopuses and whales."
"geological" = "Rock as reef walls, sea caves and volcanic vents."
"metallic and ore" = "Metal as bronze diving helmets and sunken anchors."
"glass and ceramic" = "Glass as sea glass and diving bells."
"architectural" = "Buildings as coral towers and wreck homes."
"domestic interior" = "A shell home with a round window onto the reef."
"mechanical" = "Machines as diving bells and pulley nets."
"industrial and infrastructural" = "Works as kelp farms, pearl beds and wreck docks."
"agricultural and cultivated" = "Farming as kelp rows and oyster beds."
"aquatic" = "Water is everywhere: currents, shafts and bubbles."
"atmospheric" = "Sky as the bright surface above, rippling."
"glacial and frozen" = "Ice as polar waters with icebergs above."
"fire and ember" = "Fire as volcanic vents glowing on the seabed."
"textile and fiber" = "Fabric as woven nets and kelp cloth."
"ritual object" = "Ritual objects as pearls, shells and carved coral."
"paper and inscription" = "Paper as a sunken chart or bottle message, never a sentence."
"instrument and measure" = "Measure as tide markers and a brass depth gauge."
