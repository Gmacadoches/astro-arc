[registers]
"botanical" = "Plants glow pink and white: meadows, orchards and forests."
"bodily and anatomical" = "Bodies with pale glowing skin, natural, never gore."
"fungal and decaying" = "Decay as dead grey trees among glowing ones."
"animal and creaturely" = "Animals as horses, swans and deer in luminous fields."
"geological" = "Rock as dark cliffs and pale boulders."
