label = "Infrared Film Photography"
suffix = "false-colour infrared film photograph, foliage glowing pink, magenta and white, skies deep dark teal or near-black, water black and glassy, soft halation glow around bright edges, fine film grain, slightly dreamlike contrast, figures photographed naturally with pale luminous skin, main subject below the top edge"
space = [
  "across a meadow of glowing pink grass to a line of white trees",
  "down a tree-lined avenue toward a house",
  "over a dark lake to a forested far shore",
  "along a river through glowing willows",
  "up a hillside of pale foliage toward a ridge",
  "through a garden gate into a glowing orchard",
  "from a bridge across a valley of pink forest",
]

[world]
era = "Our own present world seen through infrared film, where ordinary places become alien and luminous: parks, farms, lakes, towns and roads."
materials = "Foliage, water and sky lead; stone, wood, asphalt, cloth, glass and metal are the common stuff, all shifted in colour."
physics = "Living plants glow pink and white; water and sky go dark. Heat glows faintly. Nothing else changes, which is what makes it uncanny."
society = "Towns, parks, farms and lakeshores. People walk dogs, swim, picnic, farm, commute and gather at fairs."
weather = "Bright sun making leaves blaze, overcast flattening the glow, mist, rain darkening everything, a hot still day. Pick what the day calls for."
inhabitants = "Ordinary people, dogs, horses, cows, swans, deer and an occasional figure that seems not quite of this world."
strangeness = "The familiar made alien: a pink forest, a black lake reflecting white trees, people in a field that seems on another planet. No one notices."
numinous = "The sacred is the glowing tree and the black water: an old tree blazing white, a still lake like a mirror into another place."
dread = "On hard days the uncanny becomes threatening: dead trees standing grey among pink, a storm turning the sky black, flood water spreading dark."
favoured_actors = "Figures in relation, animals, crowds and presences. A lone figure standing in a field is the most worn image here and should not be the default."
myth = "Otherworld myths of hidden lands, faerie and the green world, and modern folklore of liminal places."
highlight = "The thing the eye finds first is a living thing glowing more than anything around it. Today's kind of wrongness is given with this definition."
highlight_modes = [
  "a tree or plant blazing almost white",
  "an animal glowing like it is lit from within",
  "a reflection showing something different from the shore",
  "a human-made object overgrown with glowing foliage",
  "a path leading into an impossible pink distance",
]

[brief]
signature = "SIGNATURE — foliage in frame is described as glowing pink or white, and the sky or water is dark. A normally coloured scene is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[light]
lo = "It is dusk or deep shade: two thirds of the frame is near-black, with only pale glowing foliage and one light. A frame that is mostly bright is a failed response."
mid = "Sunlight from one side making some foliage blaze white, the rest in shadow. A frame lit evenly is a failed response."
hi = "Bright full sun, foliage glowing everywhere, sky dark teal. A frame that is mostly dark is a failed response."

