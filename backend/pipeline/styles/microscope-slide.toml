label = "Microscope Slide"
suffix = "scientific light-microscope photomicrograph, glowing translucent forms on a dark-field black background, iridescent polarised-light colours of violet, cyan, gold and magenta, razor-thin focal plane with soft out-of-focus layers, fine crystalline edges and delicate cell walls, figures tiny and translucent like microorganisms, circular vignette at the edges, main subject below the top edge"
space = [
  "through a drop of water from a near diatom to faint shapes deep in focus",
  "across a crystal field to a far fracture line",
  "along a plant stem cut in section into its chambers",
  "down a branching tube of cells to a bright opening",
  "over a colony of cells to a dividing pair",
  "into a pollen grain landscape of spines and pores",
  "across a frost crystal from its centre to its branching tips",
]

[world]
era = "The hidden world under the microscope, imagined as a living civilisation at the scale of a single drop: diatom cities, crystal palaces and tiny travellers."
materials = "Silica glass shells, crystal and cell membrane lead; water, pollen, spores, salt, chlorophyll and slime are the common stuff."
physics = "Everything is translucent and lit from below or the side; colours come from polarised light. Bioluminescent things and crystals glow. Things divide, bud and crystallise."
society = "Colonies, crystal cities, drifting rafts of algae. Tiny beings build, feed, migrate, gather in blooms and rest on surfaces."
weather = "Weather as the drop's conditions: a current sweeping through, evaporation leaving salt crystals, a cold snap freezing everything, warm stillness. Pick what the day calls for."
inhabitants = "Diatoms, rotifers, tardigrades, amoebae, paramecia, algae, spores and tiny glassy beings who live among them."
strangeness = "The microscopic as monumental: a tardigrade as large as a whale, a diatom shaped like a cathedral. Neighbours drift past."
numinous = "The sacred is perfect symmetry: a radiolarian like a glass temple, a snowflake as a mandala, a cell dividing as the beginning of all things."
dread = "On hard days the drop goes wrong: a membrane bursting, crystals shattering, a predator engulfing, the water drying to cracked salt."
favoured_actors = "Swarms and colonies, creatures, presences and automata-like diatoms. A single cell alone is the most worn image here and should not be the default."
myth = "Natural history's wonder at the invisible, creation myths of the primordial sea, and the sacred geometry tradition."
highlight = "The thing the eye finds first is a microscopic form shown at monumental scale doing something strange. Today's kind of wrongness is given with this definition."
highlight_modes = [
  "a tiny creature at the scale of architecture",
  "a crystal grown into a palace",
  "a cell dividing into something it should not",
  "a diatom shell shaped like a made object",
  "a perfect symmetry broken in one place",
]

[brief]
signature = "SIGNATURE — at least one translucent microscopic form (a diatom, a crystal, a cell or a tardigrade) is in frame and lit from within or behind. An opaque, daylit scene is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[light]
lo = "Dark field: two thirds of the frame is black, with only the forms glowing at their edges. A frame that is mostly bright is a failed response."
mid = "Polarised light from one side, colours strong on one side of each form and dark on the other. A frame with no shadowed areas is a failed response."
hi = "Bright field: a pale luminous background with forms visible everywhere. A frame that is mostly dark is a failed response."

