[registers]
"botanical" = "Plants as algae, pollen and plant cells in section."
"bodily and anatomical" = "Bodies as cells and tissues, glowing and calm, never gore."
"fungal and decaying" = "Decay as spores and hyphae threading through."
"animal and creaturely" = "Creatures as tardigrades, rotifers and paramecia."
"geological" = "Rock as mineral crystals in thin section."
"metallic and ore" = "Metal as crystalline ore and iridescent flakes."
"glass and ceramic" = "Glass as diatom shells and silica forms."
"architectural" = "Buildings as radiolarian temples and diatom cities."
"domestic interior" = "A cell's interior with a window of membrane onto the drop."
"mechanical" = "Machines as cilia, flagella and rotating structures."
"industrial and infrastructural" = "Works as networks of tubes and channels."
"agricultural and cultivated" = "Farming as algae blooms and colonies."
"aquatic" = "Water as the drop itself, full of particles."
"atmospheric" = "Sky as the glowing field and out-of-focus layers."
"glacial and frozen" = "Ice as frost and snowflake crystals."
"fire and ember" = "Fire as glowing heated crystals."
"textile and fiber" = "Fibre as cellulose strands and silk under magnification."
"ritual object" = "Ritual objects as perfect symmetrical shells."
"paper and inscription" = "Paper fibres magnified, with tiny specimen labels, never a sentence."
"instrument and measure" = "Measure as a scale bar and a graticule overlay."
