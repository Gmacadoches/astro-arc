[registers]
"botanical" = "Plants as stylised shapes: a cactus, a rubber plant, a lollipop tree."
"bodily and anatomical" = "Bodies as simple stylised figures, cheerful, never gore."
"fungal and decaying" = "Decay as peeling paint and rust, a wilting houseplant."
"animal and creaturely" = "Animals as graphic shapes: a cat, a poodle, a flamingo."
"geological" = "Rock as mesas and canyons in flat colour."
"metallic and ore" = "Metal as chrome trim and steel: a car fender, a toaster."
"glass and ceramic" = "Glass and ceramic as picture windows and studio pottery."
"architectural" = "Buildings as modernist homes, motels, airports and diners."
"domestic interior" = "A modern lounge with a sunken sofa and a picture window onto the yard."
"mechanical" = "Machines as space-age appliances and robots."
"industrial and infrastructural" = "Works as highways, dams and launch pads."
"agricultural and cultivated" = "Farming as orchards and suburban lawns."
"aquatic" = "Water as a kidney-shaped pool, a lake with a speedboat."
"atmospheric" = "Sky as flat colour with stylised clouds and stars."
"glacial and frozen" = "Snow as a ski lodge, a fridge full of ice cubes."
"fire and ember" = "Fire as a barbecue, a fireplace, a rocket's exhaust."
"textile and fiber" = "Fabric as patterned curtains and shirts with atomic prints."
"ritual object" = "Ritual objects are trophies, a ribbon-cutting scissors, a time capsule."
"paper and inscription" = "Paper as posters, tickets and signs, lettering in script, never a sentence."
"instrument and measure" = "Measure as dials, gauges, a radar screen and a Geiger counter."
