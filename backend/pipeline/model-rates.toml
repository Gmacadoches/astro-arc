# The five offered by default, before "Show all". Chosen to span the real cost
# range rather than to be uniformly good — the point of the shortlist is that
# picking blind from it cannot go badly wrong. Everything else stays one click
# away. Edit freely; this is a taste judgement, not a fact.
[shortlist]
chat = ["gpt-4o-mini", "gpt-4.1-mini", "gpt-4.1", "gpt-5-mini", "gpt-5.4"]
image = ["gpt-image-1-mini", "gpt-image-1", "gpt-image-1.5", "gpt-image-2", "gpt-image-2.5-flare"]

# Named quality tiers, in the spirit of a game's graphics presets: one choice
# that sets every model at once, with the individual pickers still free to
# override (which shows the preset as "Custom"). Both chat stages get the same
# model deliberately — Stage 1's reading is the raw material everything
# downstream is built from, so starving it to save a fraction of a cent would
# cap what Stage 2 has to work with.
#
# Tiers are CURATED, not computed: most models have no measured render yet, so
# there is nothing to sort them by. Retune these freely — that is the point of
# them living in a hand-edited file.
[presets.low]
label = "Low"
chat = "gpt-4o-mini"
image = "gpt-image-1-mini"
quality = "low"

[presets.medium]
label = "Medium"
chat = "gpt-4.1-mini"
image = "gpt-image-1-mini"
quality = "medium"

[presets.high]
label = "High"
chat = "gpt-4.1"
image = "gpt-image-1-mini"
quality = "high"

[presets.ultra]
label = "Ultra"
chat = "gpt-5.4"
image = "gpt-image-1.5"
quality = "high"

[presets.maximum]
label = "Maximum"
chat = "gpt-6-astra"
image = "gpt-image-2.5-sunburst"
quality = "auto"
