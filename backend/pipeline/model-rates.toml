# Hand-maintained per-token prices, in US dollars per 1,000,000 tokens.
#
# THIS FILE EXISTS SO YOU DON'T HAVE TO EDIT PYTHON TO TRY A NEW MODEL.
# Read fresh on every run, exactly like registers.toml / styles.toml /
# cliches.toml — add a row here and the next generation (and the widget's
# dropdowns) pick it up with no restart and no code change.
#
# WHY THIS IS HAND-MAINTAINED AND CANNOT BE AUTOMATED
# OpenAI's API will tell you which models your key can reach (GET /v1/models,
# which is what the widget's "Refresh" button calls) but it will NOT tell you
# what they cost. There is no pricing endpoint on a normal key — the Admin-API
# route was removed from this project on 2026-09-06 precisely because regular
# users don't have that key. So: availability is discovered, price is typed in
# by a human, from https://platform.openai.com/docs/pricing.
#
# A model missing from this file is still selectable and still runs. It simply
# reports "cost unknown" rather than a fabricated number, per this project's
# standing rule that cost figures are real token counts at a known rate or
# nothing at all. Two numbers here turn that into a real measured cost.
#
# HOW TO ADD ONE
# Look the model up on the pricing page and copy its input and output prices.
# Both are "per 1M tokens". The label is what the widget's dropdown shows.
#
#   "some-new-model" = { label = "Some New Model", input = 1.25, output = 10.00 }
#
# Rates below were transcribed from developers.openai.com/api/docs/pricing on
# 2026-09-12. They are published numbers, not guesses — but they DO go stale, and
# nothing in this project can detect that, because the API never reports a price.
# Re-check before trusting any of them for real budgeting.
#
# A model your key can reach that is absent here is still selectable and still
# runs; it reports "cost unknown". That is the correct behavior — an invented
# rate is worse than an honest blank, because it silently produces a confident
# wrong total.

[chat]
"gpt-3.5-turbo"           = { label = "gpt-3.5-turbo", input = 0.50, output = 1.50 }
"gpt-4.1"                 = { label = "GPT-4.1", input = 2.00, output = 8.00 }
