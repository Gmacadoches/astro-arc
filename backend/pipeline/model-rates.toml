"gpt-4o-mini"             = { label = "GPT-4o mini", input = 0.15, output = 0.60 }
"gpt-5"                   = { label = "GPT-5", input = 1.25, output = 10.00 }
"gpt-5-mini"              = { label = "GPT-5 mini", input = 0.25, output = 2.00 }
"gpt-5-nano"              = { label = "GPT-5 nano", input = 0.05, output = 0.40 }
"gpt-5-pro"               = { label = "gpt-5-pro", input = 15.00, output = 120.00 }
