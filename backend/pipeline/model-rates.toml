]
chat = [
  "gpt-6-astra",
  "gpt-5.6-sol",
  "gpt-5.5",
  "gpt-5.4",
  "gpt-5.6-terra",
  "gpt-5.2",
  "gpt-5.1",
  "gpt-4.1",
  "gpt-5.4-mini",
  "gpt-4o",
  "gpt-5-mini",
  "gpt-5.6-luna",
  "gpt-4.1-mini",
  "gpt-4o-mini",
  "gpt-5.4-nano",
