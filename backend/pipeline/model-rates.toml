# Image models publish THREE rates, and which one applies depends on what you
# send. This pipeline sends a text prompt and receives image tokens back — the
# real usage reads input_tokens_details.text_tokens and
# output_tokens_details.image_tokens — so `input` here is the TEXT-input rate and
# `output` is the image-output rate. `image_input` is recorded for completeness
# and would only apply to an image-to-image edit, which this project never does.
#
# Correction 2026-09-12: gpt-image-1-mini was previously priced at input = 2.50,
# which is its IMAGE-input rate. The text-input rate is 2.00. Every cost this
# project has reported for an image render was therefore slightly overstated —
# by about 1.5% of the total, since input tokens are a small share of an image
# call. Note also that a "cost" in image-cost-*.json marked costSource "actual"
# means real token counts priced with THIS table, not dollars billed by OpenAI:
# the API never returns a dollar figure, so no number here is independently
# confirmed against a bill.
[image]
"chatgpt-image-latest"    = { label = "ChatGPT Image (latest)", input = 5.00, image_input = 8.00, output = 32.00 }
"gpt-image-1"             = { label = "GPT Image 1", input = 5.00, image_input = 10.00, output = 40.00 }
"gpt-image-1-mini"        = { label = "GPT Image 1 Mini", input = 2.00, image_input = 2.50, output = 8.00 }
"gpt-image-1.5"           = { label = "GPT Image 1.5", input = 5.00, image_input = 8.00, output = 32.00 }
"gpt-image-2"             = { label = "GPT Image 2", input = 5.00, image_input = 8.00, output = 30.00 }
"gpt-image-2.5-flare"     = { label = "GPT Image 2.5 Flare", input = 5.00, image_input = 8.00, output = 30.00 }
"gpt-image-2.5-sunburst"  = { label = "GPT Image 2.5 Sunburst", input = 5.00, image_input = 8.00, output = 30.00 }

[image_qualities]
# Probed against the live API on 2026-09-12: every image model this key can
# reach accepts all four. The previous table restricted gpt-image-2 and the 2.5
# models to "auto", which was inherited from an assumption in the render code
# rather than from anything the API says — it meant gpt-image-2 could never be
# run at "low", i.e. the most expensive model was locked to its most expensive
# setting. Re-probe with a deliberately invalid value (which costs nothing) if a
# new model behaves differently; the error enumerates what it accepts.
"gpt-image-1"            = ["low", "medium", "high", "auto"]
"gpt-image-1-mini"       = ["low", "medium", "high", "auto"]
"gpt-image-1.5"          = ["low", "medium", "high", "auto"]
"gpt-image-2"            = ["low", "medium", "high", "auto"]
"gpt-image-2.5-flare"    = ["low", "medium", "high", "auto"]
"gpt-image-2.5-sunburst" = ["low", "medium", "high", "auto"]
"chatgpt-image-latest"   = ["low", "medium", "high", "auto"]

[hierarchy]
# Reordered 2026-09-12 from MEASURED results, not version numbers. The previous
# order put gpt-image-1.5 above gpt-image-2.5-*, which made Ultra both pricier
# and worse than Maximum. Rendering one fixed prompt across six model/tier
# combinations (verification/bakeoff-tiers) gave, for the SAME scene:
#
#   gpt-image-2.5-sunburst low     158 tok   $0.0057   best of the set
#   gpt-image-1-mini       medium 1568 tok   $0.0129   crude, flat
#   gpt-image-2            auto    601 tok   $0.0190   beautiful, ignored "dim room"
#   gpt-image-2.5-sunburst high   1372 tok   $0.0421   merged two objects into one
#   gpt-image-1.5          high   6701 tok   $0.2154   flat, dithered, ignored "dim room"
#   gpt-image-1.5          auto   6735 tok   $0.2165   auto buys NOTHING on 1.5
#
# Two things that order does not show. `auto` is not a cost saving on every
# model: on gpt-image-1.5 it spends the same as `high`, while on 2.5 it lands
# between low and high and varies per prompt (343 and 601 tokens on two runs of
# the same model). And more tokens is not more quality — 2.5 at `low` followed
# the prompt more faithfully than 2.5 at `high`, which merged the divination cup
# and the bronze liver into a single vessel.
image = [
  "gpt-image-2.5-sunburst",
  "gpt-image-2.5-flare",
  "gpt-image-2",
  "gpt-image-1.5",
  "gpt-image-1",
  "gpt-image-1-mini",
]
chat = [
  "gpt-6-astra",
  "gpt-5.6-sol",
  "gpt-5.5",
  "gpt-5.4",
  "gpt-5.6-terra",
  "gpt-5.2",
  "gpt-5.1",
  "gpt-4.1",
  "gpt-5.4-mini",
  "gpt-4o",
  "gpt-5-mini",
  "gpt-5.6-luna",
  "gpt-4.1-mini",
  "gpt-4o-mini",
  "gpt-5.4-nano",
  "gpt-4.1-nano",
  "gpt-5-nano",
]

# The five offered by default, before "Show all". Chosen to span the real cost
# range rather than to be uniformly good — the point of the shortlist is that
# picking blind from it cannot go badly wrong. Everything else stays one click
# away. Edit freely; this is a taste judgement, not a fact.
[shortlist]
chat = ["gpt-4o-mini", "gpt-4.1-mini", "gpt-4.1", "gpt-5.4", "gpt-6-astra"]
image = ["gpt-image-2.5-sunburst", "gpt-image-2.5-flare", "gpt-image-2", "gpt-image-1-mini", "gpt-image-1.5"]

# Named quality tiers, in the spirit of a game's graphics presets: one choice
# that sets every model at once, with the individual pickers still free to
# override (which shows the preset as "Custom"). Both chat stages get the same
# model deliberately — Stage 1's reading is the raw material everything
# downstream is built from.
#
# REBUILT 2026-09-12 from the bakeoff above, and the honest summary is this:
# above roughly $0.05 a run, nothing in the test got measurably better. The one
# change that mattered was using a CURRENT image model; gpt-image-2.5 at its
# cheapest tier beat gpt-image-1.5 at its most expensive by a wide margin at
# 1/38th the price. The upper tiers therefore exist to spend more on the chat
# side, where the effect is real but small (both gpt-5.4 and gpt-6-astra wrote
# prompts of 74-76 words of comparable quality), not because the image improves.
# If you want the best value, High is the honest recommendation and Low is a
# genuinely good image.
[presets.low]
label = "Low"
chat = "gpt-4o-mini"
image = "gpt-image-2.5-sunburst"
quality = "low"

[presets.medium]
label = "Medium"
chat = "gpt-4.1-mini"
image = "gpt-image-2.5-sunburst"
quality = "low"

[presets.high]
label = "High"
chat = "gpt-4.1"
image = "gpt-image-2.5-sunburst"
quality = "auto"

[presets.ultra]
label = "Ultra"
chat = "gpt-5.4"
image = "gpt-image-2.5-sunburst"
quality = "high"

[presets.maximum]
label = "Maximum"
chat = "gpt-6-astra"
image = "gpt-image-2.5-flare"
quality = "high"
