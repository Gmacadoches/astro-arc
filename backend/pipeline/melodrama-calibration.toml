# Calibration set for the melodrama caption check (llm_pipeline.caption_check).
#
# The rule the check enforces: an image may show FORCE but not MOTIVE. A scene
# filed under an activity passes; one filed under a feeling, a reason, or a
# side to take, fails. Physical struggle is explicitly allowed — war and a
# deadly wrestle are native to the archetypal material — so an emotion-only
# word list is not enough.
#
# More prose will not settle where that line falls. Labelled examples will.
#
# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
#
# Set `label` on every scene to one of: "pass", "fail", "unsure".
#   pass    -> this image is fine; the check must not flag it
#   fail    -> this is melodrama; the check must catch it
#   unsure  -> you cannot decide, which is the most useful answer of the three,
#              because it marks where the line actually is rather than where
#              it was guessed to be
#
# `machine` is what the check currently says, recorded 2026-09-20 so
# disagreements are visible. Do not edit it — it is the thing being calibrated.
# Where `label` and `machine` disagree, the word lists are wrong, not you.
#
# Five kinds of scene are on the line by construction and are marked
# `borderline = true`: a rescue, a victor over a vanquished figure, a fight
# with onlookers, an animal against a person, and mass battle. They are the
# reason this file exists.
# ---------------------------------------------------------------------------

[[scene]]
