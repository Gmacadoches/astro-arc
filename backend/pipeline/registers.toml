# Every register, and everything the pipeline needs to know about one, in this
# one file. Read fresh on every run — edit and the next generation uses it, no
# restart, no code change.
#
# A register is WHAT THE SCENE IS MADE OF. Stage 1.5 supplies the objects that
# are IN the scene; the register supplies the setting and the substance they
# are built from. Each image gets a primary register and usually a secondary,
# and the day's chart decides whether the pair collides or coheres.
#
# These are NAMES, not vocabularies, and that is deliberate — see the note at
# the end of this file.
#
# ---------------------------------------------------------------------------
# HOW TO EDIT
#
#   Add a register  -> add its name under the family it is made of. That is
#                      all. Family membership and the rotation both follow
#                      from where you put it.
#   Remove one      -> delete the line. Anything in history that used it still
#                      reads back fine.
#   Rename one      -> treat it as remove + add; the rotation's recency scan
#                      keys on the exact string.
#
# Until 2026-09-13 this took THREE edits in two files — the name here, a
# family in llm_pipeline.py's REGISTER_FAMILIES, and membership of
# PEOPLE_REGISTERS — and missing either of the last two failed silently.
# PEOPLE_REGISTERS is gone as of 2026-09-20; see below.
# ---------------------------------------------------------------------------
#
# FAMILIES are what "cohere" and "collide" are measured against. A secondary
# register from the SAME family makes one continuous material world; from a
# different one, the friction between two materials is part of the picture.
# Group by what a thing is actually made of, not by mood.
#
# There are no special cases left. Until 2026-09-20 there was one: a `human`
# family whose members were the registers that put PEOPLE in the image, gated
# on the primary alone and never eligible as a secondary. That conflated two
# unrelated axes — what the scene is MADE OF, and WHO IS IN IT — so a solitary
# figure in a mechanical world could not be expressed at all. Those five moved
# to actors.toml, which is now the second axis; every register in this file is
# a substance and nothing here decides whether a person appears.
#
# Order matters only for a cold start: an install with fewer than 10
# generations cycles this list in order before the recency rotation takes
# over, so it walks family by family and covers the whole space early.

[families]
living = [
  "botanical",
  "bodily and anatomical",
  "fungal and decaying",
  "animal and creaturely",
]

mineral = [
  "geological",
  "metallic and ore",
  "glass and ceramic",
]

built = [
  "architectural",
  "domestic interior",
  "mechanical",
  "industrial and infrastructural",
  "agricultural and cultivated",
]

fluid = [
  "aquatic",
  "atmospheric",
  "glacial and frozen",
  "fire and ember",
]

made = [
  "textile and fiber",
  "ritual object",
  "paper and inscription",
  "instrument and measure",
]

# What each register means in a given world is that style's job: every style
# has a line per register in its [<style>.registers] table, and the validator
# requires all of them. The generic [guidance] table that used to sit here
# (empty since its one entry, man-beast, moved to actors.toml on 2026-09-20)
# was removed 2026-10-16.
#
# Its rule still holds for those lines. A register is a region of image-space,
# and the model's own vocabulary for one is far larger than any list written
# here; handing it 50 nouns replaces an open space with a closed menu and every
# image starts being assembled from the same words. That is the failure this
# project has already measured twice -- see cliches.toml's header ("do not
# pre-seed it with guesses"), and AVOID_WINDOW's cut from 14 to 8 once a
# 40-item negative list turned out to steer less than the register pair was.
# So: a span and a principle, never an inventory.
